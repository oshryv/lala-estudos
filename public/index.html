      {q:"Who was the powerful ruler Marco Polo worked for in China?", opts:["Genghis Khan","Vasco da Gama","Kublai Khan","Amerigo Vespucci"], a:2, exp:"The king liked Marco because he was smart and could speak many languages."},
      {q:"ATTENTION — which famous explorer travelled along the Silk Road on his way to China?", opts:["Kublai Khan","Vasco da Gama","Christopher Columbus","Marco Polo"], a:3, exp:"Careful! Kublai Khan was the RULER Marco Polo met in China, not the explorer who travelled."},
      {q:"Name two inventions or materials Marco Polo described that were new to Europeans:", opts:["Paper money and porcelain","Cotton and wool","Silk and salt","Cars and telephones"], a:0, exp:"He also described a printing press, gunpowder and coal."},
      {q:"What did Marco Polo see in China that was new to him?", opts:["Cars and bicycles","Paper money, coal used for fires, and even pasta","Televisions","Aeroplanes"], a:1, exp:"Booklet page 60."},
      {q:"What kind of book did Marco Polo write about his travels?", opts:["A horror story","He did not write a book","A book detailing his experiences and findings in China","A book with poems and songs"], a:2, exp:"Booklet question, page 56."},
      {q:"How did people in Italy learn about Marco's adventures after he returned?", opts:["Through the newspaper","They never learned","Through television","Through the book he wrote about his travels"], a:3, exp:"Many people didn't believe his stories at first, but the book inspired future explorers."},
      {q:"Why was trading along the Silk Road considered difficult?", opts:["It was dangerous, expensive and impractical","It was too short","It was very wide and flat","There was nothing to trade"], a:0, exp:"Booklet page 56, question 9."},
      {q:"What did European rulers begin to search for as an alternative to the Silk Road?", opts:["A sea route to the North","A sea route to the East","A sea route to the West","A shorter land route"], a:1, exp:"Booklet page 56, question 10."},
      {type:'fill', q:"The ruler Marco Polo worked for in China was Kublai ______.", accept:["khan"], exp:"Kublai Khan, of the Mongols."}
     ]},

      {q:"What did Ferdinand Magellan's crew prove by sailing around the world?", opts:["That Asia and America are the same place","That the sea has no end","That the Earth is flat","That the Earth is round and that all the oceans are connected"], a:3, exp:"Magellan was a Portuguese explorer who led the first mission to sail all the way around the world."},
      {q:"Which country did Pedro Álvares Cabral find and claim for Portugal?", opts:["Brazil","Mexico","Argentina","India"], a:0, exp:"He was trying to go to India but sailed far to the west and landed in South America."},
      {q:"Which explorer landed in Brazil?", opts:["Amerigo Vespucci","Pedro Álvares Cabral","Christopher Columbus","Marco Polo"], a:1, exp:"Quiz question of the booklet."},
      {q:"In what year did Christopher Columbus sail across the Atlantic Ocean?", opts:["1453","1274","1492","1500"], a:2, exp:"He was looking for a shortcut to the spices of Asia."},

    {label:"📖 Reading: Silk Road & Age of Exploration", fixed:true,
     ctxTitle:"🐫 THE SILK ROAD & AGE OF EXPLORATION",
     ctxParas:["Long ago, people could not buy things online or fly on airplanes. If they wanted goods from far away, they had to travel! The Silk Road was not just one single road. It was a giant web of land and sea trade routes that connected Asia, the Middle East, and Europe.","Merchants traveled together in long groups called caravans using camels and horses. They traded valuable goods like soft silk cloth, tasty spices, tea, and shiny gold.","But they shared more than just items! People on the Silk Road shared ideas, news, and inventions — like how to make paper and gunpowder. In 1453, a powerful empire closed the land routes, making it very hard and expensive for Europeans to get goods from Asia.","Because the land routes were closed, European countries decided to look for a sea route to Asia. This started the Age of Exploration! Explorers set sail for three main reasons, known as the 3 Gs: Gold, God and Glory.","New inventions helped sailors navigate the deep ocean without getting lost: the magnetic compass showed which way was North, and the caravel was a new, faster ship with special triangular sails to catch the wind. Explorers like Christopher Columbus and Vasco da Gama sailed into unknown waters. Their journeys connected different parts of the world for the first time, sharing new foods like potatoes, tomatoes, and chocolate!"],
     questions:[
      {q:"True or False: the Silk Road was one single paved highway.", opts:["False","False, it was a single sea route","True, but only in China","True"], a:0, exp:"Part 2 of the study guide. It was a giant web of routes, not one road."},
      {q:"True or False: merchants traded silk, tea, and spices along the trade routes.", opts:["False","True","Only silk","Only tea"], a:1, exp:"Part 2 of the study guide."},
      {q:"True or False: the magnetic compass helped sailors find their direction at sea.", opts:["False","True","Only during the day","Only near the coast"], a:1, exp:"Part 2 of the study guide."},
      {q:"True or False: explorers only traveled to get famous; they did not care about trade.", opts:["True, only Columbus","True","False, they only cared about God","False"], a:3, exp:"Part 2. Gold — trading spices and finding gold — was one of the three reasons."},
      {q:"CAUSE: land routes to Asia were blocked. What was the EFFECT?", opts:["Europeans started searching for new routes across the ocean","The Silk Road became wider","Paper, gunpowder and silk spread across the world","New foods like corn, potatoes and chocolate were brought to Europe"], a:0, exp:"Part 4 of the study guide, item 1 → B."},
      {q:"CAUSE: merchants traded along the Silk Road. What was the EFFECT?", opts:["The land routes were closed","Paper, gunpowder and silk spread across the world","Europeans started searching for new routes across the ocean","New foods like corn, potatoes and chocolate were brought to Europe"], a:1, exp:"Part 4 of the study guide, item 2 → A."},
      {q:"CAUSE: explorers visited new continents. What was the EFFECT?", opts:["Paper, gunpowder and silk spread across the world","The Turkish Empire closed the routes","New foods like corn, potatoes and chocolate were brought to Europe","Europeans started searching for new routes across the ocean"], a:2, exp:"Part 4 of the study guide, item 3 → C."},
      {q:"According to the passage, which new foods were shared after the explorers' journeys?", opts:["Silk, tea and gold","Rice, wheat and coffee","Pepper, cinnamon and cloves","Potatoes, tomatoes and chocolate"], a:3, exp:"Passage 2 of the study guide."},
      {q:"What was the Spice Route?", opts:["The network of trade routes used to bring spices and other goods from Asia to Europe","A route used only inside China","A road made only of spices","A modern airline route"], a:0, exp:"Part 5 of the study guide. Spices came from Asia to Europe along these routes."},
      {q:"Was it easy to travel on the Spice Route?", opts:["It was easy only for the Romans","No — it was long, dangerous and expensive","Yes, it was short and safe","Yes, because there were trains"], a:1, exp:"Part 5. Travelling was long and sometimes dangerous."},
      {type:'fill', q:"The ______ was a large network of trade routes connecting Asia and Europe.", accept:["silk road","silkroad"], exp:"Word bank of the study guide."}
     ]},

    {label:"💰 Ciclos econômicos e capitanias", fixed:true,
     questions:[
      {q:"Quais foram os três ciclos econômicos do Período Colonial (1535–1822)?", opts:["Ciclo do café, ciclo do algodão e ciclo da borracha","Ciclo do pau-brasil, ciclo do açúcar e ciclo do ouro","Ciclo do pau-brasil, ciclo do café e ciclo do ouro","Ciclo do ouro, ciclo do café e ciclo do gado"], a:1, exp:"Apostila, página 15."},
      {q:"O que foi o Período Pré-Colonial (1500–1535)?", opts:["O período em que o Brasil já era colônia organizada","O período do ciclo do ouro","Os primeiros 35 anos, em que o Brasil não era prioridade para Portugal, cuja atenção estava no comércio de especiarias","O período da Independência"], a:2, exp:"Apostila, página sobre ciclos econômicos."},
      {q:"O que era o pau-brasil?", opts:["Um tipo de tecido","Um tipo de fruta","Uma pedra preciosa","Uma árvore nativa usada para extrair um corante valioso"], a:3, exp:"Foi a primeira riqueza explorada pelos portugueses."},
      {q:"Como os portugueses obtinham o pau-brasil?", opts:["Por meio do escambo, trocando objetos como machados por madeira com os indígenas","Plantando eles mesmos as árvores","Importando de Portugal","Comprando dos indígenas com moedas de ouro"], a:0, exp:"Escambo é a troca de mercadorias sem uso de dinheiro. Os indígenas foram a principal mão de obra nesse processo."},
      {q:"Em que ano foram criadas as capitanias hereditárias e por quem?", opts:["Em 1695, por Zumbi","Em 1534, pelo rei de Portugal Dom João III","Em 1500, por Pedro Álvares Cabral","Em 1822, por Dom Pedro I"], a:1, exp:"Foram criadas para organizar melhor a colonização."},
      {q:"Em quantas partes o território brasileiro foi dividido nas capitanias hereditárias?", opts:["27 partes","5 partes","15 partes","10 partes"], a:2, exp:"Cada uma foi entregue a um capitão-donatário."},
      {q:"Qual era a responsabilidade dos capitães-donatários?", opts:["Comandar navios negreiros","Governar Portugal","Desenvolver e defender suas terras, especialmente contra ataques de estrangeiros como os franceses","Apenas cobrar impostos"], a:2, exp:"Apostila, página sobre as capitanias hereditárias."},
      {q:"Onde se desenvolveu principalmente o ciclo do açúcar (1535–1700)?", opts:["Na capitania de Pernambuco, no Nordeste","Em Minas Gerais","Na Amazônia","No Rio Grande do Sul"], a:0, exp:"O açúcar se tornou a principal atividade econômica."},
      {q:"Qual era a mão de obra usada no ciclo do açúcar?", opts:["Trabalhadores europeus assalariados","Principalmente escravizados africanos e indígenas","Máquinas a vapor","Apenas os donos das terras"], a:1, exp:"Apostila, página 15."},
      {q:"Quando e onde ocorreu o ciclo do ouro?", opts:["De 1822 a 1888, em São Paulo","De 1535 a 1700, em Pernambuco","De 1695 a 1800, em Minas Gerais","De 1500 a 1530, no litoral"], a:2, exp:"No final do século XVII grandes depósitos de ouro foram encontrados em Minas Gerais."},
      {q:"O que o ouro provocou em Minas Gerais?", opts:["Encerrou o comércio com Portugal","Acabou com a escravidão","Esvaziou a região","Atraiu muitas pessoas e transformou a região no centro econômico do Brasil"], a:3, exp:"O ouro foi uma das principais fontes de riqueza para os portugueses, que cobravam impostos sobre sua extração."},
      {q:"Segundo o comparativo dos ciclos, qual era a mão de obra predominante em cada um?", opts:["Pau-brasil: indígenas (escambo) · Açúcar: escravizados africanos e indígenas · Ouro: escravizados africanos","Todos usaram apenas trabalhadores europeus","Todos usaram apenas indígenas","Todos usaram apenas máquinas"], a:0, exp:"Quadro comparativo da linha do tempo."},
      {type:'fill', q:"A troca de mercadorias sem uso de dinheiro, usada com os indígenas no ciclo do pau-brasil, chama-se ______.", accept:["escambo"], exp:"Trocavam machados e objetos por madeira."},
      {type:'fill', q:"Cada uma das 15 partes das capitanias hereditárias foi entregue a um capitão-______.", accept:["donatario","donatário"], exp:"O capitão-donatário devia desenvolver e defender a terra."}
     ]},
    {label:"⛓️ Escravidão e abolição", fixed:true,
     questions:[
      {q:"O que é migração forçada?", opts:["Quando as pessoas escolhem mudar de país","Quando as pessoas migram por não terem escolha, sendo obrigadas a fazê-lo","Quando as pessoas voltam para casa","Quando as pessoas viajam a passeio"], a:1, exp:"Foi o caso dos povos africanos trazidos ao Brasil entre os séculos XVI e XIX."},
      {q:"Por que os portugueses buscaram mão de obra africana a partir de 1530?", opts:["Porque as máquinas quebraram","Porque não havia indígenas no Brasil","Eram necessários muitos trabalhadores, difícil de obter num país pequeno como Portugal, e havia conflitos com os indígenas","Porque os africanos pediram para vir"], a:2, exp:"Era necessário buscar mão de obra para o cultivo da cana."},
      {q:"Quantos africanos foram forçados a vir para o Brasil?", opts:["Mais de 50 milhões","Cerca de 100 mil","Cerca de 500 mil","Mais de 4 milhões"], a:3, exp:"Homens, mulheres, crianças e idosos foram capturados no continente africano."},
      {q:"De quais regiões da África vinham principalmente as pessoas escravizadas?", opts:["Angola, Congo e Moçambique","Egito, Marrocos e Tunísia","África do Sul e Namíbia","Quênia e Etiópia"], a:0, exp:"Apostila, página sobre a chegada dos povos escravizados."},
      {q:"Como eram chamadas as embarcações que transportavam os escravizados?", opts:["Fragatas","Navios negreiros","Naus reais","Caravelas"], a:1, exp:"Devido às péssimas condições da viagem, muitos morriam durante a travessia do Atlântico."},
      {q:"Como eram as condições nos porões dos navios negreiros?", opts:["Confortáveis e espaçosas","Com boa alimentação e água limpa","Sem ventilação adequada, sem condições mínimas de higiene e com alimentação escassa","Com camas e banheiros para todos"], a:2, exp:"Havia uma enorme quantidade de prisioneiros nos porões."},
      {q:"Quem eram os bantos?", opts:["Um grupo de europeus","Um povo indígena brasileiro","Comerciantes portugueses","Povos que habitavam a África Central, nas regiões que hoje compreendem Angola, Congo, Gabão e Cabinda"], a:3, exp:"Apesar das diferenças étnicas, esses povos compartilhavam a mesma língua: banto."},
      {q:"Onde ficava a maior parte dos africanos que chegavam ao litoral?", opts:["Trabalhando nos engenhos de açúcar","Nas cidades grandes","Nas escolas","Nos navios"], a:0, exp:"Outros eram direcionados ao interior para fazendas, vilas e cidades de mineração e pecuária."},
      {q:"Quais estados recebiam a maior quantidade de africanos escravizados no século XIX?", opts:["Santa Catarina e Rio Grande do Sul","Bahia, Pernambuco, Maranhão, Minas Gerais, São Paulo e Rio de Janeiro","Acre, Rondônia e Roraima","Apenas São Paulo"], a:1, exp:"Eram os lugares mais desenvolvidos economicamente, que demandavam mais mão de obra."},
      {q:"Em que ano foi proibida a escravidão indígena?", opts:["1845","1822","1757","1888"], a:2, exp:"A escravidão africana persistiu até 1888."},
      {q:"Que lei os ingleses criaram em 1845?", opts:["Uma lei que criava as capitanias","Uma lei que libertava todos os escravizados","Uma lei que proibia o açúcar","Uma lei que proibia a circulação de navios negreiros e permitia tomar esses navios em alto-mar"], a:3, exp:"A Inglaterra desejava ampliar seu mercado consumidor."},
      {q:"Por que a Inglaterra queria o fim da escravidão?", opts:["Entendia que a escravidão prejudicava o aumento de seus ganhos, já que os escravizados não tinham salários para comprar os produtos","Por motivos apenas religiosos","Porque queria colonizar o Brasil","Porque não gostava de Portugal"], a:0, exp:"Apostila, página 21."},
      {q:"O que foi a Lei Áurea?", opts:["A lei que proibiu os navios negreiros","O documento assinado em 1888 pela Princesa Isabel que acabou com a escravidão no país","A lei que criou as capitanias hereditárias","A lei da Independência"], a:1, exp:"O Brasil foi o último país da América a abolir a escravidão."},
      {q:"O Brasil foi o ______ país da América a abolir a escravidão.", opts:["terceiro","décimo","último","primeiro"], a:2, exp:"Além disso, recebeu mais pessoas escravizadas do que todos os países do continente."},
      {q:"O que aconteceu com a população negra depois de 1888?", opts:["Passou a ter os mesmos salários imediatamente","Voltou toda para a África","Ainda sofreu com o preconceito e a imposição de baixos salários","Não houve mudança nenhuma na sociedade"], a:2, exp:"Pesquisas recentes mostram que pessoas negras que exercem a mesma função de uma pessoa branca recebem salários menores."},
      {q:"Segundo a lei brasileira, a realização de injúrias racistas é:", opts:["punida como crime","ignorada pela lei","permitida","apenas uma falta leve"], a:0, exp:"Várias ações e debates vêm sendo realizados para superar as marcas deixadas pela escravidão."},
      {q:"Em que ano o Brasil proclamou sua independência e sob a liderança de quem?", opts:["Em 1888, com a Princesa Isabel","Em 7 de setembro de 1822, sob a liderança de Dom Pedro I","Em 1500, com Cabral","Em 1695, com Zumbi"], a:1, exp:"Foi depois de séculos de dominação portuguesa e insatisfações com as políticas do Império Português."},
      {type:'fill', q:"O documento de 1888 que acabou com a escravidão no Brasil chama-se Lei ______.", accept:["aurea","áurea"], exp:"Assinada pela Princesa Isabel."}
     ]},
    {label:"🥁 Influência africana", fixed:true,
     questions:[
      {q:"Por quantos anos existiu a escravidão negra no Brasil?", opts:["Cerca de 100 anos","Cerca de 50 anos","Mais de 350 anos","Mais de 800 anos"], a:2, exp:"Os conhecimentos dos povos africanos foram incorporados à cultura brasileira."},
      {q:"O que é miscigenação?", opts:["Um tipo de dança","A separação entre os povos","A proibição de casamentos","A mistura entre africanos, indígenas e europeus, base da formação populacional do Brasil"], a:3, exp:"Apostila, página sobre a influência dos povos africanos na cultura brasileira."},
      {q:"Quais conhecimentos os africanos trouxeram de sua terra natal?", opts:["Tecnologias, ferramentas de trabalho, confecção de cerâmica, cestarias, frutos tropicais e formas de cultivo","Apenas conhecimentos musicais","Apenas conhecimentos religiosos","Nenhum conhecimento técnico"], a:0, exp:"Apostila, página sobre cultura brasileira."},
      {q:"Quais dessas palavras do português brasileiro têm origem africana?", opts:["Escola, caderno e lápis","Cafuné, dengo, moleque, quitanda, caçula, fubá, dendê e camundongo","Janela, mesa, livro e porta","Computador, telefone e internet"], a:1, exp:"Também marimbondo, tanga, farofa, cachimbo, abadá, cuíca, jiló, samba, miçanga e macaco."},
      {q:"Quais línguas africanas eram proibidas no Brasil?", opts:["O latim e o grego","O tupi e o guarani","Principalmente o iorubá e o banto","O francês e o inglês"], a:2, exp:"Eles eram forçados a falar o português, e muito do vocabulário africano sofreu apagamento histórico."},
      {q:"Quais cidades e lugares brasileiros têm nomes de origem africana?", opts:["Brasília e Salvador","Recife e Olinda","São Paulo e Rio de Janeiro","Caxambu e Monjolos (MG), Serra do Cafundó (PE) e o rio Angu (MG)"], a:3, exp:"Também os nomes pessoais Ada, Dalia e Dandara."},
      {q:"Quais instrumentos musicais de origem africana a apostila cita?", opts:["Berimbau, atabaque, tambor, agogô, cuíca e afoxé","Guitarra elétrica e bateria","Sanfona e triângulo","Piano, violino e flauta doce"], a:0, exp:"Também reco-reco, xequerê, caxixi, pandeiro e baqueta."},
      {q:"Quais ritmos de origem africana a apostila cita?", opts:["A polca e a mazurca","O batuque, o coco e a dança de roda da região Nordeste","O rock e o pop","O tango e a valsa"], a:1, exp:"A cultura africana é muito rica em música e dança, marcada por ritmos de percussão."},
      {q:"O que é o maracatu?", opts:["Um prato típico da Bahia","Uma religião de matriz africana","Uma dança coletiva realizada por pessoas fantasiadas, com tambor, afoxé e chocalho, fundada em Pernambuco","Um instrumento de corda"], a:2, exp:"Envolve elementos das culturas indígena e portuguesa."},
      {q:"Quando surgiu o samba e a que ele está ligado?", opts:["No século XIX, ligado à Inglaterra","No século XVIII, ligado à mineração","No século XVI, ligado à corte portuguesa","No começo do século XX, ligado às rodas de dança que os negros escravizados realizavam nos seus poucos momentos livres"], a:3, exp:"O ritmo africano se misturou a ritmos europeus como a polca, a valsa, a mazurca e o minueto, obtido por meio dos batuques."},
      {q:"O que é a capoeira?", opts:["Uma representação cultural afro-brasileira que mistura esporte, luta, dança, cultura popular, música e brincadeira","Um instrumento musical","Um prato típico","Apenas uma dança de salão"], a:0, exp:"Nasceu durante a época da escravidão no Brasil."},
      {q:"Por que a capoeira surgiu?", opts:["Como diversão dos senhores de engenho","Como forma de luta e resistência, resposta à violência a que os escravizados eram submetidos","Como esporte olímpico","Como dança da corte portuguesa"], a:1, exp:"A partir de golpes e movimentos corporais ágeis, permitia que se defendessem das perseguições dos capitães do mato."},
      {q:"Qual era a atribuição dos capitães do mato?", opts:["Comandar navios","Cuidar dos engenhos","Capturar quem havia fugido","Ensinar capoeira"], a:2, exp:"Apostila, página sobre a capoeira."},
      {q:"Quais religiões brasileiras têm origem em elementos da cultura africana?", opts:["O budismo e o xintoísmo","O judaísmo","O hinduísmo","O candomblé, a umbanda e o catimbó"], a:3, exp:"Apostila, página 23."},
      {q:"O que são os orixás, cultuados no candomblé?", opts:["Divindades africanas que representam a força da natureza","Instrumentos musicais","Nomes de cidades","Pratos típicos"], a:0, exp:"Nas cerimônias há cantos, danças e sons da batida de tambores, com oferendas de roupas, objetos, alimentos e flores."},
      {q:"Em que a umbanda se baseou?", opts:["No budismo","No candomblé, no catolicismo e no espiritismo","Na cultura indígena apenas","Apenas no candomblé"], a:1, exp:"Já o catimbó tem origem na cultura indígena e apresenta elementos do cristianismo e influências africanas."},
      {q:"Quem é Iemanjá e quando é sua festa?", opts:["É uma dança do Nordeste","É uma santa católica portuguesa","É a orixá que representa o mar, associada aos navegantes, e sua festa é em 2 de fevereiro, em Salvador","É uma orixá do fogo, festejada em janeiro"], a:2, exp:"Apostila, página 23."},
      {q:"O que acontecia com as práticas religiosas africanas na época da escravidão?", opts:["Eram incentivadas pelos senhores","Eram ensinadas nas escolas","Eram proibidas, e os africanos tinham que seguir o catolicismo","Não existiam"], a:2, exp:"Apostila, página 23."},
      {q:"O que determinou a lei 10.639?", opts:["Que o dia 20 de novembro fosse instituído como Dia da Consciência Negra","Que os quilombos fossem destruídos","Que a escravidão acabasse","Que o samba fosse ensinado nas escolas"], a:0, exp:"Nessa data, em 1695, Zumbi dos Palmares foi morto pelas forças governamentais."},
      {q:"O que foi o Quilombo dos Palmares?", opts:["Um tipo de navio","O maior refúgio de escravos fugitivos do país, localizado em Alagoas, que chegou a ter 20 mil pessoas","Um engenho de açúcar","Uma cidade portuguesa"], a:1, exp:"Zumbi foi o último líder dessa comunidade."},
      {q:"Quais ingredientes de origem africana a apostila cita na alimentação?", opts:["Batata, trigo e centeio","Maçã, pera e uva","Inhame, pimenta, gengibre, açafrão e azeite de dendê","Arroz, feijão preto e milho apenas"], a:2, exp:"As escravas africanas eram responsáveis pela cozinha dos engenhos, fazendas e casas-grandes."},
      {q:"Quais pratos famosos têm base nesses ingredientes?", opts:["A pizza e a lasanha","O estrogonofe","O sushi","O acarajé, o vatapá e o caruru"], a:3, exp:"Boa parte dos dotes culinários africanos está ligada à cozinha religiosa, com oferendas aos Orixás."},
      {q:"Segundo a apostila, qual é a polêmica sobre a feijoada?", opts:["Foi disseminada como uma mistura preparada nas senzalas com restos das casas grandes, mas alguns historiadores contestam essa versão","Que ela foi criada no século XX","Que ela não tem origem africana nenhuma","Que ela veio de Portugal"], a:0, exp:"É provável que o prato fosse consumido igualmente por todos, escravos e patrões."},
      {type:'fill', q:"O maior refúgio de escravos fugitivos do país, em Alagoas, foi o Quilombo dos ______.", accept:["palmares"], exp:"Zumbi foi seu último líder."},
      {type:'fill', q:"O dia 20 de novembro é o Dia da Consciência ______.", accept:["negra"], exp:"Instituído pela lei 10.639."}
     ]},
    {label:"🌍 Globo, continentes e oceanos", fixed:true,
     questions:[
      {q:"O que é o planisfério?", opts:["Um tipo de bússola","A representação do planeta em forma de mapa, planificado","A representação esférica do planeta","Um instrumento de navegação"], a:1, exp:"Representa a disposição dos diferentes países, continentes e oceanos."},
      {q:"Quais são as funções do planisfério?", opts:["Medir a temperatura","Mostrar o relevo apenas","Identificar e localizar países, reconhecer limites territoriais e fronteiras, e identificar continentes, hemisférios, linhas imaginárias e oceanos","Apenas mostrar as cores dos países"], a:2, exp:"Apostila, página 28."},
      {q:"O que é o globo terrestre?", opts:["Um tipo de projeção","Uma foto tirada do espaço","Um mapa plano","Uma representação do planeta na forma esférica, que mais se aproxima da forma real"], a:3, exp:"A principal função do globo terrestre e do planisfério é auxiliar na localização das diversas regiões da Terra."},
      {q:"Em que a América pode ser dividida?", opts:["América do Norte, América Central e América do Sul","Quatro partes","Apenas Norte e Sul","Não pode ser dividida"], a:0, exp:"Porém, estamos em um único continente: América. Todos os seus habitantes são americanos."},
      {q:"O que a apostila diz sobre a Antártida?", opts:["Tem grandes cidades","Não há divisão de países, apenas bases de pesquisa, e não há habitantes fixos","É dividida em cinco países","É o continente mais quente"], a:1, exp:"É um continente quase totalmente coberto de gelo e a região mais fria da Terra."},
      {q:"Por que a mineração é proibida na Antártida?", opts:["Porque não existem minérios lá","Porque a ONU nunca discutiu o assunto","Porque, apesar de alguns países terem interesse em suas riquezas minerais, oficialmente nenhum país é proprietário de qualquer pedaço de terra lá","Porque faz frio demais para trabalhar"], a:2, exp:"Apostila, seção Você Sabia?"},
      {q:"Quem mora na Antártida?", opts:["Ninguém, nunca","Uma população nativa antiga","Pesquisadores de várias nações, como Estados Unidos, África do Sul, Nova Zelândia, Argentina, China, Brasil, Polônia, Austrália e Rússia","Apenas cientistas brasileiros"], a:2, exp:"A Antártida não tem habitantes nativos."},
      {q:"Como é formada a Oceania?", opts:["Por uma extensão de terras mais isoladas, onde ficam Austrália e Nova Zelândia, além de um conjunto de ilhas","Por terras ligadas à Ásia","Por dois países apenas","Por um único bloco de terra"], a:0, exp:"Apostila, página 29."},
      {q:"Por que África, Europa e Ásia são continentes separados se formam uma grande extensão de terra?", opts:["Porque há oceanos entre eles","Porque a fronteira entre eles foi elaborada considerando fatores políticos, culturais e naturais","Porque foram separados por terremotos","Porque cada um fica num hemisfério"], a:1, exp:"Apostila, página 29."},
      {q:"Quanto da superfície do planeta é coberta por água?", opts:["Cerca de 50%","Cerca de 97%","Cerca de 70%","Cerca de 30%"], a:2, exp:"Por isso poderia ser chamado de 'planeta Água'."},
      {q:"Quantos oceanos existem e quais são?", opts:["7 oceanos","2 oceanos","3 oceanos","5: Pacífico, Atlântico, Índico, Glacial Ártico e Glacial Antártico"], a:3, exp:"Apostila, página 29."},
      {q:"Qual é a proporção de água salgada e doce no planeta?", opts:["Cerca de 97% é salgada e apenas 3% é doce","97% doce e 3% salgada","70% salgada e 30% doce","50% e 50%"], a:0, exp:"Apostila, página 29."},
      {q:"Em relação ao mundo, onde está o território brasileiro?", opts:["No hemisfério Norte e Ocidental","Em sua maior parte no hemisfério Sul e na porção Ocidental","No hemisfério Norte e Oriental","No hemisfério Sul e Oriental"], a:1, exp:"Estamos no continente chamado América e o oceano que nos banha é o Atlântico."},
      {q:"Quais são os dois únicos países da América do Sul que NÃO fazem fronteira com o Brasil?", opts:["Uruguai e Paraguai","Colômbia e Venezuela","Equador e Chile","Peru e Bolívia"], a:2, exp:"Apostila, página sobre Brasil e América do Sul."},
      {type:'fill', q:"O oceano que banha o Brasil é o ______.", accept:["atlantico","atlântico"], exp:"Oceano Atlântico."}
     ]},
    {label:"📐 Linhas imaginárias", fixed:true,
     questions:[
      {q:"Por que as linhas do mapa são chamadas de LINHAS IMAGINÁRIAS?", opts:["Porque ninguém as usa","Porque foram inventadas por um escritor","Porque mudam de lugar todo ano","Porque não estão traçadas na superfície da Terra, são apenas uma representação"], a:3, exp:"Foram criadas para facilitar a localização dos diversos lugares existentes no mundo."},
      {q:"O que a Linha do Equador divide?", opts:["O planeta em Hemisfério Norte e Hemisfério Sul","O planeta em Ocidental e Oriental","O Brasil em cinco regiões","Os oceanos entre si"], a:0, exp:"Ela divide o planeta em 2 partes."},
      {q:"O que o Meridiano de Greenwich divide?", opts:["A América em três partes","O planeta em Hemisfério Ocidental e Hemisfério Oriental","O planeta em Norte e Sul","Os continentes entre si"], a:1, exp:"É uma linha imaginária que divide o mundo verticalmente."},
      {q:"Por que o Meridiano de Greenwich passa por Londres?", opts:["Porque foi sorteado","Porque a Inglaterra tinha os melhores mapas","Porque, ao final do século XIX, escolheu-se essa cidade em uma convenção, já que era o grande centro econômico da época","Porque Londres fica no meio do mundo"], a:2, exp:"Apostila, página 31."},
      {q:"O que são os PARALELOS?", opts:["Linhas na mesma direção do Meridiano de Greenwich","Linhas que ligam os polos","Linhas que não existem no mapa","Linhas imaginárias que estão na mesma direção da Linha do Equador"], a:3, exp:"Definição literal do quadro da apostila, página 31."},
      {q:"O que são os MERIDIANOS?", opts:["Linhas imaginárias que estão na mesma direção do Meridiano de Greenwich","Linhas coloridas do mapa","Linhas na mesma direção da Linha do Equador","Linhas que só existem no hemisfério Norte"], a:0, exp:"Definição literal do quadro da apostila, página 31."},
      {q:"Quais são os principais paralelos?", opts:["Greenwich e o Equador","Círculo Polar Ártico, Círculo Polar Antártico, Trópico de Câncer e Trópico de Capricórnio","Apenas os dois trópicos","Apenas os dois círculos polares"], a:1, exp:"Em cada hemisfério foram traçadas linhas paralelas à Linha do Equador."},

  // ===== 3º TRIMESTRE (agenda do Guia de Estudos; perguntas entram depois) =====
  {key:"social3",tri:3,label:"Social Studies",color:"#5F5E5A",lang:"en",exam:"2026-11-09",subtopics:[{"label": "Communities: urban, suburban, rural", "fixed": true, "questions": [{"q": "Geographers group communities into three main types. Which list is correct?", "opts": ["Urban, suburban and rural", "City, town and village", "Big, medium and small", "Farm, factory and store"], "a": 0, "exp": "Geographers group communities by where they are, how big they are and how many people live there: urban, suburban and rural."}, {"type": "fill", "q": "A community located just outside a large city is called a ______ community.", "accept": ["suburban"], "exp": "Suburban means just outside a big city: a quieter life, houses with yards and fewer people."}, {"q": "Which place has a very low population density, with houses far apart?", "opts": ["An urban area", "A suburban area", "A rural area", "A busy city center"], "a": 2, "exp": "Rural areas are far from cities. Only a few people live spread out over large spaces."}, {"type": "vf", "q": "Read each sentence. Choose True or False.", "items": [{"t": "Urban areas have a very high population density.", "v": true}, {"t": "Suburban areas are usually noisier and busier than cities.", "v": false}, {"t": "In rural areas you can find big farms, ranches, open fields and forests.", "v": true}, {"t": "Rural communities are located right next to the city center.", "v": false}], "exp": "Urban = many people in a small space. Suburban = quieter than the city. Rural = far from cities, with farms and nature."}, {"type": "classify", "q": "Where would you most likely see each of these? Choose the community.", "cats": ["Urban", "Suburban", "Rural"], "items": [{"t": "Skyscrapers and subway trains", "c": 0}, {"t": "Single-family houses with yards and wide playgrounds", "c": 1}, {"t": "A ranch with open fields and a tractor", "c": 2}, {"t": "Busy streets with museums and theaters", "c": 0}, {"t": "A neighborhood shopping center near a big city", "c": 1}], "exp": "Tall buildings and public transport are urban. Houses with yards near a city are suburban. Farms and open fields are rural."}, {"type": "classify", "q": "Where does each person most likely work? Choose the community.", "cats": ["Urban", "Suburban", "Rural"], "items": [{"t": "A rancher who takes care of cattle", "c": 2}, {"t": "A window cleaner on tall skyscrapers", "c": 0}, {"t": "A teacher at a neighborhood school with a big playground", "c": 1}, {"t": "A person who sells tractors to farmers", "c": 2}, {"t": "A subway train driver", "c": 0}], "exp": "Think about what is around the job: farms and animals are rural, skyscrapers and subways are urban, neighborhood schools are suburban."}, {"q": "Many adults who live in the suburbs commute. What does commute mean?", "opts": ["Move to a new city", "Travel from home to work and back again", "Work from home all day", "Grow food on a farm"], "a": 1, "exp": "To commute is to travel from your suburban home to your job in the urban center in the morning and return home in the evening."}, {"q": "Why are parks and green areas essential in busy cities?", "opts": ["They make the streets busier", "They make the buildings taller", "They replace all the stores", "They help clean the air, keep temperatures cool and give families space to play"], "a": 3, "exp": "Green areas are essential for sustainable living: they clean the air, keep the city cool and give children and families open space."}, {"type": "fill", "q": "The economy in rural areas is driven by agriculture, livestock and ______.", "accept": ["forestry"], "exp": "Farms, animals and forests are the main work in the countryside. Forestry means working with trees and wood."}, {"q": "A push factor is something that...", "opts": ["attracts people to a new community", "happens only in rural areas", "makes people want to leave their current home", "is always something good"], "a": 2, "exp": "Push = negative, it pushes people away (lack of jobs, famine, natural disasters). Pull = positive, it pulls people in."}, {"q": "Which one is a PULL factor?", "opts": ["A lack of jobs", "Better schools and safer neighborhoods", "Famine", "A natural disaster"], "a": 1, "exp": "A pull factor is something positive that attracts people to a new community, like better schools, safer neighborhoods or exciting job opportunities."}, {"q": "A family wants a quiet neighborhood with a big yard, but both parents work in the city center. Which community fits best, and what will they do every day?", "opts": ["Rural; they will walk to work", "Urban; they will drive on quiet country roads", "Rural; they will take the subway", "Suburban; they will commute to the city"], "a": 3, "exp": "Quiet streets and yards are suburban. Since the jobs are in the city, the parents commute every day."}, {"type": "short", "q": "Describe one difference between an urban and a suburban community.", "model": "Urban areas are big, busy cities with tall buildings and many people close together. Suburban areas are quieter, just outside the city, with houses with yards and fewer people.", "exp": "Compare size, crowding and buildings: urban is bigger and more crowded, suburban is quieter with houses and yards."}]}, {"label": "Economic sectors", "fixed": true, "questions": [{"q": "The primary sector deals with...", "opts": ["Making products in factories", "Selling goods in stores", "Raw materials taken directly from nature", "Teaching and healthcare"], "a": 2, "exp": "Primary sector = harvesting, extracting or gathering raw materials from nature, like farming, fishing, forestry and mining."}, {"type": "fill", "q": "Natural resources that come directly from the Earth, like soil, water, trees and minerals, are called ______ materials.", "accept": ["raw"], "exp": "Raw materials are natural resources that come directly from the Earth. They are the starting point of every product."}, {"type": "classify", "q": "Put each job in the right economic sector.", "cats": ["Primary", "Secondary", "Tertiary"], "items": [{"t": "A farmer growing cotton", "c": 0}, {"t": "A factory worker sewing T-shirts", "c": 1}, {"t": "A doctor checking a patient's health", "c": 2}, {"t": "A miner digging for coal", "c": 0}, {"t": "A carpenter building a table", "c": 1}, {"t": "A bus driver taking children to school", "c": 2}], "exp": "Primary: gets raw materials. Secondary: makes products. Tertiary: provides services and sells goods."}, {"type": "vf", "q": "Read each sentence. Choose True or False.", "items": [{"t": "A fisherman works in the primary sector.", "v": true}, {"t": "A person who makes clothes in a factory works in the secondary sector.", "v": true}, {"t": "The tertiary sector harvests raw materials.", "v": false}, {"t": "Most primary sector work happens in rural areas.", "v": true}, {"t": "Urban areas usually have more farms than rural areas.", "v": false}], "exp": "Fishing is primary. Factory work is secondary. The tertiary sector sells goods and gives services, and most farms are in rural areas."}, {"type": "match", "q": "Match each economic sector with what it does.", "left": ["Primary sector", "Secondary sector", "Tertiary sector"], "right": ["Gathers raw materials from nature", "Turns raw materials into finished products", "Provides services and sells goods"], "exp": "Primary gathers, secondary manufactures, tertiary delivers and helps."}, {"q": "What is a good?", "opts": ["A job in a factory", "A physical object you can touch and buy", "A natural resource", "An activity someone does for you"], "a": 1, "exp": "A good is an object you can touch and buy, like an apple, a toy or a book. A service is work someone does for you."}, {"q": "Which one is an example of a SERVICE?", "opts": ["An apple", "A toy", "A mechanic repairing a car", "A book"], "a": 2, "exp": "Apples, toys and books are goods because you can touch them. A mechanic is doing work for you, so it is a service."}, {"q": "What does manufacturing mean?", "opts": ["Gathering raw materials from the ground", "The work of processing, building and making things by hand or with machines", "Selling products in a grocery store", "Passing local laws"], "a": 1, "exp": "Manufacturing is the work of processing, building and making things, by hand or with powerful machines. People who do this are called manufacturers."}, {"type": "order", "q": "Put the journey of a T-shirt in the right order.", "items": ["A farmer grows cotton in a field", "A factory spins the cotton into thread and sews a T-shirt", "A truck driver delivers the T-shirt", "A clothing store sells it to a family"], "exp": "Primary (grow cotton) comes first, then secondary (make the T-shirt), then tertiary (deliver and sell)."}, {"q": "Why are the primary and secondary sectors interdependent?", "opts": ["They never work together", "Only the secondary sector needs the other", "Both work only in cities", "Factories need raw materials, and farmers and miners need tools and machines built in factories"], "a": 3, "exp": "Interdependent means they depend on each other. The secondary sector needs raw materials, and the primary sector needs tractors and tools made in factories."}, {"type": "multi", "q": "Which of these are renewable resources? Choose all the correct ones.", "opts": ["Trees", "Oil", "Agricultural crops", "Coal"], "answers": [0, 2], "exp": "Renewable resources can grow back or be replaced over time, like trees and crops. Oil and coal are non-renewable."}, {"type": "fill", "q": "Oil, metals and coal are non-______ resources. Once we use them up, they are gone forever.", "accept": ["renewable"], "exp": "Non-renewable resources cannot be replaced. That is why sustainable manufacturing uses smart technologies and recycling."}, {"q": "A truck driver takes fruit from a farm to a factory that packages it, and then to a grocery store. In which sector does the truck driver work?", "opts": ["Primary, because the fruit is a raw material", "Secondary, because the fruit is packaged", "Tertiary, because he provides a transport service", "Primary, because he works in the countryside"], "a": 2, "exp": "Moving things from place to place is a service, so transport is the tertiary sector. The truck driver connects all three sectors."}, {"type": "short", "q": "Explain with an example why the city needs the countryside and the countryside needs the city.", "model": "The city needs the countryside for food, like fruit and milk from farms. The countryside needs the city for things like machinery, medical services and universities.", "exp": "This is interdependence: rural areas supply food and raw materials, and cities supply machines, specialized services and education."}]}, {"label": "Supply, demand and government", "fixed": true, "questions": [{"q": "What is supply?", "opts": ["How much people want or need a product", "The price of a product", "How much of a product or service is available for people to buy", "A kind of job"], "a": 2, "exp": "Supply is how much of a product or service is available to buy. Demand is how much people want or need it."}, {"q": "What is demand?", "opts": ["How much people want or need a product or service", "How many stores a city has", "How many factories make a product", "How many trucks deliver it"], "a": 0, "exp": "Demand is how much people want or need a product or service."}, {"type": "vf", "q": "Read each sentence. Choose True or False.", "items": [{"t": "Markets in the tertiary sector are guided by supply and demand.", "v": true}, {"t": "A grocery store, a bank and a hospital are part of the tertiary sector.", "v": true}, {"t": "Government offices belong to the primary sector.", "v": false}], "exp": "Stores, banks, hospitals and government offices all provide services or sell goods, so they are tertiary. Their markets follow supply and demand."}, {"q": "Many families in a suburb want more fresh milk. What do the dairy farmers in rural areas need to do?", "opts": ["Produce less milk", "Produce more milk to supply the stores", "Close their farms", "Stop selling milk"], "a": 1, "exp": "When demand goes up, the supply has to go up too. Farmers produce more, so more milk reaches the stores. Careful: supply does not decrease."}, {"q": "When demand for a product goes up, what usually has to happen to the supply?", "opts": ["It disappears", "It never changes", "It must decrease", "It must increase"], "a": 3, "exp": "More demand means more people want the product, so more of it must be supplied. Higher demand, higher supply."}, {"type": "fill", "q": "A mayor and council members work in the municipal ______, where they write local laws.", "accept": ["chamber"], "exp": "In municipal governments, leaders like the mayor and council members work in the municipal chamber. They write local laws and decide how public money is spent."}, {"type": "multi", "q": "What do municipal governments do? Choose all the correct ones.", "opts": ["Write local laws and decide how public money is spent", "Harvest cotton in the fields", "Provide public services like safe roads and clean water", "Build furniture in workshops"], "answers": [0, 2], "exp": "Government and public services organize and protect our communities: roads, waste, vaccinations, clean water. Harvesting and building are primary and secondary jobs."}, {"q": "A family is choosing where to live. Which one is a NEED, not a want?", "opts": ["A swimming pool", "A second car", "A big TV", "A safe place to live and a way to get around"], "a": 3, "exp": "Needs are basic resources like shelter and transportation. Recreation, pools and extra things are usually wants."}, {"q": "A town has many new families, but only one small grocery store. Long lines and empty shelves appear. Using supply and demand, what is the best explanation?", "opts": ["Supply is higher than demand", "Nobody wants groceries", "Demand is higher than the supply available in the store", "The store is in the primary sector"], "a": 2, "exp": "Many people want groceries (high demand), but the store has too little to sell (low supply). The store needs more supply."}, {"type": "short", "q": "How does the government help keep a community healthy and safe? Give two examples.", "model": "The government builds safe roads and provides public health services like vaccinations. It also manages waste and provides clean water systems.", "exp": "Public services include safe roads, vaccinations, waste management and clean water, to keep everyone healthy and safe."}]}, {"label": "Full exam (all topics)", "fixed": true, "questions": [{"type": "fill", "q": "Word bank: urban, suburban, rural, commute. A(n) ______ area is a big city with tall buildings and many people.", "accept": ["urban"], "exp": "Urban areas are large, bustling cities with a very high population density."}, {"type": "fill", "q": "Word bank: urban, suburban, rural, commute. Many adults who live in the suburbs ______ to the city every morning and return home in the evening.", "accept": ["commute"], "exp": "To commute is to travel from home to work and back."}, {"type": "fill", "q": "Word bank: urban, suburban, rural, commute. A ______ area is far from cities and has farms and open fields.", "accept": ["rural"], "exp": "Rural areas are far from cities and suburbs, in the countryside."}, {"type": "fill", "q": "Word bank: urban, suburban, rural, commute. A ______ area is a quiet neighborhood just outside a city, with houses and yards.", "accept": ["suburban"], "exp": "Suburban areas are just outside large cities and have a lower population density."}, {"type": "vf", "q": "Read each sentence. Choose True or False.", "items": [{"t": "People in rural areas mostly work in the tertiary sector.", "v": false}, {"t": "Suburban areas are located just outside big cities.", "v": true}, {"t": "Mining is part of the primary sector.", "v": true}, {"t": "A teacher works in the secondary sector.", "v": false}, {"t": "Factories are usually in suburban or industrial urban areas.", "v": true}], "exp": "Rural jobs are mostly primary. Teachers give a service, so they are tertiary. Factories (secondary) are often in suburban or urban areas."}, {"type": "classify", "q": "Where does each person most likely work? Choose the community.", "cats": ["Urban", "Suburban", "Rural"], "items": [{"t": "A cattle rancher", "c": 2}, {"t": "A person who drives a city bus full of passengers", "c": 0}, {"t": "A librarian in a neighborhood library near a big city", "c": 1}, {"t": "A lumberjack", "c": 2}], "exp": "Match the job with the place: forests and ranches are rural, buses in big traffic are urban, neighborhood libraries near a city are suburban."}, {"type": "match", "q": "Match each worker with the sector.", "left": ["A lumberjack", "A T-shirt factory worker", "A bank teller"], "right": ["Primary sector", "Secondary sector", "Tertiary sector"], "exp": "Cutting trees gathers a raw material (primary). Making T-shirts is manufacturing (secondary). Banks give services (tertiary)."}, {"q": "Which pair shows a good and a service?", "opts": ["A doctor visit and a teacher's lesson", "An apple and a mechanic fixing a car", "A toy and a book", "A bus ride and a haircut"], "a": 1, "exp": "An apple is a good (you can touch it). A mechanic fixing a car is a service (work done for you)."}, {"type": "order", "q": "Put the journey of a wooden table in the right order.", "items": ["A lumberjack cuts down trees in a forest", "A carpenter turns the logs into a table in a workshop", "A truck delivers the table to a furniture store", "A family buys the table"], "exp": "Primary (trees) → secondary (table) → tertiary (delivery and store)."}, {"q": "Many people in a city want more bread. What should the bakeries do?", "opts": ["Make less bread", "Make more bread to supply the stores", "Close the shops", "Stop selling bread"], "a": 1, "exp": "High demand means more supply is needed, so bakeries produce more."}, {"q": "Which sentence explains interdependence?", "opts": ["The city needs the countryside for food, and the countryside needs the city for machinery and services", "Only farmers need other people", "Rural and urban areas never help each other", "Factories do not need raw materials"], "a": 0, "exp": "Communities and sectors depend on each other: food and raw materials come from rural areas, machines and specialized services come from cities."}, {"type": "multi", "q": "Which of these are non-renewable resources? Choose all the correct ones.", "opts": ["Oil", "Trees", "Coal", "Agricultural crops"], "answers": [0, 2], "exp": "Non-renewable resources are gone forever once used, like oil, metals and coal. Trees and crops can grow back."}, {"q": "Which is a PUSH factor?", "opts": ["Exciting job opportunities", "Safer neighborhoods", "A lack of jobs", "Better schools"], "a": 2, "exp": "A push factor is negative and makes people leave, like a lack of jobs, famine or natural disasters."}, {"type": "short", "q": "Choose one area (urban, suburban or rural) and describe a job someone might have there. Say if the job is primary, secondary or tertiary.", "model": "In a rural area, someone might work as a farmer. This is a job in the primary sector because it involves using natural resources.", "exp": "Say the area, the job and the sector, then explain why: primary gathers raw materials, secondary makes products, tertiary gives services."}, {"q": "A farmer grows fresh fruit in a rural area. A truck driver carries it to a factory that packs it, and then to a store in the city. How many different sectors are involved?", "opts": ["One", "Two", "Three", "None"], "a": 2, "exp": "Farmer = primary, factory = secondary, truck driver and store = tertiary. Three sectors work together."}]}]},
  {key:"ciencias3",tri:3,label:"Ciências",color:"#378ADD",lang:"pt",exam:"2026-11-11",subtopics:[{"label": "Microrganismos e decomposição", "fixed": true, "questions": [{"q": "O que são microrganismos?", "opts": ["Animais grandes que vivem na água", "Seres vivos tão pequenos que só podemos ver com a ajuda de um microscópio", "Plantas pequenas que crescem no solo", "Seres que só existem dentro do corpo do homem"], "a": 1, "exp": "Microrganismos são formas de vida que não podem ser vistas sem microscópio. Por isso a palavra tem \"micro\"."}, {"type": "fill", "q": "Para ver os microrganismos precisamos de um ______.", "accept": ["microscópio", "microscopio"], "exp": "Os microrganismos são pequenos demais para os olhos. O microscópio faz eles aparecerem grandes."}, {"type": "multi", "q": "Onde os microrganismos podem ser encontrados? Marque TODAS as certas.", "opts": ["No ar", "No solo", "No corpo do homem", "Somente dentro de laboratórios"], "answers": [0, 1, 2], "exp": "Eles estão no ar, no solo, na água e até em nós. Não vivem só em laboratórios."}, {"type": "fill", "q": "Os microrganismos que estudamos neste trimestre são as bactérias e os ______.", "accept": ["fungos", "fungo"], "exp": "O foco da apostila é em bactérias e fungos."}, {"q": "Como se chama o processo em que fungos e bactérias transformam restos de plantas e animais mortos?", "opts": ["Fermentação", "Decomposição", "Vacinação", "Fotossíntese"], "a": 1, "exp": "Decomposição é a \"limpeza\" da natureza. Quem faz isso são os decompositores: fungos e bactérias."}, {"q": "Qual é a importância da decomposição para a natureza?", "opts": ["Ela deixa o solo sem nutrientes", "Ela mata todas as plantas", "Ela produz o gás carbônico do pão", "Os nutrientes voltam ao meio ambiente e outros seres vivos podem usá-los"], "a": 3, "exp": "Pela decomposição, muitos nutrientes retornam ao meio ambiente. É a reciclagem da natureza."}, {"type": "vf", "q": "Leia as frases e marque Verdadeiro (V) ou Falso (F).", "items": [{"t": "Fungos e bactérias são os principais decompositores da natureza.", "v": true}, {"t": "Todos os microrganismos fazem mal para a nossa saúde.", "v": false}, {"t": "Sem a decomposição, os nutrientes não seriam reaproveitados por outros seres vivos.", "v": true}, {"t": "A decomposição transforma matéria orgânica em produtos inorgânicos.", "v": true}, {"t": "Os microrganismos só existem em lugares sujos e longe das pessoas.", "v": false}], "exp": "Fungos e bactérias reciclam os nutrientes. Muitos microrganismos são úteis e eles estão em todo lugar, até em nós."}, {"q": "Maria esqueceu morangos na fruteira por muitos dias e eles ficaram com manchas branquinhas peludas. O que está acontecendo com os morangos?", "opts": ["Estão sendo decompostos por fungos (mofo)", "Estão fazendo fotossíntese", "Estão sendo vacinados", "Estão virando antibiótico"], "a": 0, "exp": "Morangos mofados ou \"embolorados\" mostram a decomposição acontecendo, feita por fungos."}, {"type": "order", "q": "Coloque na ordem o que acontece na decomposição de uma folha caída no chão.", "items": ["Uma folha cai da árvore no solo", "Fungos e bactérias decompõem a folha", "A matéria orgânica vira produtos inorgânicos", "Os nutrientes voltam ao solo e outros seres vivos os aproveitam"], "exp": "A folha morre, os decompositores trabalham e os nutrientes voltam para a natureza."}, {"type": "match", "q": "Ligue cada palavra ao seu significado.", "left": ["Microrganismos", "Decompositores", "Matéria orgânica"], "right": ["Seres vivos que só se veem com microscópio", "Fungos e bactérias que decompõem restos de seres vivos", "Restos de plantas e animais"], "exp": "Os decompositores (fungos e bactérias) transformam a matéria orgânica. Os dois grupos são microrganismos."}, {"type": "short", "q": "Qual é a importância do processo de decomposição na natureza? Responda com uma frase completa.", "model": "A decomposição é importante porque fungos e bactérias transformam matéria orgânica em produtos inorgânicos, e os nutrientes voltam ao meio ambiente para outros seres vivos.", "exp": "Use a palavra PORQUE: os decompositores transformam os restos e os nutrientes voltam para a natureza."}, {"q": "Qual microrganismo sempre precisa de um corpo (um hospedeiro) para morar?", "opts": ["O cogumelo", "A levedura", "O vírus", "O mofo"], "a": 2, "exp": "O resumo de estudo mostra o vírus como o microrganismo que sempre precisa de um corpo para morar. Fungos e bactérias também podem viver soltos na natureza."}]}, {"label": "Fungos", "fixed": true, "questions": [{"q": "O que podemos dizer sobre o alimento dos fungos?", "opts": ["Eles produzem alimento com a luz do sol, como as plantas", "Eles não precisam de alimento", "Eles só comem plantas vivas", "Eles não produzem o próprio alimento"], "a": 3, "exp": "Os fungos não fazem o próprio alimento. Por isso decompõem restos ou vivem em outros seres."}, {"type": "fill", "q": "Os fungos formam um reino só deles, chamado Reino ______.", "accept": ["fungi"], "exp": "Fungos não são plantas nem animais. Eles são do Reino Fungi."}, {"q": "Os fungos são plantas?", "opts": ["Não: eles têm características muito diferentes e formam o Reino Fungi", "Sim: eles fazem fotossíntese", "Sim: eles têm folhas e raízes", "Não: eles são animais"], "a": 0, "exp": "A apostila diz que os fungos também não são plantas e por isso foram classificados em um reino específico."}, {"type": "multi", "q": "Onde podem ser encontrados fungos? Marque TODAS as certas.", "opts": ["No solo", "Na água", "Em detritos em geral", "Somente no fundo do mar"], "answers": [0, 1, 2], "exp": "Os fungos aparecem no solo, na água, em vegetais, em animais, no homem e em detritos."}, {"type": "classify", "q": "Qual é o papel de cada fungo? Escolha o certo.", "cats": ["Decompositor", "Causa doença", "Faz medicamento"], "items": [{"t": "Orelha-de-pau na madeira", "c": 0}, {"t": "Mofo em um pão esquecido", "c": 0}, {"t": "Frieira no pé", "c": 1}, {"t": "Ferrugem nas folhas", "c": 1}, {"t": "Micose na unha", "c": 1}, {"t": "Penicillium, que dá a penicilina", "c": 2}], "exp": "Decompositores comem restos. Alguns fungos causam doenças como micose, frieira e ferrugem. Outros, como o Penicillium, fazem antibióticos."}, {"type": "fill", "q": "A doença das plantas que deixa manchas cor de laranja nas folhas se chama ______.", "accept": ["ferrugem"], "exp": "A ferrugem é causada por fungos e pode levar à perda de plantações inteiras."}, {"q": "Qual destas doenças é causada por fungos?", "opts": ["Pneumonia", "Otite", "Frieira", "Dor de cabeça"], "a": 2, "exp": "Micoses de pele, unha e frieira são causadas por fungos. Pneumonia e otite são causadas por bactérias."}, {"q": "Para que serve a penicilina?", "opts": ["Para fazer o pão crescer", "Para combater bactérias que causam doenças", "Para colorir os queijos", "Para decompor folhas secas"], "a": 1, "exp": "A penicilina é um antibiótico feito com substâncias de fungos que matam bactérias."}, {"type": "fill", "q": "Alexander Fleming descobriu a ______ em 1928.", "accept": ["penicilina", "pencilina"], "exp": "A penicilina foi descoberta por acaso por Fleming, um médico e bacteriologista escocês."}, {"type": "order", "q": "Coloque a história da descoberta de Fleming na ordem certa.", "items": ["Fleming esqueceu seu material de estudo na mesa e saiu de férias", "Ao voltar, viu que o material estava com mofo", "Percebeu que em volta do mofo não havia bactérias", "Concluiu que o mofo bloqueava as bactérias e chamou a substância de penicilina"], "exp": "A descoberta foi acidental: o mofo mostrou que algo nele impedia o crescimento das bactérias."}, {"q": "Por que a descoberta da penicilina foi tão importante para a humanidade?", "opts": ["Porque ela combate bactérias e salvou milhares de vidas, como as de soldados na Segunda Guerra Mundial", "Porque ela faz as plantas crescerem mais rápido", "Porque ela serve para fazer pão", "Porque ela mata todos os vírus"], "a": 0, "exp": "A penicilina foi produzida em larga escala na Segunda Guerra e salvou muita gente. É um antibiótico, e antibióticos agem contra bactérias."}, {"q": "A descoberta da penicilina foi acidental. Por quê?", "opts": ["Porque Fleming tomou o remédio sem querer", "Porque as bactérias fabricaram a penicilina", "Porque Fleming não planejou o mofo: ele apareceu no material esquecido durante as férias", "Porque a penicilina já existia nas padarias"], "a": 2, "exp": "O mofo contaminou o material por acaso. Fleming percebeu que não havia bactérias em volta e entendeu o que aquilo significava."}, {"type": "vf", "q": "Marque Verdadeiro (V) ou Falso (F).", "items": [{"t": "Os fungos produzem o seu próprio alimento.", "v": false}, {"t": "Todas as espécies de fungos são vistas apenas ao microscópio.", "v": false}, {"t": "Alguns fungos fazem substâncias que matam bactérias.", "v": true}, {"t": "Todos os fungos causam doenças.", "v": false}, {"t": "A maioria dos fungos decompositores vive no solo.", "v": true}, {"t": "Os fungos podem causar doenças em plantas, como a ferrugem.", "v": true}], "exp": "Cogumelos se veem a olho nu. Fungos não fazem o próprio alimento e nem todos causam doenças: muitos ajudam."}, {"type": "short", "q": "Dê 3 exemplos do que os fungos podem fazer. Explique.", "model": "Os fungos podem decompor restos de plantas e animais, causar doenças como micose, frieira e ferrugem, produzir medicamentos como a penicilina e ajudar a fazer alimentos como pão, queijo e shoyu.", "exp": "Escolha três funções: decompor, causar doenças, fazer medicamentos, fazer alimentos. Explique cada uma com um exemplo."}]}, {"label": "Fungos na alimentação", "fixed": true, "questions": [{"q": "Qual destes alimentos é um fungo comestível?", "opts": ["Alface", "Cenoura", "Arroz", "Cogumelo champignon"], "a": 3, "exp": "Champignon, shimeji e shitake são cogumelos: fungos que podemos comer."}, {"type": "multi", "q": "Quais destes são cogumelos comestíveis? Marque TODAS as certas.", "opts": ["Champignon", "Shimeji", "Shitake", "Mofo do pão"], "answers": [0, 1, 2], "exp": "Champignon, shimeji e shitake são comestíveis. Mofo no pão é sinal de alimento estragado. E nem todo cogumelo da natureza pode ser comido."}, {"q": "A apostila diz que os cogumelos comestíveis são macroscópicos. O que isso quer dizer?", "opts": ["Que só se veem com microscópio", "Que podem ser vistos a olho nu", "Que são venenosos", "Que vivem só na água"], "a": 1, "exp": "Macro = grande. Macroscópico é o que dá para ver sem microscópio."}, {"type": "fill", "q": "O molho shoyu é feito pela fermentação da ______ por um fungo.", "accept": ["soja"], "exp": "O shoyu vem da fermentação da soja."}, {"type": "match", "q": "Ligue cada alimento ou bebida ao que acontece na fabricação.", "left": ["Vinho", "Cerveja", "Molho shoyu", "Pão"], "right": ["Fermentação da uva", "Fermentação da cevada", "Fermentação da soja por um fungo", "Leveduras (fermento) fazem a massa crescer"], "exp": "Vinho vem da uva, cerveja da cevada, shoyu da soja. No pão, as leveduras fazem a fermentação."}, {"type": "fill", "q": "As leveduras, usadas na fabricação do pão, também são chamadas de ______.", "accept": ["fermento"], "exp": "Leveduras são fungos e também são conhecidas como fermento."}, {"type": "fill", "q": "BANCO: crescimento – gás carbônico – fermentação. O fermento biológico faz a ______ dos açúcares da massa.", "accept": ["fermentação", "fermentacao"], "exp": "As leveduras fermentam os açúcares do pão."}, {"type": "fill", "q": "BANCO: crescimento – gás carbônico – fermentação. Esse processo libera o ______ (CO2).", "accept": ["gás carbônico", "gas carbonico", "gás carbonico", "co2"], "exp": "A fermentação libera gás carbônico (CO2)."}, {"type": "fill", "q": "BANCO: crescimento – gás carbônico – fermentação. O gás carbônico forma os furinhos do pão e ajuda no ______ da massa.", "accept": ["crescimento"], "exp": "O gás faz bolinhas na massa, que cresce e fica fofinha."}, {"q": "Para que serve o fermento biológico na massa do pão?", "opts": ["Para deixar o pão mais duro", "Para matar as bactérias da farinha", "Para dar cor azul ao pão", "Para fazer a massa crescer e ficar fofinha por meio da fermentação"], "a": 3, "exp": "As leveduras fermentam o açúcar e liberam gás que faz a massa crescer."}, {"q": "Quando fazemos pão, é comum usar leite ou água mornos. Por que a temperatura é importante?", "opts": ["Porque o leite frio estraga o pão", "Porque as leveduras precisam de uma temperatura adequada para iniciar a fermentação", "Porque a água quente mata as farinhas", "Porque o leite morno tem mais sabor"], "a": 1, "exp": "Temperatura adequada é a condição para as leveduras começarem a trabalhar."}, {"type": "multi", "q": "O processo de fabricação de vinhos e cervejas é feito... Marque TODAS as certas.", "opts": ["Pelos fungos, alguns tipos de leveduras", "Pelas bactérias causadoras de doenças", "Pela fermentação, que transforma o açúcar em álcool", "Pela decomposição de folhas secas"], "answers": [0, 2], "exp": "Vinhos e cervejas dependem de leveduras (fungos) e da fermentação. Bactérias causadoras de doenças não fazem parte disso."}, {"type": "vf", "q": "Ciências em ação! Marque V ou F. Depois pense em como corrigir as falsas.", "items": [{"t": "Os fungos são organismos que produzem o seu próprio alimento.", "v": false}, {"t": "Todas as espécies de fungos da natureza são vistas apenas ao microscópio.", "v": false}, {"t": "Além de decompositores, os fungos são usados na fabricação de queijos, dando a eles um sabor característico.", "v": true}, {"t": "Os fungos podem nos ajudar na fermentação de bebidas, como vinhos e cervejas.", "v": true}, {"t": "Todas as espécies de fungos existentes na natureza causam doenças.", "v": false}, {"t": "Os fungos decompositores não são importantes para a sobrevivência, porque a decomposição não faz a ciclagem de nutrientes.", "v": false}], "exp": "As falsas viram verdadeiras assim: fungos NÃO produzem o próprio alimento; há fungos que se veem a olho nu (cogumelos); nem todos causam doenças; e a decomposição é essencial para a ciclagem de nutrientes."}, {"q": "Qual é a correção certa para a frase falsa: \"Os fungos são organismos que produzem seu próprio alimento\"?", "opts": ["Os fungos não são organismos que produzem seu próprio alimento", "Os fungos produzem alimento só de noite", "Os fungos produzem alimento com clorofila", "Os fungos são organismos que só comem animais"], "a": 0, "exp": "Reescrever a frase falsa é só trocar a informação errada pela certa. Fungos não fazem o próprio alimento."}, {"q": "Por que alguns queijos têm cores como azul, verde, cinza ou amarelo?", "opts": ["Porque eles foram pintados", "Porque usam muito sal", "Pela ação de fungos comestíveis que dão sabor e maciez", "Porque guardam gás carbônico"], "a": 2, "exp": "As tonalidades são resultado da ação de microrganismos, os fungos comestíveis."}, {"q": "No Egito Antigo, as pessoas faziam pão macio e leve. O que elas dominavam?", "opts": ["A técnica de fazer antibióticos", "O uso de geladeira", "A técnica de usar fungos para fazer pão, sem saber que eram microrganismos", "A técnica de vacinar o trigo"], "a": 2, "exp": "Os egípcios usaram fungos (leveduras) na fermentação do pão sem saber que eram seres vivos microscópicos."}, {"type": "short", "q": "O que é o fermento biológico? Explique e dê pelo menos um exemplo de sua utilização.", "model": "O fermento biológico é feito de leveduras, que são fungos. Elas fazem a fermentação dos açúcares e liberam gás carbônico, que faz a massa crescer. É usado em massa de pão e de pizza.", "exp": "Fermento biológico = leveduras (fungos). Exemplo: pão ou pizza."}, {"type": "short", "q": "De que forma as leveduras agem na produção de vinhos e cervejas? Explique.", "model": "As leveduras fazem a fermentação, que transforma o açúcar em álcool.", "exp": "Leveduras fazem fermentação: o açúcar vira álcool."}, {"q": "Quais destes queijos ganham sabor, aroma e cor pela ação de fungos?", "opts": ["Gorgonzola e brie", "Queijo suíço (emmental)", "Iogurte natural", "Leite fermentado"], "a": 0, "exp": "Gorgonzola e brie têm fungos comestíveis. Os furinhos do queijo suíço vêm das bactérias."}]}, {"label": "Bactérias e probióticos", "fixed": true, "questions": [{"q": "As bactérias podem ser vistas a olho nu?", "opts": ["Sim: todas são grandes", "Não: são seres vivos microscópicos", "Sim: se estiverem no solo", "Só as que causam doenças"], "a": 1, "exp": "Bactérias são microscópicas. Precisamos de microscópio para observá-las."}, {"q": "Pensando em tudo que a apostila ensina, o que podemos dizer sobre as bactérias?", "opts": ["Todas causam doenças graves", "Nenhuma é útil para o homem", "Elas só existem dentro de hospitais", "Algumas fazem mal, mas também têm ações benéficas para o nosso corpo e para o meio ambiente"], "a": 3, "exp": "As pessoas costumam ligar bactérias a doenças, mas elas também ajudam: decomposição, alimentos, probióticos."}, {"type": "classify", "q": "O que cada bactéria está fazendo? Escolha a função certa.", "cats": ["Decompõe", "Causa doença", "Ajuda a fazer alimento"], "items": [{"t": "Transforma restos de plantas mortas em nutrientes", "c": 0}, {"t": "Pneumonia, uma infecção nos pulmões", "c": 1}, {"t": "Iogurte", "c": 2}, {"t": "Otite, uma infecção nos ouvidos", "c": 1}, {"t": "Queijo", "c": 2}, {"t": "Faz nutrientes voltarem ao meio ambiente", "c": 0}, {"t": "Lactobacilos do Yakult", "c": 2}], "exp": "As bactérias decompositoras reciclam nutrientes. As patogênicas causam doenças. Os lactobacilos ajudam a fazer iogurtes e queijos."}, {"type": "fill", "q": "As bactérias que causam doenças são chamadas de ______.", "accept": ["patogênicas", "patogenicas", "patogênica", "patogenica"], "exp": "Patogênicas é o mesmo que causadoras de doenças."}, {"q": "Qual destas doenças é uma infecção nos pulmões causada por bactérias?", "opts": ["Frieira", "Pneumonia", "Ferrugem", "Micose"], "a": 1, "exp": "A pneumonia é infecção nos pulmões. Frieira, ferrugem e micose são de fungos."}, {"q": "A otite é uma infecção em qual parte do corpo?", "opts": ["Nos pulmões", "Nos pés", "Nos ouvidos", "Nas folhas das plantas"], "a": 2, "exp": "Otite = infecção nos ouvidos. Pneumonia = infecção nos pulmões."}, {"q": "Por que as bactérias causadoras de doenças podem ser perigosas, mesmo sendo minúsculas?", "opts": ["Porque se multiplicam muito rápido", "Porque são muito grandes", "Porque não precisam de nada para viver", "Porque só atacam à noite"], "a": 0, "exp": "Mesmo minúsculas, elas se multiplicam rápido e podem causar infecções."}, {"type": "fill", "q": "As bactérias usadas na produção de iogurtes e queijos são os ______.", "accept": ["lactobacilos", "lactobacillus", "lactobacilo"], "exp": "Os lactobacilos vivos são conhecidos como \"bactérias do bem\"."}, {"q": "Como os lactobacilos são conhecidos popularmente?", "opts": ["Bactérias do mal", "Fungos do bem", "Vírus do bem", "Bactérias do bem"], "a": 3, "exp": "Eles ajudam o nosso corpo e estão em alimentos probióticos."}, {"q": "Qual destes alimentos é feito com a ajuda de bactérias?", "opts": ["Vinho", "Pão", "Molho shoyu", "Iogurte"], "a": 3, "exp": "Iogurtes, queijos e bebidas lácteas usam bactérias. Vinho, pão e shoyu usam fungos."}, {"type": "fill", "q": "Probióticos são microrganismos ______ que fazem bem ao equilíbrio do nosso intestino.", "accept": ["vivos", "vivas"], "exp": "Probióticos são microrganismos vivos, uma colônia de bactérias que dão benefícios à saúde."}, {"type": "multi", "q": "Quais destes alimentos são probióticos? Marque TODOS os certos.", "opts": ["Coalhada", "Iogurte", "Kefir", "Suco de laranja"], "answers": [0, 1, 2], "exp": "A apostila cita coalhadas, iogurtes, kefir e até leite fermentado como alimentos ricos em bactérias boas."}, {"q": "O que formou os furinhos do queijo suíço (emmental)?", "opts": ["Gases liberados por bactérias durante a fabricação", "Insetos que comem o queijo", "Gotas de água que secaram", "Fungos que cresceram do lado de fora"], "a": 0, "exp": "Os furinhos nascem dos gases que as bactérias soltam enquanto o queijo é feito."}, {"type": "match", "q": "Ligue cada queijo com furinhos ao seu país de origem.", "left": ["Gruyère", "Gouda", "Emmental (queijo suíço)"], "right": ["França", "Holanda", "Suíça"], "exp": "Os queijos com furinhos vêm de vários países. O gruyère é francês, o gouda é holandês e o emmental é suíço."}, {"q": "O que as bactérias fazem no leite para transformá-lo em iogurte?", "opts": ["Aquecem o leite até ferver", "Retiram toda a água do leite", "Transformam o açúcar do leite por meio da fermentação", "Fazem o leite virar gás"], "a": 2, "exp": "A fermentação transforma o açúcar do leite em iogurte e em vários queijos."}, {"q": "Os derivados do leite, como iogurte e queijos, são boas fontes de quê?", "opts": ["Gás carbônico e álcool", "Cálcio e vitaminas", "Penicilina e antibióticos", "Clorofila e luz"], "a": 1, "exp": "Os produtos derivados do leite são boas fontes de cálcio e vitaminas."}, {"type": "vf", "q": "Marque Verdadeiro (V) ou Falso (F).", "items": [{"t": "As bactérias são seres vivos microscópicos.", "v": true}, {"t": "Todas as bactérias causam doenças.", "v": false}, {"t": "Os lactobacilos são usados para fazer iogurtes e queijos.", "v": true}, {"t": "As bactérias decompositoras ajudam os nutrientes a voltar ao meio ambiente.", "v": true}, {"t": "Bactérias nunca estão presentes nos alimentos.", "v": false}, {"t": "Os furinhos de alguns queijos vêm dos gases liberados por bactérias.", "v": true}], "exp": "Nem toda bactéria faz mal: muitas ajudam. Elas aparecem nos alimentos, como iogurte e queijo."}, {"type": "short", "q": "Dê 3 exemplos do que as bactérias podem fazer. Explique.", "model": "As bactérias podem decompor restos de plantas e animais, devolvendo nutrientes ao meio ambiente; causar doenças como pneumonia e otite; e ajudar a fazer alimentos como iogurtes e queijos.", "exp": "Escolha três: decompor, causar doenças, fazer alimentos (iogurte, queijo). Explique cada um."}, {"type": "short", "q": "O que são alimentos probióticos? Explique e dê 3 exemplos.", "model": "Probióticos são alimentos com microrganismos vivos, uma colônia de bactérias boas que fazem bem à saúde e ao equilíbrio do intestino. Exemplos: coalhada, iogurte e kefir.", "exp": "Probiótico = microrganismos vivos que fazem bem ao intestino. Exemplos: coalhada, iogurte, kefir, leite fermentado."}, {"type": "short", "q": "Explique o que são os \"furinhos\" que aparecem em alguns tipos de queijo.", "model": "Os furinhos são buracos formados pelos gases liberados por bactérias durante o processo de fabricação do queijo.", "exp": "Fale de gases e de bactérias. É o jeito de explicar o buraquinho do queijo suíço."}]}, {"label": "Vacinas", "fixed": true, "questions": [{"q": "De que podem ser feitas algumas vacinas?", "opts": ["De antibióticos fabricados por fungos", "De leite fermentado", "De um microrganismo ou parte dele, como vírus morto ou atenuado", "De areia e água"], "a": 2, "exp": "As vacinas usam um microrganismo ou parte dele. Algumas usam vírus morto ou atenuado, que é um vírus com baixa atividade."}, {"type": "fill", "q": "Algumas vacinas são feitas com vírus morto ou ______ (com baixa atividade).", "accept": ["atenuado", "atenuada"], "exp": "Atenuado quer dizer enfraquecido, com baixa atividade."}, {"q": "O que as vacinas fazem pelo nosso corpo?", "opts": ["Estimulam o sistema imunológico a preparar a defesa contra um agente infeccioso", "Matam todas as bactérias do corpo", "Deixam o corpo doente de propósito", "Substituem a alimentação"], "a": 0, "exp": "A vacina treina o sistema imunológico para se defender, assim não adoecemos."}, {"type": "vf", "q": "Marque Verdadeiro (V) ou Falso (F).", "items": [{"t": "A falta de vacinação é um problema só para quem não foi vacinado.", "v": false}, {"t": "Quanto mais pessoas imunizadas, menor o risco de surgirem doenças.", "v": true}, {"t": "As vacinas passam por uma série de testes antes de chegar até nós.", "v": true}, {"t": "Vacinar é importante para a nossa saúde e para a saúde de todos.", "v": true}, {"t": "As vacinas servem para deixar as pessoas doentes.", "v": false}], "exp": "A falta de vacinação afeta toda a população. As vacinas são testadas e seguras, e protegem a pessoa e quem vive com ela."}, {"q": "Por que vacinar também protege quem não foi vacinado?", "opts": ["Porque a vacina passa pelo ar", "Porque quem não foi vacinado fica imune sozinho", "Porque a vacina muda a cor da pele", "Porque, com mais gente imunizada, diminui o risco de a doença se espalhar"], "a": 3, "exp": "Quanto maior o número de pessoas imunizadas, menor o risco de surgir ou aumentar casos de doenças controladas."}, {"type": "short", "q": "Qual é a importância das vacinas?", "model": "As vacinas são importantes porque estimulam o sistema imunológico a se defender, protegem a pessoa e toda a população e diminuem o risco de doenças.", "exp": "Use PORQUE: a vacina prepara a defesa do corpo e protege todo mundo."}, {"type": "classify", "q": "Tratamento ou prevenção? Escolha a certa.", "cats": ["Tratamento (depois de ficar doente)", "Prevenção (antes de ficar doente)"], "items": [{"t": "Tomar uma vacina", "c": 1}, {"t": "Tomar antibiótico para uma infecção", "c": 0}, {"t": "Usar penicilina contra bactérias", "c": 0}, {"t": "Treinar o corpo para se defender", "c": 1}], "exp": "Antibióticos atacam o invasor depois que ele já entrou. As vacinas treinam o corpo para se defender antes de o invasor chegar."}, {"q": "Uma colega diz: \"As vacinas servem para matar bactérias quando já estamos doentes.\" O que está errado?", "opts": ["As vacinas só funcionam em plantas", "As vacinas nos protegem antes de ficarmos doentes", "As vacinas matam todas as bactérias do corpo", "As vacinas curam qualquer doença na hora"], "a": 1, "exp": "Vacina é prevenção: treina o sistema imunológico. Quem trata a infecção depois são os medicamentos, como os antibióticos."}]}, {"label": "Prova completa (todos os temas)", "fixed": true, "questions": [{"type": "fill", "q": "QUESTÃO 1. BANCO: decomposição – fermentação – penicilina – lactobacilos. Complete: Fungos e bactérias fazem a ______ dos restos de seres vivos.", "accept": ["decomposição", "decomposicao"], "exp": "Decomposição é o trabalho dos decompositores."}, {"type": "fill", "q": "QUESTÃO 1. BANCO: decomposição – fermentação – penicilina – lactobacilos. Complete: Alexander Fleming descobriu a ______, um antibiótico.", "accept": ["penicilina", "pencilina"], "exp": "Fleming descobriu a penicilina, produzida por um fungo."}, {"type": "fill", "q": "QUESTÃO 1. BANCO: decomposição – fermentação – penicilina – lactobacilos. Complete: As leveduras fazem a ______ dos açúcares da massa do pão.", "accept": ["fermentação", "fermentacao"], "exp": "Fermentação é o processo das leveduras."}, {"type": "fill", "q": "QUESTÃO 1. BANCO: decomposição – fermentação – penicilina – lactobacilos. Complete: Os iogurtes são feitos com ______, as \"bactérias do bem\".", "accept": ["lactobacilos", "lactobacilo", "lactobacillus"], "exp": "Lactobacilos são bactérias vivas usadas em iogurtes e queijos."}, {"q": "QUESTÃO 2. Marque X no nome do processo. Na massa do pão, as leveduras se alimentam dos açúcares e soltam gás carbônico. Esse processo se chama:", "opts": ["Decomposição", "Fermentação", "Vacinação", "Digestão"], "a": 1, "exp": "As leveduras fermentam os açúcares e o gás faz a massa crescer."}, {"type": "vf", "q": "QUESTÃO 3. Escreva V para as certas e F para as falsas.", "items": [{"t": "Os fungos são organismos que produzem o seu próprio alimento.", "v": false}, {"t": "Fungos e bactérias são os principais decompositores da natureza.", "v": true}, {"t": "Todas as bactérias causam doenças.", "v": false}, {"t": "As vacinas estimulam o sistema imunológico a se defender.", "v": true}, {"t": "Os lactobacilos são usados na fabricação de iogurtes e queijos.", "v": true}, {"t": "Todas as espécies de fungos são vistas apenas ao microscópio.", "v": false}], "exp": "Fungos não fazem o próprio alimento; nem toda bacté
