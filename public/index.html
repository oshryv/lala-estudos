<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Lala — Semana de Provas Year 4</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1D9E75;--green-l:#E1F5EE;--green-d:#085041;
  --blue:#378ADD;--blue-l:#E6F1FB;--blue-d:#0C447C;
  --pink:#D4537E;--pink-l:#FBEAF0;--pink-d:#72243E;
  --amber:#BA7517;--amber-l:#FAEEDA;--amber-d:#633806;
  --purple:#7F77DD;--purple-l:#EEEDFE;--purple-d:#3C3489;
  --red:#E24B4A;--red-l:#FCEBEB;--red-d:#791F1F;
  --gray:#5F5E5A;--gray-l:#F1EFE8;--gray-d:#2C2C2A;
  --bg:#f5f4f0;--card:#fff;--text:#1a1a1a;--muted:#666;--border:#e0ddd8;
}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* TOPBAR */
.topbar{background:#fff;padding:.6rem 1rem;display:flex;align-items:center;gap:8px;border-bottom:1.5px solid var(--border);flex-wrap:wrap;position:sticky;top:0;z-index:100}
.topbar-title{font-size:15px;font-weight:900;color:var(--text);margin-right:6px;white-space:nowrap}
.tri-bar{background:#fff;padding:.45rem 1rem;display:flex;align-items:center;gap:8px;border-bottom:1.5px solid var(--border)}
.tri-bar .tri-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:2px}
.tri-btn{padding:5px 16px;border-radius:20px;font-size:13px;font-weight:800;cursor:pointer;border:2px solid var(--border);background:var(--card);font-family:'Nunito',sans-serif;color:var(--muted);transition:all .15s}
.tri-btn.active{color:#fff;border-color:transparent;background:#2C2C2A}
.tri-empty{background:var(--card);border:1.5px dashed var(--border);border-radius:16px;padding:2.5rem 1.5rem;text-align:center;color:var(--muted)}
.tri-empty .ico{font-size:38px;display:block;margin-bottom:10px}
.tri-empty h3{font-size:16px;font-weight:800;color:var(--text);margin-bottom:6px}
.tri-empty p{font-size:13px;line-height:1.6;max-width:340px;margin:0 auto 14px}
.tri-empty button{padding:9px 20px;border-radius:22px;border:none;background:#BA7517;color:#fff;font-size:13px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif}
.tab{padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;border:2px solid var(--border);background:transparent;color:var(--muted);font-family:'Nunito',sans-serif;transition:all .18s;white-space:nowrap}
.tab.active{color:#fff!important;border-color:transparent!important}

/* SCREENS */
.screen{display:none;padding:1rem;max-width:920px;margin:0 auto}
.screen.active{display:block}

/* ===== PAINEL ===== */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:.5rem}
.subj-card{border-radius:18px;padding:1.1rem 1.25rem;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;color:#fff;border:none;text-align:left;font-family:'Nunito',sans-serif;width:100%}
.subj-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.13)}
.subj-card .emoji{font-size:28px;margin-bottom:7px;display:block}
.subj-card h3{font-size:14px;font-weight:800;margin-bottom:3px}
.subj-card p{font-size:11.5px;line-height:1.5;opacity:.88}
.subj-card .date{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:10px;margin-top:7px;background:rgba(255,255,255,.25)}
.subj-card .lang{position:absolute;top:10px;right:12px;font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:8px;background:rgba(255,255,255,.25)}
.subj-card .bg-ico{position:absolute;bottom:-8px;right:-6px;font-size:68px;opacity:.08;pointer-events:none;line-height:1}
.detail-back{background:#fff;border:2px solid var(--border);border-radius:20px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;color:var(--text);margin-bottom:1.25rem;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.detail-back:hover{background:#f0efea}
.detail-title{font-size:20px;font-weight:800;margin-bottom:1.25rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lang-pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:8px}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.topic-card{border-radius:14px;padding:1rem 1.1rem}
.topic-card h4{font-size:13px;font-weight:800;margin-bottom:7px}
.topic-card ul{font-size:12.5px;line-height:1.9;list-style:none}
.topic-card ul li::before{content:"→ ";font-weight:700}
.activity{margin-top:10px;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.6;background:rgba(255,255,255,.5)}
.activity strong{display:block;font-size:10px;font-weight:800;margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em;opacity:.6}

/* ===== MAPA MENTAL ===== */
.mind-wrap{overflow:auto;background:var(--card);border-radius:16px;border:1.5px solid var(--border);padding:.5rem}
.mind-wrap svg{min-width:640px;width:100%;display:block;margin:auto}

/* ===== QUIZ ===== */
.qf-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.qf-btn{padding:6px 13px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid var(--border);background:var(--card);font-family:'Nunito',sans-serif;color:var(--muted);transition:all .15s}
.qf-btn.active{color:#fff;border-color:transparent}
.prog-bar{height:5px;background:#e0ddd8;border-radius:3px;margin-bottom:1.25rem;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .3s;background:var(--green)}
.quiz-box{max-width:560px}
.q-meta{font-size:11px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.q-text{font-size:15px;font-weight:700;line-height:1.55;margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:11px;border:2px solid var(--border);cursor:pointer;font-size:13px;line-height:1.4;color:var(--text);transition:all .15s;background:var(--card);font-family:'Nunito',sans-serif;text-align:left;width:100%}
.opt:hover{border-color:#bbb;background:#fafaf8}
.opt.correct{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.opt.wrong{border-color:var(--red);background:var(--red-l);color:var(--red-d)}
.opt-letter{font-weight:800;font-size:12px;min-width:18px;margin-top:1px}
.feedback{font-size:13px;font-weight:700;padding:8px 12px;border-radius:9px;display:none;margin-bottom:12px;line-height:1.5}
.feedback.ok{display:block;background:var(--green-l);color:var(--green-d)}
.feedback.bad{display:block;background:var(--red-l);color:var(--red-d)}
.next-btn{padding:9px 24px;border-radius:20px;font-size:13px;font-weight:800;cursor:pointer;border:none;font-family:'Nunito',sans-serif;color:#fff;display:none}
.next-btn:hover{opacity:.88}
.score-card{border-radius:16px;padding:2rem;text-align:center;display:none}
.score-card.show{display:block}
.score-card h2{font-size:32px;font-weight:900;margin-bottom:8px}
.score-card p{font-size:14px;margin-bottom:16px}
.retry-btn{padding:10px 24px;border-radius:20px;font-size:13px;font-weight:800;cursor:pointer;border:none;font-family:'Nunito',sans-serif;color:#fff;background:rgba(0,0,0,.22)}

/* ===== SIMULADOS ===== */
.sim-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.sim-btn{padding:6px 13px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid var(--border);background:var(--card);font-family:'Nunito',sans-serif;color:var(--muted);transition:all .15s}
.sim-btn.active{color:#fff;border-color:transparent}
.sim-panel{display:none}
.sim-panel.active{display:block}
.exam-header{border-radius:14px;padding:1rem 1.25rem;margin-bottom:1.25rem;color:#fff;position:relative}
.exam-header h2{font-size:17px;font-weight:800;margin-bottom:2px}
.exam-header p{font-size:12px;opacity:.85}
.exam-score{position:absolute;top:12px;right:14px;font-size:13px;font-weight:800;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px}
.q-block{background:var(--card);border-radius:14px;border:1.5px solid var(--border);padding:1rem 1.25rem;margin-bottom:12px}
.q-num{font-size:10px;font-weight:800;letter-spacing:.06em;opacity:.5;margin-bottom:6px;text-transform:uppercase}
.q-stem{font-size:13.5px;font-weight:700;line-height:1.6;color:var(--text);margin-bottom:10px}
.q-ctx{background:#f5f4f0;border-left:3px solid var(--border);border-radius:0 8px 8px 0;padding:8px 12px;font-size:12.5px;line-height:1.7;color:var(--muted);margin-bottom:10px;font-style:italic}
.q-reading{background:#fbfaf7;border-radius:0 10px 10px 0;padding:16px 18px;margin-bottom:14px;color:var(--text);font-size:14.5px;line-height:1.75}
.q-reading-title{font-size:16px;font-weight:800;margin-bottom:10px}
.q-reading p{margin:0 0 10px 0}
.q-reading p:last-child{margin-bottom:0}
.mc-opts{display:flex;flex-direction:column;gap:6px}
.mc-opt{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:10px;border:2px solid var(--border);cursor:pointer;font-size:13px;line-height:1.4;color:var(--text);transition:all .15s;background:var(--card);font-family:'Nunito',sans-serif;text-align:left;width:100%}
.mc-opt:hover{border-color:#bbb;background:#fafaf8}
.mc-opt.correct{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.mc-opt.wrong{border-color:var(--red);background:var(--red-l);color:var(--red-d)}
.mc-opt.selected{border-color:#7F77DD;background:#EEEDFE;color:#3C3489}
.mc-letter{font-weight:800;font-size:12px;min-width:18px;margin-top:1px;pointer-events:none}
.q-fb{margin-top:8px;font-size:12px;font-weight:700;padding:7px 10px;border-radius:8px;display:none;line-height:1.5}
.q-fb.show{display:block}
.q-fb.ok{background:var(--green-l);color:var(--green-d)}
.q-fb.bad{background:var(--red-l);color:var(--red-d)}
.check-btn{margin-top:1rem;padding:10px 26px;border-radius:22px;font-size:13px;font-weight:800;cursor:pointer;border:none;font-family:'Nunito',sans-serif;color:#fff;transition:opacity .15s}
.check-btn:hover{opacity:.88}
.chip-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px dashed var(--border)}
.chip-row:first-child{border-top:none}
.chip-t{flex:1 1 220px;font-size:13px;line-height:1.45;color:var(--text);font-weight:600}
.chip-g{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:18px;border:2px solid var(--border);background:var(--card);font-size:12.5px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;color:var(--text);transition:all .15s}
.chip.selected{border-color:#7F77DD;background:#EEEDFE;color:#3C3489}
.chip.correct{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.chip.wrong{border-color:var(--red);background:var(--red-l);color:var(--red-d)}
.q-block.done .chip,.q-block.done .ord-btn,.q-block.done .mc-opt{pointer-events:none}
.q-sel{padding:8px 10px;border-radius:10px;border:2px solid var(--border);font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;color:var(--text);background:var(--card);max-width:100%}
.q-sel.correct{border-color:var(--green);background:var(--green-l)}
.q-sel.wrong{border-color:var(--red);background:var(--red-l)}
.q-hint{font-size:11.5px;color:var(--muted);margin:-4px 0 8px;font-weight:700}
.ord-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:2px solid var(--border);cursor:pointer;font-size:13px;line-height:1.4;color:var(--text);background:var(--card);font-family:'Nunito',sans-serif;text-align:left;width:100%;margin-bottom:6px}
.ord-n{min-width:24px;height:24px;border-radius:12px;border:2px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
.ord-btn.selected{border-color:#7F77DD;background:#EEEDFE;color:#3C3489}
.ord-btn.selected .ord-n{background:#7F77DD;border-color:#7F77DD;color:#fff}
.ord-btn.correct{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.ord-btn.wrong{border-color:var(--red);background:var(--red-l);color:var(--red-d)}
.q-short{width:100%;box-sizing:border-box;min-height:84px;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-size:15px;font-weight:600;font-family:Nunito,sans-serif;color:var(--text);background:#fff;outline:none;resize:vertical}
.q-model{margin-top:8px;font-size:12.5px;line-height:1.55;padding:8px 10px;border-radius:8px;background:#EEEDFE;color:#3C3489;font-weight:700}
.result-box{border-radius:14px;padding:1.5rem;text-align:center;margin-top:1rem;display:none}
.result-box.show{display:block}
.result-box h3{font-size:26px;font-weight:900;margin-bottom:6px}
.result-box p{font-size:13px;margin-bottom:12px}
.retry-s{padding:9px 22px;border-radius:20px;font-size:13px;font-weight:800;cursor:pointer;border:none;font-family:'Nunito',sans-serif;color:#fff;background:rgba(0,0,0,.2)}

/* ===== RESUMOS ===== */
.res-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.res-btn{padding:6px 13px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid var(--border);background:var(--card);font-family:'Nunito',sans-serif;color:var(--muted);transition:all .15s}
.res-btn.active{color:#fff;border-color:transparent}
.res-panel{display:none}
.res-panel.active{display:block}
.res-header{border-radius:14px;padding:1rem 1.25rem;margin-bottom:1rem;color:#fff;position:relative}
.res-header h2{font-size:17px;font-weight:800;margin-bottom:2px}
.res-header p{font-size:12px;opacity:.85}
.res-summary{background:var(--card);border-radius:14px;border:1.5px solid var(--border);padding:1rem 1.25rem;margin-bottom:12px}
.res-summary h4{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;opacity:.6}
.res-summary p{font-size:13.5px;line-height:1.75;color:var(--text)}
.res-tips{background:var(--card);border-radius:14px;border:1.5px solid var(--border);padding:1rem 1.25rem}
.res-tips h4{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;opacity:.6}
.res-tip{padding:10px 12px;border-radius:10px;margin-bottom:7px;font-size:13px;line-height:1.55;font-weight:600}
.res-tip:last-child{margin-bottom:0}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">📚 Lala — Year 4</span>
  <button class="tab active" id="t-dash" onclick="showTab('dash','#2C2C2A')">🏠 Painel</button>
  <button class="tab" id="t-mind" onclick="showTab('mind','#7F77DD')">🌿 Mapa Mental</button>
  <button class="tab" id="t-res" onclick="showTab('res','#1D9E75')">📝 Resumos</button>
  <button class="tab" id="t-quiz" onclick="showTab('quiz','#D4537E')">🎯 Quiz</button>
  <button class="tab" id="t-sim" onclick="showTab('sim','#BA7517')">📋 Simulados</button>
</div>

<div class="tri-bar">
  <span class="tri-label">Trimestre</span>
  <button class="tri-btn" id="tri-1" onclick="setTri(1)">1º Tri</button>
  <button class="tri-btn active" id="tri-2" onclick="setTri(2)">2º Tri</button>
  <button class="tri-btn" id="tri-3" onclick="setTri(3)">3º Tri</button>
</div>

<!-- ===== PAINEL ===== -->
<div class="screen active" id="dash">
  <div id="dash-main">
    <div id="dash-1tri" class="dash-grid">
      <button class="subj-card" style="background:linear-gradient(135deg,#1D9E75,#0F6E56)" onclick="showDetail('science')"><span class="lang">EN</span><span class="emoji">🌿</span><h3>Science</h3><p>Food web, photosynthesis, producers &amp; consumers</p><span class="date">Revisão</span><div class="bg-ico">🌿</div></button>
      <button class="subj-card" style="background:linear-gradient(135deg,#D4537E,#993556)" onclick="showDetail('portugues')"><span class="lang">PT</span><span class="emoji">✏️</span><h3>Língua Portuguesa</h3><p>Relato pessoal, sílabas, pronomes</p><span class="date">Revisão</span><div class="bg-ico">✏️</div></button>
      <button class="subj-card" style="background:linear-gradient(135deg,#378ADD,#185FA5)" onclick="showDetail('ciencias')"><span class="lang">PT</span><span class="emoji">🗺️</span><h3>Ciências</h3><p>Biomas: Amazônia, Mata Atlântica, Cerrado, Caatinga</p><span class="date">Revisão</span><div class="bg-ico">🗺️</div></button>
      <button class="subj-card" style="background:linear-gradient(135deg,#BA7517,#854F0B)" onclick="showDetail('matpt')"><span class="lang">PT</span><span class="emoji">🔢</span><h3>Matemática</h3><p>Números, operações, gráficos e situações-problema</p><span class="date">Revisão</span><div class="bg-ico">🔢</div></button>
      <button class="subj-card" style="background:linear-gradient(135deg,#633806,#412402)" onclick="showDetail('mat')"><span class="lang">EN</span><span class="emoji">🔢</span><h3>Math</h3><p>Place value, time, quadrilaterals, word problems</p><span class="date">Revisão</span><div class="bg-ico">🔢</div></button>
      <button class="subj-card" style="background:linear-gradient(135deg,#E24B4A,#A32D2D)" onclick="showDetail('la')"><span class="lang">EN</span><span class="emoji">📖</span><h3>Language Arts</h3><p>Adjectives, verb tenses, types of sentences</p><span class="date">Revisão</span><div class="bg-ico">📖</div></button>
      <button class="subj-card" style="background:linear-gradient(135deg,#7F77DD,#534AB7)" onclick="showDetail('geohist')"><span class="lang">PT</span><span class="emoji">🏛️</span><h3>Geo &amp; História</h3><p>Tipos de mapas, influências indígenas</p><span class="date">Revisão</span><div class="bg-ico">🏛️</div></button>
      <button class="subj-card" style="background:linear-gradient(135deg,#5F5E5A,#2C2C2A)" onclick="showDetail('social')"><span class="lang">EN</span><span class="emoji">🌎</span><h3>Social Studies</h3><p>Nomadic people, Mayas, Aztecs, Incas</p><span class="date">Revisão</span><div class="bg-ico">🌎</div></button>
    </div>
    <div id="dash-2tri" class="dash-grid" style="display:none">
      <button class="subj-card" style="background:linear-gradient(135deg,#1D9E75,#085041)" onclick="goSim('science2')"><span class="lang">EN</span><span class="emoji">🔬</span><h3>Science</h3><p>Matter &amp; properties, states, physical/chemical, reversible/irreversible</p><span class="date">Revisão</span><div class="bg-ico">🔬</div></button>
      <button class="subj-card" style="background:linear-gradient(135deg,#D4537E,#993556)" onclick="goSim('portugues2')"><span class="lang">PT</span><span class="emoji">📚</span><h3>Língua Portuguesa</h3><p>Divulgação científica, artigos, concordância nominal</p><span class="date">Revisão</span><div class="bg-ico">📚</div></button>
      <button class="subj-card" style="background:linear-gradient(135deg,#BA7517,#854F0B)" onclick="goSim('matematica2')"><span class="lang">PT</span><span class="emoji">🔢</span><h3>Matemática</h3><p>Milhões, mult/div por dezena, área e perímetro, medidas, gráficos</p><span class="date">Revisão</span><div class="bg-ico">🔢</div></button>
      <button class="subj-card" style="background:linear-gradient(135deg,#5F5E5A,#2C2C2A)" onclick="goSim('social2')"><span class="lang">EN</span><span class="emoji">🌎</span><h3>Social Studies</h3><p>Age of exploration, trade routes, impacts, maps &amp; compass rose</p><span class="date">Revisão</span><div class="bg-ico">🌎</div></button>

<svg viewBox="0 0 940 740" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-height:74vh">
<rect width="940" height="740" rx="18" fill="#e8f7f1"/>
<rect x="180" y="18" width="580" height="72" rx="16" fill="#1D9E75"/>
<text x="470" y="50" text-anchor="middle" font-size="21" font-weight="800" fill="#fff">🔬 SCIENCE — Material Changes</text>
<text x="470" y="74" text-anchor="middle" font-size="12" fill="#ffffffcc">Matter · States · Physical &amp; Chemical · Reversible</text>
<line x1="300" y1="90" x2="180" y2="118" stroke="#1D9E75" stroke-width="2.5" opacity=".55"/>
<line x1="640" y1="90" x2="760" y2="118" stroke="#1D9E75" stroke-width="2.5" opacity=".55"/>
<rect x="25" y="118" width="430" height="181" rx="14" fill="#0b5c43"/>
<text x="240" y="143" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🧱 MATTER &amp; PROPERTIES</text>
<rect x="35" y="152" width="410" height="19" rx="5" fill="#0d6b4e" opacity=".55"/>
<text x="43" y="166" font-size="11.5" font-weight="800" fill="#fff">Matter = has MASS + takes up SPACE</text>
<text x="45" y="185" font-size="11" fill="#ffffffdd">Made of tiny particles called ATOMS</text>
<text x="45" y="204" font-size="11" fill="#ffffffdd">3 basic properties: shape, volume, mass</text>
<text x="45" y="223" font-size="11" fill="#ffffffdd">VOLUME = amount of SPACE it takes up</text>
<text x="45" y="242" font-size="11" fill="#ffffffdd">MASS = amount of MATTER it has</text>
<text x="45" y="261" font-size="11" fill="#ffffffdd">Observable: colour, length, density,</text>
<text x="45" y="280" font-size="11" fill="#ffffffdd">elasticity, pressure, luster</text>
<rect x="485" y="118" width="430" height="181" rx="14" fill="#0b5c43"/>
<text x="700" y="143" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🧊 STATES OF MATTER</text>
<rect x="495" y="152" width="410" height="19" rx="5" fill="#0d6b4e" opacity=".55"/>
<text x="503" y="166" font-size="11.5" font-weight="800" fill="#fff">SOLID — rigid · fixed shape · fixed volume</text>
<text x="505" y="185" font-size="11" fill="#ffffffdd">particles packed tightly, barely move</text>
<rect x="495" y="190" width="410" height="19" rx="5" fill="#0d6b4e" opacity=".55"/>
<text x="503" y="204" font-size="11.5" font-weight="800" fill="#fff">LIQUID — not rigid · NO fixed shape</text>
<text x="505" y="223" font-size="11" fill="#ffffffdd">fixed volume · particles slide past</text>
<rect x="495" y="228" width="410" height="19" rx="5" fill="#0d6b4e" opacity=".55"/>
<text x="503" y="242" font-size="11.5" font-weight="800" fill="#fff">GAS — not rigid · NO shape · NO volume</text>
<text x="505" y="261" font-size="11" fill="#ffffffdd">particles far apart, move a lot</text>
<text x="505" y="280" font-size="11" fill="#ffffffdd">ex: oxygen, helium, water vapor</text>
<rect x="25" y="321" width="430" height="181" rx="14" fill="#0b5c43"/>
<text x="240" y="346" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">♻️ PHYSICAL CHANGE</text>
<rect x="35" y="355" width="410" height="19" rx="5" fill="#0d6b4e" opacity=".55"/>
<text x="43" y="369" font-size="11.5" font-weight="800" fill="#fff">Does NOT form a new substance</text>
<text x="45" y="388" font-size="11" fill="#ffffffdd">May change shape or size</text>
<text x="45" y="407" font-size="11" fill="#ffffffdd">May change state of matter</text>
<text x="45" y="426" font-size="11" fill="#ffffffdd">Can OFTEN be undone</text>
<text x="45" y="445" font-size="11" fill="#ffffffdd">ex: melting, freezing, boiling, tearing,</text>
<text x="45" y="464" font-size="11" fill="#ffffffdd">cutting, bending, breaking, dissolving</text>
<rect x="485" y="321" width="430" height="181" rx="14" fill="#0b5c43"/>
<text x="700" y="346" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🔥 CHEMICAL CHANGE</text>
<rect x="495" y="355" width="410" height="19" rx="5" fill="#0d6b4e" opacity=".55"/>
<text x="503" y="369" font-size="11.5" font-weight="800" fill="#fff">ALWAYS forms a NEW substance</text>
<text x="505" y="388" font-size="11" fill="#ffffffdd">May absorb OR release heat</text>
<text x="505" y="407" font-size="11" fill="#ffffffdd">Signs: Colour · Odour · Sound ·</text>
<text x="505" y="426" font-size="11" fill="#ffffffdd">Gas · Light · Temperature</text>
<text x="505" y="445" font-size="11" fill="#ffffffdd">USUALLY cannot be undone</text>
<text x="505" y="464" font-size="11" fill="#ffffffdd">ex: burning, rusting, frying, souring,</text>
<text x="505" y="483" font-size="11" fill="#ffffffdd">baking, digesting, photosynthesis</text>
<rect x="25" y="526" width="890" height="192" rx="14" fill="#fff" stroke="#1D9E75" stroke-width="3"/>
<text x="470" y="553" text-anchor="middle" font-size="15" font-weight="800" fill="#0d6b4e">💡 DICAS PARA DECORAR</text>
<text x="45" y="578" font-size="11.5" font-weight="700" fill="#333">🔑 New substance? → CHEMICAL.  Same substance? → PHYSICAL. Sempre comece por essa pergunta.</text>
<text x="45" y="598" font-size="11.5" font-weight="700" fill="#333">🧠 Sinais de mudança QUÍMICA = "COSGLT": Colour, Odour, Sound, Gas, Light, Temperature.</text>
<text x="45" y="618" font-size="11.5" font-weight="700" fill="#333">⚠️ Calor NÃO significa química! Derreter chocolate é FÍSICO e REVERSÍVEL.</text>
<text x="45" y="638" font-size="11.5" font-weight="700" fill="#333">⚠️ São DUAS perguntas diferentes: physical/chemical E reversible/irreversible.</text>
<text x="45" y="658" font-size="11.5" font-weight="700" fill="#333">🍎 Cortar uma maçã = FÍSICO (mesma substância) mas IRREVERSÍVEL (não dá pra colar).</text>
<text x="45" y="678" font-size="11.5" font-weight="700" fill="#333">🥚 Breaking an egg = PHYSICAL.  Frying an egg = CHEMICAL.</text>
<text x="45" y="698" font-size="11.5" font-weight="700" fill="#333">📏 MASS = Matéria.  VOLUME = eSpaço.  A primeira letra ajuda!</text>
</svg>
  </div>

  <div class="mind-map" id="mm-social3">
<svg viewBox="0 0 940 1640" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-height:80vh">
<rect width="940" height="1640" rx="18" fill="#f1efe8"/>
<rect x="180" y="18" width="580" height="72" rx="16" fill="#5F5E5A"/>
<text x="470" y="50" text-anchor="middle" font-size="21" font-weight="800" fill="#fff">🌎 SOCIAL STUDIES — Communities &amp; Economy</text>
<text x="470" y="74" text-anchor="middle" font-size="12" fill="#ffffffcc">Urban · Suburban · Rural · Sectors · Supply &amp; Demand · Government</text>
<line x1="300" y1="90" x2="240" y2="118" stroke="#5F5E5A" stroke-width="2.5" opacity=".55"/>
<line x1="640" y1="90" x2="700" y2="118" stroke="#5F5E5A" stroke-width="2.5" opacity=".55"/>
<rect x="25" y="118" width="430" height="181" rx="14" fill="#2C2C2A"/>
<text x="240" y="143" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🏘️ COMMUNITIES</text>
<rect x="35" y="152" width="410" height="19" rx="5" fill="#444441" opacity=".8"/>
<text x="43" y="166" font-size="11.5" font-weight="800" fill="#fff">3 types: URBAN · SUBURBAN · RURAL</text>
<text x="45" y="185" font-size="11" fill="#ffffffdd">URBAN: big busy city, tall buildings, MANY people</text>
<text x="45" y="204" font-size="11" fill="#ffffffdd">SUBURBAN: just outside the city, quieter, yards</text>
<text x="45" y="223" font-size="11" fill="#ffffffdd">RURAL: far from cities, farms, ranches, forests</text>
<text x="45" y="242" font-size="11" fill="#ffffffdd">Population density: urban high · rural very low</text>
<text x="45" y="261" font-size="11" fill="#ffffffdd">COMMUTE = travel from home to work and back</text>
<text x="45" y="280" font-size="11" fill="#ffffffdd">Green areas clean the air and keep the city cool</text>
<rect x="485" y="118" width="430" height="181" rx="14" fill="#2C2C2A"/>
<text x="700" y="143" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🧭 PUSH &amp; PULL FACTORS</text>
<rect x="495" y="152" width="410" height="19" rx="5" fill="#444441" opacity=".8"/>
<text x="503" y="166" font-size="11.5" font-weight="800" fill="#fff">Why do people move to a new community?</text>
<text x="505" y="185" font-size="11" fill="#ffffffdd">PUSH = negative, pushes people AWAY</text>
<text x="505" y="204" font-size="11" fill="#ffffffdd">   no jobs · famine · natural disasters</text>
<text x="505" y="223" font-size="11" fill="#ffffffdd">PULL = positive, pulls people IN</text>
<text x="505" y="242" font-size="11" fill="#ffffffdd">   better schools · safer places · exciting jobs</text>
<text x="505" y="261" font-size="11" fill="#ffffffdd">Communities depend on each other</text>
<text x="505" y="280" font-size="11" fill="#ffffffdd">City + suburb + countryside work together</text>
<rect x="25" y="321" width="430" height="181" rx="14" fill="#2C2C2A"/>
<text x="240" y="346" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🌾 PRIMARY SECTOR</text>
<rect x="35" y="355" width="410" height="19" rx="5" fill="#444441" opacity=".8"/>
<text x="43" y="369" font-size="11.5" font-weight="800" fill="#fff">Gets RAW MATERIALS directly from nature</text>
<text x="45" y="388" font-size="11" fill="#ffffffdd">Farming · fishing · forestry · mining</text>
<text x="45" y="407" font-size="11" fill="#ffffffdd">Raw materials: soil, water, trees, minerals</text>
<text x="45" y="426" font-size="11" fill="#ffffffdd">Most primary work happens in RURAL areas</text>
<text x="45" y="445" font-size="11" fill="#ffffffdd">Jobs: farmer, fisherman, miner, lumberjack</text>
<text x="45" y="464" font-size="11" fill="#ffffffdd">Example: a farmer grows cotton</text>
<text x="45" y="483" font-size="11" fill="#ffffffdd">Everything starts here</text>
<rect x="485" y="321" width="430" height="181" rx="14" fill="#2C2C2A"/>
<text x="700" y="346" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🏭 SECONDARY SECTOR</text>
<rect x="495" y="355" width="410" height="19" rx="5" fill="#444441" opacity=".8"/>
<text x="503" y="369" font-size="11.5" font-weight="800" fill="#fff">MANUFACTURING: turns raw materials into products</text>
<text x="505" y="388" font-size="11" fill="#ffffffdd">Processing, building, making things</text>
<text x="505" y="407" font-size="11" fill="#ffffffdd">Done by hand or with powerful machines</text>
<text x="505" y="426" font-size="11" fill="#ffffffdd">People who do it = MANUFACTURERS</text>
<text x="505" y="445" font-size="11" fill="#ffffffdd">Jobs: factory worker, carpenter</text>
<text x="505" y="464" font-size="11" fill="#ffffffdd">Factories: often suburban or urban areas</text>
<text x="505" y="483" font-size="11" fill="#ffffffdd">Example: a factory makes the T-shirt</text>
<rect x="25" y="524" width="430" height="181" rx="14" fill="#2C2C2A"/>
<text x="240" y="549" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🛒 TERTIARY SECTOR</text>
<rect x="35" y="558" width="410" height="19" rx="5" fill="#444441" opacity=".8"/>
<text x="43" y="572" font-size="11.5" font-weight="800" fill="#fff">Provides SERVICES and sells goods</text>
<text x="45" y="591" font-size="11" fill="#ffffffdd">Stores, banks, hospitals, government offices</text>
<text x="45" y="610" font-size="11" fill="#ffffffdd">Jobs: doctor, teacher, bus or truck driver</text>
<text x="45" y="629" font-size="11" fill="#ffffffdd">The truck driver connects ALL three sectors</text>
<text x="45" y="648" font-size="11" fill="#ffffffdd">Markets here follow SUPPLY and DEMAND</text>
<text x="45" y="667" font-size="11" fill="#ffffffdd">Example: a shop sells the T-shirt</text>
<text x="45" y="686" font-size="11" fill="#ffffffdd">Work done FOR you = service</text>
<rect x="485" y="524" width="430" height="181" rx="14" fill="#2C2C2A"/>
<text x="700" y="549" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🍎 GOODS vs SERVICES</text>
<rect x="495" y="558" width="410" height="19" rx="5" fill="#444441" opacity=".8"/>
<text x="503" y="572" font-size="11.5" font-weight="800" fill="#fff">What do people buy?</text>
<text x="505" y="591" font-size="11" fill="#ffffffdd">GOOD = an object you can TOUCH and buy</text>
<text x="505" y="610" font-size="11" fill="#ffffffdd">   apple · toy · book · T-shirt</text>
<text x="505" y="629" font-size="11" fill="#ffffffdd">SERVICE = work someone does FOR you</text>
<text x="505" y="648" font-size="11" fill="#ffffffdd">   mechanic fixing a car · doctor · haircut</text>
<text x="505" y="667" font-size="11" fill="#ffffffdd">NEEDS = shelter, safe place, transportation</text>
<text x="505" y="686" font-size="11" fill="#ffffffdd">WANTS = swimming pool, extra things</text>
<rect x="25" y="727" width="430" height="181" rx="14" fill="#2C2C2A"/>
<text x="240" y="752" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">📈 SUPPLY, DEMAND &amp; GOVERNMENT</text>
<rect x="35" y="761" width="410" height="19" rx="5" fill="#444441" opacity=".8"/>
<text x="43" y="775" font-size="11.5" font-weight="800" fill="#fff">How markets and local government work</text>
<text x="45" y="794" font-size="11" fill="#ffffffdd">SUPPLY = how much is available to buy</text>
<text x="45" y="813" font-size="11" fill="#ffffffdd">DEMAND = how much people want or need it</text>
<text x="45" y="832" font-size="11" fill="#ffffffdd">Demand goes UP → supply must go UP</text>
<text x="45" y="851" font-size="11" fill="#ffffffdd">Municipal chamber: mayor + council members</text>
<text x="45" y="870" font-size="11" fill="#ffffffdd">They write local laws, decide public money</text>
<text x="45" y="889" font-size="11" fill="#ffffffdd">Public services: roads, waste, vaccines, water</text>
<rect x="485" y="727" width="430" height="181" rx="14" fill="#2C2C2A"/>
<text x="700" y="752" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🔗 INTERDEPENDENCE &amp; RESOURCES</text>
<rect x="495" y="761" width="410" height="19" rx="5" fill="#444441" opacity=".8"/>
<text x="503" y="775" font-size="11.5" font-weight="800" fill="#fff">Interdependent = they depend on each other</text>
<text x="505" y="794" font-size="11" fill="#ffffffdd">City needs the countryside: FOOD, raw materials</text>
<text x="505" y="813" font-size="11" fill="#ffffffdd">Countryside needs the city: machines, hospitals</text>
<text x="505" y="832" font-size="11" fill="#ffffffdd">Factories need raw materials from farms and mines</text>
<text x="505" y="851" font-size="11" fill="#ffffffdd">RENEWABLE: grows back (trees, crops)</text>
<text x="505" y="870" font-size="11" fill="#ffffffdd">NON-RENEWABLE: gone forever (oil, coal, metals)</text>
<text x="505" y="889" font-size="11" fill="#ffffffdd">Use smart technology + recycling = sustainable</text>
<rect x="25" y="927" width="890" height="190" rx="14" fill="#2C2C2A"/>
<text x="470" y="952" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">⚖️ COMPARE THE 3 COMMUNITIES</text>
<rect x="35" y="961" width="870" height="21" rx="5" fill="#444441"/>
<text x="40" y="976" font-size="11.5" font-weight="800" fill="#fff">TYPE</text>
<text x="200" y="976" font-size="11.5" font-weight="800" fill="#fff">PEOPLE</text>
<text x="380" y="976" font-size="11.5" font-weight="800" fill="#fff">WHAT YOU SEE</text>
<text x="640" y="976" font-size="11.5" font-weight="800" fill="#fff">WORK AND LIFE</text>
<rect x="35" y="991" width="870" height="30" rx="5" fill="#444441" opacity=".5"/>
<text x="40" y="1010" font-size="11" font-weight="800" fill="#ffffffee">🏙️ Urban</text>
<text x="200" y="1010" font-size="11" font-weight="400" fill="#ffffffee">very high density</text>
<text x="380" y="1010" font-size="11" font-weight="400" fill="#ffffffee">skyscrapers, subways, museums</text>
<text x="640" y="1010" font-size="11" font-weight="400" fill="#ffffffee">offices, subway drivers, busy streets</text>
<text x="40" y="1044" font-size="11" font-weight="800" fill="#ffffffee">🏡 Suburban</text>
<text x="200" y="1044" font-size="11" font-weight="400" fill="#ffffffee">lower density, quieter</text>
<text x="380" y="1044" font-size="11" font-weight="400" fill="#ffffffee">houses with yards, playgrounds</text>
<text x="640" y="1044" font-size="11" font-weight="400" fill="#ffffffee">adults often COMMUTE to the city</text>
<rect x="35" y="1059" width="870" height="30" rx="5" fill="#444441" opacity=".5"/>
<text x="40" y="1078" font-size="11" font-weight="800" fill="#ffffffee">🌾 Rural</text>
<text x="200" y="1078" font-size="11" font-weight="400" fill="#ffffffee">very low density</text>
<text x="380" y="1078" font-size="11" font-weight="400" fill="#ffffffee">farms, ranches, forests, open fields</text>
<text x="640" y="1078" font-size="11" font-weight="400" fill="#ffffffee">farmers, ranchers, lumberjacks</text>
<rect x="25" y="1137" width="890" height="190" rx="14" fill="#2C2C2A"/>
<text x="470" y="1162" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">⚖️ COMPARE THE 3 SECTORS (the T-shirt journey)</text>
<rect x="35" y="1171" width="870" height="21" rx="5" fill="#444441"/>
<text x="40" y="1186" font-size="11.5" font-weight="800" fill="#fff">SECTOR</text>
<text x="200" y="1186" font-size="11.5" font-weight="800" fill="#fff">WHAT IT DOES</text>
<text x="430" y="1186" font-size="11.5" font-weight="800" fill="#fff">JOBS</text>
<text x="650" y="1186" font-size="11.5" font-weight="800" fill="#fff">T-SHIRT EXAMPLE</text>
<rect x="35" y="1201" width="870" height="30" rx="5" fill="#444441" opacity=".5"/>
<text x="40" y="1220" font-size="11" font-weight="800" fill="#ffffffee">🌾 Primary</text>
<text x="200" y="1220" font-size="11" font-weight="400" fill="#ffffffee">gets raw materials from nature</text>
<text x="430" y="1220" font-size="11" font-weight="400" fill="#ffffffee">farmer, fisherman, miner</text>
<text x="650" y="1220" font-size="11" font-weight="400" fill="#ffffffee">a farmer grows cotton</text>
<text x="40" y="1254" font-size="11" font-weight="800" fill="#ffffffee">🏭 Secondary</text>
<text x="200" y="1254" font-size="11" font-weight="400" fill="#ffffffee">makes products (manufacturing)</text>
<text x="430" y="1254" font-size="11" font-weight="400" fill="#ffffffee">factory worker, carpenter</text>
<text x="650" y="1254" font-size="11" font-weight="400" fill="#ffffffee">a factory makes the T-shirt</text>
<rect x="35" y="1269" width="870" height="30" rx="5" fill="#444441" opacity=".5"/>
<text x="40" y="1288" font-size="11" font-weight="800" fill="#ffffffee">🛒 Tertiary</text>
<text x="200" y="1288" font-size="11" font-weight="400" fill="#ffffffee">gives services, sells goods</text>
<text x="430" y="1288" font-size="11" font-weight="400" fill="#ffffffee">doctor, teacher, driver, banker</text>
<text x="650" y="1288" font-size="11" font-weight="400" fill="#ffffffee">truck delivers · shop sells</text>
<rect x="25" y="1357" width="890" height="250" rx="14" fill="#fff" stroke="#5F5E5A" stroke-width="3"/>
<text x="470" y="1384" text-anchor="middle" font-size="15" font-weight="800" fill="#2C2C2A">💡 MEMORY TIPS</text>
<text x="45" y="1411" font-size="11.5" font-weight="700" fill="#333">🔑 PRIMARY gets it · SECONDARY makes it · TERTIARY serves it (1-2-3)</text>
<text x="45" y="1437" font-size="11.5" font-weight="700" fill="#333">🧵 T-shirt: cotton (primary) → T-shirt (secondary) → shop (tertiary)</text>
<text x="45" y="1463" font-size="11.5" font-weight="700" fill="#333">📈 Demand goes UP → supply must go UP (more people want it, so make more)</text>
<text x="45" y="1489" font-size="11.5" font-weight="700" fill="#333">🔀 PUSH = pushes people away (bad) · PULL = pulls people in (good)</text>

  <div class="mind-map" id="mm-science3">
<svg viewBox="0 0 940 1210" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-height:80vh">
<rect width="940" height="1210" rx="18" fill="#e8f7f1"/>
<rect x="180" y="18" width="580" height="72" rx="16" fill="#1D9E75"/>
<text x="470" y="50" text-anchor="middle" font-size="21" font-weight="800" fill="#fff">🔬 SCIENCE — Microorganisms</text>
<text x="470" y="74" text-anchor="middle" font-size="12" fill="#ffffffcc">Bacteria · Viruses · Fungi · Protozoa · Infectious diseases</text>
<line x1="300" y1="90" x2="240" y2="118" stroke="#1D9E75" stroke-width="2.5" opacity=".55"/>
<line x1="640" y1="90" x2="700" y2="118" stroke="#1D9E75" stroke-width="2.5" opacity=".55"/>
<rect x="25" y="118" width="430" height="181" rx="14" fill="#0b5c43"/>
<text x="240" y="143" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🔬 MICROORGANISMS (MICROBES)</text>
<rect x="35" y="152" width="410" height="19" rx="5" fill="#0d6b4e" opacity=".55"/>
<text x="43" y="166" font-size="11.5" font-weight="800" fill="#fff">Tiny living things: you need a MICROSCOPE</text>
<text x="45" y="185" font-size="11" fill="#ffffffdd">Live everywhere: air, water, soil, inside bodies</text>
<text x="45" y="204" font-size="11" fill="#ffffffdd">Most are HELPFUL (decomposers, food helpers)</text>
<text x="45" y="223" font-size="11" fill="#ffffffdd">A few are HARMFUL = PATHOGENS (germs)</text>
<text x="45" y="242" font-size="11" fill="#ffffffdd">4 groups: bacteria · virus · fungi · protozoa</text>
<text x="45" y="261" font-size="11" fill="#ffffffdd">BACTERIA = most common microbe in your body</text>
<text x="45" y="280" font-size="11" fill="#ffffffdd">Soap + water washes pathogens away</text>
<rect x="485" y="118" width="430" height="181" rx="14" fill="#0b5c43"/>
<text x="700" y="143" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🦠 BACTERIA</text>
<rect x="495" y="152" width="410" height="19" rx="5" fill="#0d6b4e" opacity=".55"/>
<text x="503" y="166" font-size="11.5" font-weight="800" fill="#fff">Single-celled · prokaryotes</text>
<text x="505" y="185" font-size="11" fill="#ffffffdd">Shapes: rods, spirals, spheres</text>
<text x="505" y="204" font-size="11" fill="#ffffffdd">Some swim with tails called FLAGELLA</text>
<text x="505" y="223" font-size="11" fill="#ffffffdd">Helpful: yogurt, cheese, pickles, digestion</text>
<text x="505" y="242" font-size="11" fill="#ffffffdd">Harmful: tetanus, typhoid, pneumonia, TB</text>
<text x="505" y="261" font-size="11" fill="#ffffffdd">Decomposers clean up dead plants and animals</text>
<text x="505" y="280" font-size="11" fill="#ffffffdd">Fight them: antibiotics, antiseptics, soap</text>
<rect x="25" y="321" width="430" height="181" rx="14" fill="#0b5c43"/>
<text x="240" y="346" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🧬 VIRUSES: THE HIJACKERS</text>
<rect x="35" y="355" width="410" height="19" rx="5" fill="#0d6b4e" opacity=".55"/>
<text x="43" y="369" font-size="11.5" font-weight="800" fill="#fff">Much smaller than bacteria · NO cells</text>
<text x="45" y="388" font-size="11" fill="#ffffffdd">Must ENTER a living HOST cell to make copies</text>
<text x="45" y="407" font-size="11" fill="#ffffffdd">Cannot live or grow on their own</text>
<text x="45" y="426" font-size="11" fill="#ffffffdd">Cause: flu, common cold, measles, mumps</text>
<text x="45" y="445" font-size="11" fill="#ffffffdd">Antibiotics do NOT work on viruses</text>
<text x="45" y="464" font-size="11" fill="#ffffffdd">Best defense: VACCINES → build ANTIBODIES</text>
<text x="45" y="483" font-size="11" fill="#ffffffdd">Sleep + exercise = strong immune system</text>
<rect x="485" y="321" width="430" height="181" rx="14" fill="#0b5c43"/>
<text x="700" y="346" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🍄 FUNGI: NATURE'S RECYCLERS</text>
<rect x="495" y="355" width="410" height="19" rx="5" fill="#0d6b4e" opacity=".55"/>
<text x="503" y="369" font-size="11.5" font-weight="800" fill="#fff">Eukaryotes · single-celled OR multicellular</text>
<text x="505" y="388" font-size="11" fill="#ffffffdd">NOT animals, plants or bacteria</text>
<text x="505" y="407" font-size="11" fill="#ffffffdd">NO chlorophyll: decompose matter or are parasites</text>
<text x="505" y="426" font-size="11" fill="#ffffffdd">Reproduce with SPORES · cannot move around</text>
<text x="505" y="445" font-size="11" fill="#ffffffdd">Types: mushrooms · mold · yeast</text>
<text x="505" y="464" font-size="11" fill="#ffffffdd">Helpful: bread (yeast), penicillin, recycling soil</text>
<text x="505" y="483" font-size="11" fill="#ffffffdd">Harmful: mold on food, athlete's foot, poison</text>
<rect x="25" y="524" width="430" height="181" rx="14" fill="#0b5c43"/>
<text x="240" y="549" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">💧 PROTOZOA: WATER TRAVELERS</text>
<rect x="35" y="558" width="410" height="19" rx="5" fill="#0d6b4e" opacity=".55"/>
<text x="43" y="572" font-size="11.5" font-weight="800" fill="#fff">Single-celled eukaryotes (protists)</text>
<text x="45" y="591" font-size="11" fill="#ffffffdd">Live mostly in WET places: ponds, lakes, oceans</text>
<text x="45" y="610" font-size="11" fill="#ffffffdd">Move with flagella, cilia or pseudopodia</text>
<text x="45" y="629" font-size="11" fill="#ffffffdd">Eat bacteria · part of aquatic FOOD WEBS</text>
<text x="45" y="648" font-size="11" fill="#ffffffdd">Some are PARASITES (live in a host)</text>
<text x="45" y="667" font-size="11" fill="#ffffffdd">Cause: malaria, giardiasis, toxoplasmosis</text>
<text x="45" y="686" font-size="11" fill="#ffffffdd">Spread: dirty water or food, insect bites, contact</text>
<rect x="485" y="524" width="430" height="181" rx="14" fill="#0b5c43"/>
<text x="700" y="549" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🤒 INFECTIOUS DISEASES</text>
<rect x="495" y="558" width="410" height="19" rx="5" fill="#0d6b4e" opacity=".55"/>
<text x="503" y="572" font-size="11.5" font-weight="800" fill="#fff">Caused by PATHOGENS (germs)</text>
<text x="505" y="591" font-size="11" fill="#ffffffdd">Virus: flu, cold, measles, yellow fever, hepatitis</text>
<text x="505" y="610" font-size="11" fill="#ffffffdd">Bacteria: tuberculosis, cholera, typhoid, tetanus</text>
<text x="505" y="629" font-size="11" fill="#ffffffdd">Parasites: malaria, sleeping sickness, scabies</text>
<text x="505" y="648" font-size="11" fill="#ffffffdd">Fungi: ringworm, thrush, fungal meningitis</text>
<text x="505" y="667" font-size="11" fill="#ffffffdd">Spread: air, touch, food and water, insect bites</text>
<text x="505" y="686" font-size="11" fill="#ffffffdd">Wash your hands with soap and water!</text>
<rect x="25" y="727" width="890" height="190" rx="14" fill="#0b5c43"/>
<text x="470" y="752" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">⚖️ COMPARE THE 4 GROUPS</text>
<rect x="35" y="761" width="870" height="21" rx="5" fill="#0d6b4e" opacity=".8"/>
<text x="40" y="776" font-size="11.5" font-weight="800" fill="#fff">GROUP</text>
<text x="150" y="776" font-size="11.5" font-weight="800" fill="#fff">CELLS</text>
<text x="340" y="776" font-size="11.5" font-weight="800" fill="#fff">HOW IT LIVES</text>
<text x="590" y="776" font-size="11.5" font-weight="800" fill="#fff">WHERE</text>
<text x="750" y="776" font-size="11.5" font-weight="800" fill="#fff">EXAMPLES</text>
<rect x="35" y="791" width="870" height="24" rx="5" fill="#0d6b4e" opacity=".4"/>
<text x="40" y="806" font-size="11" font-weight="800" fill="#ffffffee">🦠 Bacteria</text>
<text x="150" y="806" font-size="11" font-weight="400" fill="#ffffffee">1 cell (prokaryote)</text>
<text x="340" y="806" font-size="11" font-weight="400" fill="#ffffffee">helpers or pathogens; decomposers</text>
<text x="590" y="806" font-size="11" font-weight="400" fill="#ffffffee">everywhere</text>
<text x="750" y="806" font-size="11" font-weight="400" fill="#ffffffee">yogurt · tetanus</text>
<text x="40" y="833" font-size="11" font-weight="800" fill="#ffffffee">🧬 Virus</text>
<text x="150" y="833" font-size="11" font-weight="400" fill="#ffffffee">NO cells (acellular)</text>
<text x="340" y="833" font-size="11" font-weight="400" fill="#ffffffee">needs a living HOST to copy itself</text>
<text x="590" y="833" font-size="11" font-weight="400" fill="#ffffffee">inside host cells</text>
<text x="750" y="833" font-size="11" font-weight="400" fill="#ffffffee">flu · measles</text>
<rect x="35" y="845" width="870" height="24" rx="5" fill="#0d6b4e" opacity=".4"/>
<text x="40" y="860" font-size="11" font-weight="800" fill="#ffffffee">🍄 Fungi</text>
<text x="150" y="860" font-size="11" font-weight="400" fill="#ffffffee">1 or many cells (eukaryote)</text>
<text x="340" y="860" font-size="11" font-weight="400" fill="#ffffffee">decompose matter or parasites; spores</text>
<text x="590" y="860" font-size="11" font-weight="400" fill="#ffffffee">land, water, air, hosts</text>
<text x="750" y="860" font-size="11" font-weight="400" fill="#ffffffee">mushroom · yeast · mold</text>
<text x="40" y="887" font-size="11" font-weight="800" fill="#ffffffee">💧 Protozoa</text>
<text x="150" y="887" font-size="11" font-weight="400" fill="#ffffffee">1 cell (eukaryote)</text>
<text x="340" y="887" font-size="11" font-weight="400" fill="#ffffffee">eat bacteria; some are parasites</text>
<text x="590" y="887" font-size="11" font-weight="400" fill="#ffffffee">wet places: ponds, seas</text>
<text x="750" y="887" font-size="11" font-weight="400" fill="#ffffffee">malaria · giardiasis</text>
<rect x="25" y="937" width="890" height="250" rx="14" fill="#fff" stroke="#1D9E75" stroke-width="3"/>
<text x="470" y="964" text-anchor="middle" font-size="15" font-weight="800" fill="#0d6b4e">💡 MEMORY TIPS</text>
<text x="45" y="991" font-size="11.5" font-weight="700" fill="#333">🔑 4 GROUPS = B·V·F·P: Bacteria · Virus · Fungi · Protozoa</text>
<text x="45" y="1017" font-size="11.5" font-weight="700" fill="#333">🧬 VIRUS = hijacker: needs a HOST. Antibiotics are useless, use VACCINES</text>
<text x="45" y="1043" font-size="11.5" font-weight="700" fill="#333">💊 ANTIBIOTICS fight BACTERIA only (not viruses!)</text>
<text x="45" y="1069" font-size="11.5" font-weight="700" fill="#333">🍞 YEAST makes CO₂ bubbles → bread dough rises</text>
<text x="45" y="1095" font-size="11.5" font-weight="700" fill="#333">🍄 FUNGI have no chlorophyll, so they can't make food like plants</text>
<text x="45" y="1121" font-size="11.5" font-weight="700" fill="#333">🧼 SOAP + water is better than sanitizer: sanitizer also clears helpful bacteria</text>
<text x="45" y="1147" font-size="11.5" font-weight="700" fill="#333">🧪 PATHOGEN = the scientific word for GERM. Most microbes are helpful!</text>
</svg>

  <div class="mind-map" id="mm-ciencias3">
<svg viewBox="0 0 940 1210" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-height:80vh">
<rect width="940" height="1210" rx="18" fill="#E6F1FB"/>
<rect x="180" y="18" width="580" height="72" rx="16" fill="#378ADD"/>
<text x="470" y="50" text-anchor="middle" font-size="21" font-weight="800" fill="#fff">🔬 CIÊNCIAS — Microrganismos</text>
<text x="470" y="74" text-anchor="middle" font-size="12" fill="#ffffffcc">Decomposição · Fungos · Bactérias · Probióticos · Vacinas</text>
<line x1="300" y1="90" x2="240" y2="118" stroke="#378ADD" stroke-width="2.5" opacity=".55"/>
<line x1="640" y1="90" x2="700" y2="118" stroke="#378ADD" stroke-width="2.5" opacity=".55"/>
<rect x="25" y="118" width="430" height="181" rx="14" fill="#0C447C"/>
<text x="240" y="143" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🔬 MICROORGANISMOS</text>
<rect x="35" y="152" width="410" height="19" rx="5" fill="#185FA5" opacity=".7"/>
<text x="43" y="166" font-size="11.5" font-weight="800" fill="#fff">Seres vivos que só se veem com MICROSCÓPIO</text>
<text x="45" y="185" font-size="11" fill="#ffffffdd">Estão no ar, no solo, na água e no homem</text>
<text x="45" y="204" font-size="11" fill="#ffffffdd">Estudamos 2 grupos: BACTÉRIAS e FUNGOS</text>
<text x="45" y="223" font-size="11" fill="#ffffffdd">Fungos e bactérias = DECOMPOSITORES</text>
<text x="45" y="242" font-size="11" fill="#ffffffdd">Decomposição: restos viram nutrientes</text>
<text x="45" y="261" font-size="11" fill="#ffffffdd">Os nutrientes VOLTAM ao meio ambiente</text>
<text x="45" y="280" font-size="11" fill="#ffffffdd">Sem eles, os nutrientes não são reaproveitados</text>
<rect x="485" y="118" width="430" height="181" rx="14" fill="#0C447C"/>
<text x="700" y="143" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🍄 FUNGOS (Reino Fungi)</text>
<rect x="495" y="152" width="410" height="19" rx="5" fill="#185FA5" opacity=".7"/>
<text x="503" y="166" font-size="11.5" font-weight="800" fill="#fff">NÃO produzem o próprio alimento · não são plantas</text>
<text x="505" y="185" font-size="11" fill="#ffffffdd">Vivem no solo, na água, em plantas e animais</text>
<text x="505" y="204" font-size="11" fill="#ffffffdd">Decompositores: orelha-de-pau, mofo no pão</text>
<text x="505" y="223" font-size="11" fill="#ffffffdd">Doenças: micose, frieira · FERRUGEM nas plantas</text>
<text x="505" y="242" font-size="11" fill="#ffffffdd">Remédios: PENICILINA (mata bactérias)</text>
<text x="505" y="261" font-size="11" fill="#ffffffdd">Cogumelos comestíveis: champignon, shimeji, shitake</text>
<text x="505" y="280" font-size="11" fill="#ffffffdd">Nem todo cogumelo da natureza se pode comer</text>
<rect x="25" y="321" width="430" height="181" rx="14" fill="#0C447C"/>
<text x="240" y="346" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🍞 FUNGOS NA COZINHA</text>
<rect x="35" y="355" width="410" height="19" rx="5" fill="#185FA5" opacity=".7"/>
<text x="43" y="369" font-size="11.5" font-weight="800" fill="#fff">Leveduras = FERMENTO · fermentação</text>
<text x="45" y="388" font-size="11" fill="#ffffffdd">Pão: leveduras soltam GÁS CARBÔNICO (CO2)</text>
<text x="45" y="407" font-size="11" fill="#ffffffdd">O gás faz furinhos e a massa CRESCE</text>
<text x="45" y="426" font-size="11" fill="#ffffffdd">Líquido MORNO: temperatura certa p/ fermentar</text>
<text x="45" y="445" font-size="11" fill="#ffffffdd">Vinho = uva · Cerveja = cevada · Shoyu = soja</text>
<text x="45" y="464" font-size="11" fill="#ffffffdd">Fermentação: o açúcar vira ÁLCOOL (bebidas)</text>
<text x="45" y="483" font-size="11" fill="#ffffffdd">Queijos azuis/verdes: fungos comestíveis</text>
<rect x="485" y="321" width="430" height="181" rx="14" fill="#0C447C"/>
<text x="700" y="346" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🦠 BACTÉRIAS</text>
<rect x="495" y="355" width="410" height="19" rx="5" fill="#185FA5" opacity=".7"/>
<text x="503" y="369" font-size="11.5" font-weight="800" fill="#fff">Seres vivos microscópicos · bem e mal</text>
<text x="505" y="388" font-size="11" fill="#ffffffdd">Decompositoras: ajudam a devolver nutrientes</text>
<text x="505" y="407" font-size="11" fill="#ffffffdd">Patogênicas = causam doenças (multiplicam rápido)</text>
<text x="505" y="426" font-size="11" fill="#ffffffdd">PNEUMONIA = pulmões · OTITE = ouvidos</text>
<text x="505" y="445" font-size="11" fill="#ffffffdd">Lactobacilos = 'bactérias do BEM'</text>
<text x="505" y="464" font-size="11" fill="#ffffffdd">Iogurte, queijos e bebidas lácteas (Yakult)</text>
<text x="505" y="483" font-size="11" fill="#ffffffdd">Fermentação transforma o açúcar do leite</text>
<rect x="25" y="524" width="430" height="181" rx="14" fill="#0C447C"/>
<text x="240" y="549" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🥛 PROBIÓTICOS E QUEIJOS</text>
<rect x="35" y="558" width="410" height="19" rx="5" fill="#185FA5" opacity=".7"/>
<text x="43" y="572" font-size="11.5" font-weight="800" fill="#fff">Microrganismos VIVOS que ajudam o intestino</text>
<text x="45" y="591" font-size="11" fill="#ffffffdd">Probióticos: coalhada, iogurte, kefir, leite ferment.</text>
<text x="45" y="610" font-size="11" fill="#ffffffdd">Colônia de bactérias que fazem bem à saúde</text>
<text x="45" y="629" font-size="11" fill="#ffffffdd">FURINHOS do queijo = gases de BACTÉRIAS</text>
<text x="45" y="648" font-size="11" fill="#ffffffdd">Queijo suíço (emmental), gruyère, gouda...</text>
<text x="45" y="667" font-size="11" fill="#ffffffdd">Derivados do leite: cálcio e vitaminas</text>
<text x="45" y="686" font-size="11" fill="#ffffffdd">Cuidado: vinho e pão = FUNGOS, iogurte = BACTÉRIAS</text>
<rect x="485" y="524" width="430" height="181" rx="14" fill="#0C447C"/>
<text x="700" y="549" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">💉 VACINAS E FLEMING</text>
<rect x="495" y="558" width="410" height="19" rx="5" fill="#185FA5" opacity=".7"/>
<text x="503" y="572" font-size="11.5" font-weight="800" fill="#fff">Proteção para você e para todos</text>
<text x="505" y="591" font-size="11" fill="#ffffffdd">Vacina: vírus MORTO ou ATENUADO (fraco)</text>
<text x="505" y="610" font-size="11" fill="#ffffffdd">Estimula o SISTEMA IMUNOLÓGICO a se defender</text>
<text x="505" y="629" font-size="11" fill="#ffffffdd">Vacina = PREVENÇÃO (antes) · antibiótico = TRATAMENTO</text>
<text x="505" y="648" font-size="11" fill="#ffffffdd">Mais gente vacinada = menos risco de doenças</text>
<text x="505" y="667" font-size="11" fill="#ffffffdd">Fleming, 1928: descobriu a PENICILINA por acaso</text>
<text x="505" y="686" font-size="11" fill="#ffffffdd">Mofo sem bactérias em volta → antibiótico</text>
<rect x="25" y="727" width="890" height="190" rx="14" fill="#0C447C"/>
<text x="470" y="752" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">⚖️ FUNGOS × BACTÉRIAS: QUEM FAZ O QUÊ?</text>
<rect x="35" y="761" width="870" height="21" rx="5" fill="#185FA5" opacity=".85"/>
<text x="40" y="776" font-size="11.5" font-weight="800" fill="#fff">ASSUNTO</text>
<text x="200" y="776" font-size="11.5" font-weight="800" fill="#fff">FUNGOS 🍄</text>

<svg viewBox="0 0 940 1210" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-height:80vh">
<rect width="940" height="1210" rx="18" fill="#FBEAF0"/>
<rect x="180" y="18" width="580" height="72" rx="16" fill="#D4537E"/>
<text x="470" y="50" text-anchor="middle" font-size="21" font-weight="800" fill="#fff">📚 LÍNGUA PORTUGUESA — 3º Tri</text>
<text x="470" y="74" text-anchor="middle" font-size="12" fill="#ffffffcc">Lendas · Verbos · Concordância · Plural L e U · Discurso · Aposto e vocativo</text>
<line x1="300" y1="90" x2="240" y2="118" stroke="#D4537E" stroke-width="2.5" opacity=".55"/>
<line x1="640" y1="90" x2="700" y2="118" stroke="#D4537E" stroke-width="2.5" opacity=".55"/>
<rect x="25" y="118" width="430" height="181" rx="14" fill="#72243E"/>
<text x="240" y="143" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">📜 LENDAS BRASILEIRAS</text>
<rect x="35" y="152" width="410" height="19" rx="5" fill="#993556" opacity=".7"/>
<text x="43" y="166" font-size="11.5" font-weight="800" fill="#fff">História popular passada de boca em boca</text>
<text x="45" y="185" font-size="11" fill="#ffffffdd">Autor desconhecido · tradição ORAL</text>
<text x="45" y="204" font-size="11" fill="#ffffffdd">Mistura REALIDADE e FANTASIA</text>
<text x="45" y="223" font-size="11" fill="#ffffffdd">Seres do folclore: Curupira, Saci, Iara, Boitatá</text>
<text x="45" y="242" font-size="11" fill="#ffffffdd">Explica a origem de algo ou deixa uma LIÇÃO</text>
<text x="45" y="261" font-size="11" fill="#ffffffdd">Começa com "Há muito tempo..."</text>
<rect x="485" y="118" width="430" height="181" rx="14" fill="#72243E"/>
<text x="700" y="143" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🏃 VERBOS</text>
<rect x="495" y="152" width="410" height="19" rx="5" fill="#993556" opacity=".7"/>
<text x="503" y="166" font-size="11.5" font-weight="800" fill="#fff">Ação · estado · fenômeno da natureza</text>
<text x="505" y="185" font-size="11" fill="#ffffffdd">Ação: correr · Estado: ser, estar</text>
<text x="505" y="204" font-size="11" fill="#ffffffdd">Fenômeno: chover, trovejar, nevar</text>
<text x="505" y="223" font-size="11" fill="#ffffffdd">1ª conjugação: -AR (cantar, falar, amar)</text>
<text x="505" y="242" font-size="11" fill="#ffffffdd">2ª conjugação: -ER (comer, correr, ler)</text>
<text x="505" y="261" font-size="11" fill="#ffffffdd">3ª conjugação: -IR (partir, sorrir, latir)</text>
<rect x="25" y="321" width="430" height="181" rx="14" fill="#72243E"/>
<text x="240" y="346" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">⏳ TEMPOS: -AM × -ÃO</text>
<rect x="35" y="355" width="410" height="19" rx="5" fill="#993556" opacity=".7"/>
<text x="43" y="369" font-size="11.5" font-weight="800" fill="#fff">Passado = -AM (sem til) · Futuro = -ÃO (com til)</text>
<text x="45" y="388" font-size="11" fill="#ffffffdd">Presente: eu como · eles COMEM (agora)</text>
<text x="45" y="407" font-size="11" fill="#ffffffdd">Passado: eu comi · eles COMERAM (ontem)</text>
<text x="45" y="426" font-size="11" fill="#ffffffdd">Futuro: eu comerei · eles COMERÃO (amanhã)</text>
<text x="45" y="445" font-size="11" fill="#ffffffdd">Ontem + brincaram · Amanhã + brincarão</text>
<text x="45" y="464" font-size="11" fill="#ffffffdd">O verbo combina com a palavra de tempo</text>
<rect x="485" y="321" width="430" height="181" rx="14" fill="#72243E"/>
<text x="700" y="346" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🤝 CONCORDÂNCIA</text>
<rect x="495" y="355" width="410" height="19" rx="5" fill="#993556" opacity=".7"/>
<text x="503" y="369" font-size="11.5" font-weight="800" fill="#fff">Verbo e sujeito precisam COMBINAR</text>
<text x="505" y="388" font-size="11" fill="#ffffffdd">Sujeito = quem faz a ação (o capitão do time)</text>
<text x="505" y="407" font-size="11" fill="#ffffffdd">Singular + singular: O gato CORRE</text>
<text x="505" y="426" font-size="11" fill="#ffffffdd">Plural + plural: Os gatos CORREM</text>
<text x="505" y="445" font-size="11" fill="#ffffffdd">Sujeito oculto: "Brincamos" = nós</text>
<text x="505" y="464" font-size="11" fill="#ffffffdd">Nominal: artigo + substantivo + adjetivo combinam</text>
<rect x="25" y="524" width="430" height="181" rx="14" fill="#72243E"/>
<text x="240" y="549" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🔤 PLURAL EM L e U</text>
<rect x="35" y="558" width="410" height="19" rx="5" fill="#993556" opacity=".7"/>
<text x="43" y="572" font-size="11.5" font-weight="800" fill="#fff">Olhe a TERMINAÇÃO da palavra</text>
<text x="45" y="591" font-size="11" fill="#ffffffdd">U → só + S: cacau → cacaus · chapéu → chapéus</text>
<text x="45" y="610" font-size="11" fill="#ffffffdd">AL, EL, OL → tira o L + IS: jornal → jornais</text>
<text x="45" y="629" font-size="11" fill="#ffffffdd">     anel → anéis · hotel → hotéis · sol → sóis</text>
<text x="45" y="648" font-size="11" fill="#ffffffdd">IL → tira o L + S: barril → barris · funil → funis</text>
<text x="45" y="667" font-size="11" fill="#ffffffdd">É regra básica: existem exceções</text>
<rect x="485" y="524" width="430" height="181" rx="14" fill="#72243E"/>
<text x="700" y="549" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">💬 DISCURSO DIRETO × INDIRETO</text>
<rect x="495" y="558" width="410" height="19" rx="5" fill="#993556" opacity=".7"/>
<text x="503" y="572" font-size="11.5" font-weight="800" fill="#fff">Direto = fala EXATA · Indireto = narrador conta</text>
<text x="505" y="591" font-size="11" fill="#ffffffdd">Direto: dois-pontos (:) e travessão (—)</text>
<text x="505" y="610" font-size="11" fill="#ffffffdd">Mudança de linha = outro personagem fala</text>
<text x="505" y="629" font-size="11" fill="#ffffffdd">Verbos: falar, dizer, perguntar, responder</text>
<text x="505" y="648" font-size="11" fill="#ffffffdd">Indireto: usa "QUE" e não usa travessão</text>
<text x="505" y="667" font-size="11" fill="#ffffffdd">Ana disse: — Estou bem. → disse que estava bem</text>
<rect x="25" y="727" width="890" height="190" rx="14" fill="#72243E"/>
<text x="470" y="752" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">⚖️ APOSTO × VOCATIVO: QUAL É QUAL?</text>
<rect x="35" y="761" width="870" height="21" rx="5" fill="#993556" opacity=".85"/>
<text x="40" y="776" font-size="11.5" font-weight="800" fill="#fff">ASSUNTO</text>
<text x="200" y="776" font-size="11.5" font-weight="800" fill="#fff">APOSTO 📖</text>
<text x="520" y="776" font-size="11.5" font-weight="800" fill="#fff">VOCATIVO 📣</text>
<rect x="35" y="791" width="870" height="24" rx="5" fill="#993556" opacity=".45"/>
<text x="40" y="806" font-size="11" font-weight="800" fill="#ffffffee">O que faz</text>
<text x="200" y="806" font-size="11" font-weight="400" fill="#ffffffee">EXPLICA um substantivo que veio antes</text>
<text x="520" y="806" font-size="11" font-weight="400" fill="#ffffffee">CHAMA alguém (o ouvinte)</text>
<text x="40" y="833" font-size="11" font-weight="800" fill="#ffffffee">Vírgulas</text>
<text x="200" y="833" font-size="11" font-weight="400" fill="#ffffffee">quase sempre ENTRE vírgulas</text>
<text x="520" y="833" font-size="11" font-weight="400" fill="#ffffffee">sempre SEPARADO por vírgula</text>
<rect x="35" y="845" width="870" height="24" rx="5" fill="#993556" opacity=".45"/>
<text x="40" y="860" font-size="11" font-weight="800" fill="#ffffffee">Onde fica</text>
<text x="200" y="860" font-size="11" font-weight="400" fill="#ffffffee">logo depois do substantivo explicado</text>
<text x="520" y="860" font-size="11" font-weight="400" fill="#ffffffee">início, meio ou fim da frase</text>
<text x="40" y="887" font-size="11" font-weight="800" fill="#ffffffee">Exemplo</text>
<text x="200" y="887" font-size="11" font-weight="400" fill="#ffffffee">Lucas, o goleiro do time, defendeu</text>
<text x="520" y="887" font-size="11" font-weight="400" fill="#ffffffee">Paulo, venha aqui! · Venha, Paulo!</text>
<rect x="25" y="937" width="890" height="250" rx="14" fill="#fff" stroke="#D4537E" stroke-width="3"/>
<text x="470" y="964" text-anchor="middle" font-size="15" font-weight="800" fill="#72243E">💡 DICAS DE MEMÓRIA</text>
<text x="45" y="991" font-size="11.5" font-weight="700" fill="#333">🔑 APOSTO explica (Lucas, o goleiro do time, ...) · VOCATIVO chama (Paulo, venha aqui!)</text>
<text x="45" y="1017" font-size="11.5" font-weight="700" fill="#333">🕐 ONTEM → verbo em -AM (passado) · AMANHÃ → verbo em -ÃO (futuro)</text>
<text x="45" y="1043" font-size="11.5" font-weight="700" fill="#333">📝 Sujeito plural = verbo plural: Os cachorros LATEM (e não "late")</text>
<text x="45" y="1069" font-size="11.5" font-weight="700" fill="#333">🔤 U → + S · AL/EL/OL → tira o L + IS · IL → tira o L + S</text>
<text x="45" y="1095" font-size="11.5" font-weight="700" fill="#333">✏️ Acentos no plural: anel → ANÉIS · hotel → HOTÉIS · sol → SÓIS · caracol → CARACÓIS</text>
<text x="45" y="1121" font-size="11.5" font-weight="700" fill="#333">💬 Discurso DIRETO = dois-pontos + travessão · INDIRETO = disse QUE</text>
<text x="45" y="1147" font-size="11.5" font-weight="700" fill="#333">🧙 Lenda: autor desconhecido, tradição oral, fantasia e uma lição</text>
<text x="45" y="1173" font-size="11.5" font-weight="700" fill="#333">⚠️ Enunciado com INCORRETA, FALSA ou ERRADA: leia duas vezes antes de marcar!</text>
</svg>

<svg viewBox="0 0 940 740" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-height:74vh">
<rect width="940" height="740" rx="18" fill="#fdeef3"/>
<rect x="180" y="18" width="580" height="72" rx="16" fill="#D4537E"/>
<text x="470" y="50" text-anchor="middle" font-size="21" font-weight="800" fill="#fff">📚 LÍNGUA PORTUGUESA</text>
<text x="470" y="74" text-anchor="middle" font-size="12" fill="#ffffffcc">Divulgação científica · Artigos · Concordância · Transformação</text>
<line x1="300" y1="90" x2="180" y2="118" stroke="#D4537E" stroke-width="2.5" opacity=".55"/>
<line x1="640" y1="90" x2="760" y2="118" stroke="#D4537E" stroke-width="2.5" opacity=".55"/>
<rect x="25" y="118" width="430" height="181" rx="14" fill="#7d2745"/>
<text x="240" y="143" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🔬 DIVULGAÇÃO CIENTÍFICA</text>
<rect x="35" y="152" width="410" height="19" rx="5" fill="#8f2d4f" opacity=".55"/>
<text x="43" y="166" font-size="11.5" font-weight="800" fill="#fff">Explica a ciência para o público comum</text>
<text x="45" y="185" font-size="11" fill="#ffffffdd">Linguagem clara · fatos verificados</text>
<text x="45" y="204" font-size="11" fill="#ffffffdd">Cita a fonte: "segundo pesquisadores"</text>
<text x="45" y="223" font-size="11" fill="#ffffffdd">Usa comparações do dia a dia</text>
<text x="45" y="242" font-size="11" fill="#ffffffdd">Revistas, sites, museus, documentários</text>
<text x="45" y="261" font-size="11" fill="#ffffffdd">NÃO tem personagem inventado nem enredo</text>
<rect x="485" y="118" width="430" height="181" rx="14" fill="#7d2745"/>
<text x="700" y="143" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🅰️ ARTIGOS E GÊNERO</text>
<rect x="495" y="152" width="410" height="19" rx="5" fill="#8f2d4f" opacity=".55"/>
<text x="503" y="166" font-size="11.5" font-weight="800" fill="#fff">DEFINIDOS: o, a, os, as → já conhecido</text>
<rect x="495" y="171" width="410" height="19" rx="5" fill="#8f2d4f" opacity=".55"/>
<text x="503" y="185" font-size="11.5" font-weight="800" fill="#fff">INDEFINIDOS: um, uma, uns, umas → novo</text>
<text x="505" y="204" font-size="11" fill="#ffffffdd">o · os · um · uns → gênero MASCULINO</text>
<text x="505" y="223" font-size="11" fill="#ffffffdd">a · as · uma · umas → gênero FEMININO</text>
<rect x="495" y="228" width="410" height="19" rx="5" fill="#8f2d4f" opacity=".55"/>
<text x="503" y="242" font-size="11.5" font-weight="800" fill="#fff">COMUNS DE DOIS GÊNEROS</text>
<text x="505" y="261" font-size="11" fill="#ffffffdd">o/a motorista · o/a jovem · o/a estudante</text>
<text x="505" y="280" font-size="11" fill="#ffffffdd">só o artigo mostra se é masc. ou fem.</text>
<rect x="25" y="321" width="430" height="181" rx="14" fill="#7d2745"/>
<text x="240" y="346" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🤝 CONCORDÂNCIA NOMINAL</text>
<rect x="35" y="355" width="410" height="19" rx="5" fill="#8f2d4f" opacity=".55"/>
<text x="43" y="369" font-size="11.5" font-weight="800" fill="#fff">Artigo e adjetivo copiam o SUBSTANTIVO</text>
<text x="45" y="388" font-size="11" fill="#ffffffdd">em gênero (masc/fem) e número (sing/pl)</text>
<text x="45" y="407" font-size="11" fill="#ffffffdd">ADJETIVO = qualifica o substantivo,</text>
<text x="45" y="426" font-size="11" fill="#ffffffdd">indicando-lhe uma característica</text>
<text x="45" y="445" font-size="11" fill="#ffffffdd">ex: As plantas nativas cresceram</text>
<rect x="35" y="450" width="410" height="19" rx="5" fill="#8f2d4f" opacity=".55"/>
<text x="43" y="464" font-size="11.5" font-weight="800" fill="#fff">Gêneros diferentes → masculino plural</text>
<text x="45" y="483" font-size="11" fill="#ffffffdd">o menino e a menina curiosOS</text>
<rect x="485" y="321" width="430" height="181" rx="14" fill="#7d2745"/>
<text x="700" y="346" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🔄 TRANSFORMAÇÃO</text>
<rect x="495" y="355" width="410" height="19" rx="5" fill="#8f2d4f" opacity=".55"/>
<text x="503" y="369" font-size="11.5" font-weight="800" fill="#fff">Plural: TUDO muda junto</text>
<text x="505" y="388" font-size="11" fill="#ffffffdd">O pequeno príncipe → Os pequenos príncipes</text>
<text x="505" y="407" font-size="11" fill="#ffffffdd">O rei leão → Os reis leões</text>
<text x="505" y="426" font-size="11" fill="#ffffffdd">Uma fazenda maluca → Umas fazendas malucas</text>
<rect x="495" y="431" width="410" height="19" rx="5" fill="#8f2d4f" opacity=".55"/>
<text x="503" y="445" font-size="11.5" font-weight="800" fill="#fff">Feminino: os artigos TODOS mudam</text>
<text x="505" y="464" font-size="11" fill="#ffffffdd">o cientista como o profissional →</text>
<text x="505" y="483" font-size="11" fill="#ffffffdd">a cientista como a profissional</text>
<rect x="25" y="526" width="890" height="192" rx="14" fill="#fff" stroke="#D4537E" stroke-width="3"/>
<text x="470" y="553" text-anchor="middle" font-size="15" font-weight="800" fill="#8f2d4f">💡 DICAS PARA DECORAR</text>
<text x="45" y="578" font-size="11.5" font-weight="700" fill="#333">🔑 Primeira vez que aparece? UM/UMA. Já conhecido ou específico? O/A.</text>
<text x="45" y="598" font-size="11.5" font-weight="700" fill="#333">🧠 O adjetivo COPIA o substantivo. Se ele é feminino plural, o adjetivo também é.</text>
<text x="45" y="618" font-size="11.5" font-weight="700" fill="#333">⚠️ No plural, NÃO esqueça nenhuma palavra: artigo + substantivo + adjetivo, os três.</text>
<text x="45" y="638" font-size="11.5" font-weight="700" fill="#333">⚠️ O adjetivo depois do verbo também concorda: "são inteligentES", não "são inteligente".</text>
<text x="45" y="658" font-size="11.5" font-weight="700" fill="#333">👦👧 Menino + menina juntos → adjetivo no MASCULINO PLURAL (curiosos).</text>
<text x="45" y="678" font-size="11.5" font-weight="700" fill="#333">🚕 Motorista e jovem servem para os dois gêneros — quem decide é o artigo.</text>
<text x="45" y="698" font-size="11.5" font-weight="700" fill="#333">📰 Divulgação científica = ciência + linguagem simples + fonte citada.</text>
</svg>

<text x="240" y="143" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">⚖️ MEDIDAS DE MASSA</text>
<rect x="35" y="152" width="410" height="19" rx="5" fill="#7d4d0c" opacity=".55"/>
<text x="43" y="166" font-size="11.5" font-weight="800" fill="#fff">A regra de ouro: sempre 1.000</text>
<text x="45" y="185" font-size="11" fill="#ffffffdd">1 t = 1.000 kg  (tonelada)</text>
<text x="45" y="204" font-size="11" fill="#ffffffdd">1 kg = 1.000 g  (quilograma)</text>
<text x="45" y="223" font-size="11" fill="#ffffffdd">1 g = 1.000 mg  (miligrama)</text>
<text x="45" y="242" font-size="11" fill="#ffffffdd">Balanças: precisão (mg/g) · cozinha (g/kg)</text>
<text x="45" y="261" font-size="11" fill="#ffffffdd">pediátrica (kg) · rodoviária (t)</text>
<rect x="485" y="118" width="430" height="162" rx="14" fill="#6b420a"/>
<text x="700" y="143" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">📏 MEDIDAS DE COMPRIMENTO</text>
<rect x="495" y="152" width="410" height="19" rx="5" fill="#7d4d0c" opacity=".55"/>
<text x="503" y="166" font-size="11.5" font-weight="800" fill="#fff">CUIDADO: aqui NÃO é tudo 1.000!</text>
<text x="505" y="185" font-size="11" fill="#ffffffdd">1 km = 1.000 m</text>
<text x="505" y="204" font-size="11" fill="#ffffffdd">1 m = 100 cm</text>
<text x="505" y="223" font-size="11" fill="#ffffffdd">1 cm = 10 mm</text>
<text x="505" y="242" font-size="11" fill="#ffffffdd">1 m = 1.000 mm</text>
<text x="505" y="261" font-size="11" fill="#ffffffdd">km = cidades · m = altura · mm = formiga</text>
<rect x="25" y="302" width="430" height="162" rx="14" fill="#6b420a"/>
<text x="240" y="327" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🔲 PERÍMETRO</text>
<rect x="35" y="336" width="410" height="19" rx="5" fill="#7d4d0c" opacity=".55"/>
<text x="43" y="350" font-size="11.5" font-weight="800" fill="#fff">É a medida do CONTORNO da figura</text>
<text x="45" y="369" font-size="11" fill="#ffffffdd">Soma de TODOS os lados do polígono</text>
<text x="45" y="388" font-size="11" fill="#ffffffdd">ex: 34 + 34 + 20 + 20 = 108 m</text>
<text x="45" y="407" font-size="11" fill="#ffffffdd">Unidade simples: cm, m, km</text>
<text x="45" y="426" font-size="11" fill="#ffffffdd">Na malha: conte os lados da borda</text>
<text x="45" y="445" font-size="11" fill="#ffffffdd">⚠️ "2 voltas" → multiplique por 2!</text>
<rect x="485" y="302" width="430" height="162" rx="14" fill="#6b420a"/>
<text x="700" y="327" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🟩 ÁREA</text>
<rect x="495" y="336" width="410" height="19" rx="5" fill="#7d4d0c" opacity=".55"/>
<text x="503" y="350" font-size="11.5" font-weight="800" fill="#fff">É a medida da SUPERFÍCIE interna</text>
<text x="505" y="369" font-size="11" fill="#ffffffdd">Retângulo = comprimento × largura</text>
<text x="505" y="388" font-size="11" fill="#ffffffdd">ex: 12 × 9 = 108 m²</text>
<text x="505" y="407" font-size="11" fill="#ffffffdd">Unidade AO QUADRADO: cm², m²</text>
<text x="505" y="426" font-size="11" fill="#ffffffdd">Na malha: conte os quadradinhos</text>
<text x="505" y="445" font-size="11" fill="#ffffffdd">Mesma área pode ter formatos diferentes</text>
<rect x="25" y="488" width="890" height="212" rx="14" fill="#fff" stroke="#BA7517" stroke-width="3"/>
<text x="470" y="515" text-anchor="middle" font-size="15" font-weight="800" fill="#7d4d0c">💡 DICAS PARA DECORAR</text>
<text x="45" y="540" font-size="11.5" font-weight="700" fill="#333">🔑 PERÍMETRO = a cerca em volta (m).  ÁREA = o piso lá dentro (m²).</text>
<text x="45" y="560" font-size="11.5" font-weight="700" fill="#333">⚠️ A ÁREA sempre leva o ² na unidade. Escrever "20 cm" em vez de "20 cm²" é erro.</text>
<text x="45" y="580" font-size="11.5" font-weight="700" fill="#333">🎯 O campo do Carlos tem 108 m de perímetro e a sala da Marcinha 108 m² de área — só a UNIDADE diferencia.</text>
<text x="45" y="600" font-size="11.5" font-weight="700" fill="#333">⚖️ MASSA é tudo de 1.000 em 1.000: t → kg → g → mg.</text>
<text x="45" y="620" font-size="11.5" font-weight="700" fill="#333">📏 COMPRIMENTO é diferente: km→m é 1.000, mas m→cm é 100 e cm→mm é 10.</text>
<text x="45" y="640" font-size="11.5" font-weight="700" fill="#333">✅ Confira a divisão: quociente × divisor + resto = número original.</text>
<text x="45" y="660" font-size="11.5" font-weight="700" fill="#333">✍️ Terminou a conta? CONFIRA se o número que você escreveu é o mesmo da conta armada.</text>
<text x="45" y="680" font-size="11.5" font-weight="700" fill="#333">📊 Gráfico: leia o título e a escala ANTES de responder qualquer coisa.</text>
</svg>

   summary:'A água pode estar em 3 estados físicos: SÓLIDO (gelo — forma e volume definidos, moléculas bem próximas), LÍQUIDO (água — volume definido, toma a forma do recipiente, moléculas deslizam com atração) e GASOSO (vapor — sem forma nem volume, moléculas bastante desagregadas). Mudanças de estado: FUSÃO (sólido→líquido, 0°C), VAPORIZAÇÃO (líquido→gasoso: evaporação=lenta, ebulição=rápida, calefação=instantânea), SOLIDIFICAÇÃO (líquido→sólido), CONDENSAÇÃO/LIQUEFAÇÃO (gasoso→líquido — ex: garrafa suando, espelho embaçando, orvalho nas folhas), SUBLIMAÇÃO (sólido→gasoso direto). Atenção: a NUVEM é feita de gotículas LÍQUIDAS (vapor já condensou — NÃO é vapor!). O CICLO DA ÁGUA é uma sequência sem começo nem fim: EVAPORAÇÃO (sol aquece → vapor sobe) → CONDENSAÇÃO (vapor esfria → nuvens) → PRECIPITAÇÃO (gotículas caem: chuva/neve/granizo) → ESCOAMENTO (água escorre pela superfície) e/ou INFILTRAÇÃO (entra no solo → lençóis freáticos) → TRANSPIRAÇÃO (plantas devolvem vapor ao ar) → recomeça.',
   tips:[
     '🧊 SÓLIDO = forma e volume DEFINIDOS · moléculas PRÓXIMAS e presas',
     '💧 LÍQUIDO = volume definido, toma a forma do recipiente · moléculas DESLIZANDO com atração',
     '💨 GASOSO = sem forma nem volume · moléculas DESAGREGADAS e bem distantes',
     '🔥 FUSÃO = sólido→líquido (gelo derrete a 0°C). SOLIDIFICAÇÃO = líquido→sólido (congela)',
     '♨️ VAPORIZAÇÃO: evaporação=lenta (roupa no varal) · ebulição=rápida (panela fervendo) · calefação=instantânea',
     '💦 CONDENSAÇÃO = LIQUEFAÇÃO = gasoso→líquido. Ex: garrafa suando, espelho embaçado, ORVALHO nas folhas',
     '❄️ SUBLIMAÇÃO = sólido→gasoso DIRETO (sem passar pelo líquido). Ex: alimento ressecando no freezer',
     '☁️ NUVEM = gotículas LÍQUIDAS (NÃO é vapor!). Formação da nuvem = CONDENSAÇÃO',
     '🌧️ CICLO: evaporação → condensação (nuvem) → precipitação → escoamento/infiltração → transpiração → recomeça',
     '🌊 ESCOAMENTO = água que NÃO infiltra e escorre pela superfície até rios/mar',
     '🌱 TRANSPIRAÇÃO = plantas devolvem água à atmosfera em forma de vapor'
   ]},
