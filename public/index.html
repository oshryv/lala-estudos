"72\" height=\"46\" rx=\"6\" fill=\"#8c8c8c\" stroke=\"#4a4a4a\" stroke-width=\"2\"/><text x=\"518\" y=\"106\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#fff\">ASH</text><text x=\"518\" y=\"124\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#eee\">+ CO₂</text><text x=\"447\" y=\"184\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"800\" fill=\"#a32d2d\">NEW substance ✗</text><text x=\"447\" y=\"210\" text-anchor=\"middle\" font-size=\"15\" fill=\"#333\">signs: Colour · Odour · Sound</text><text x=\"447\" y=\"232\" text-anchor=\"middle\" font-size=\"15\" fill=\"#333\">Gas · Light · Temperature</text><text x=\"447\" y=\"266\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#a32d2d\">USUALLY cannot be undone</text></svg>"},{t:"🔄 Reversible vs Irreversible", svg:"<svg viewBox=\"0 0 600 260\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto\"><rect width=\"600\" height=\"260\" rx=\"14\" fill=\"#f7f9f8\"/><defs><marker id=\"ar2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L10,3.5 z\" fill=\"#1D9E75\"/></marker><marker id=\"ar3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L10,3.5 z\" fill=\"#E24B4A\"/></marker></defs><text x=\"300\" y=\"30\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"800\" fill=\"#0d6b4e\">REVERSIBLE — you can go back</text><rect x=\"118\" y=\"46\" width=\"90\" height=\"60\" rx=\"8\" fill=\"#bfe4f5\" stroke=\"#3a7fa5\" stroke-width=\"2\"/><text x=\"163\" y=\"83\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#1b4c66\">ICE</text><line x1=\"222\" y1=\"62\" x2=\"376\" y2=\"62\" stroke=\"#1D9E75\" stroke-width=\"3\" marker-end=\"url(#ar2)\"/><text x=\"299\" y=\"55\" text-anchor=\"middle\" font-size=\"14\" fill=\"#0d6b4e\">melting</text><line x1=\"376\" y1=\"92\" x2=\"222\" y2=\"92\" stroke=\"#1D9E75\" stroke-width=\"3\" marker-e    summary:"<b style=\"font-size:14px\">🧱 MATTER & PROPERTIES</b><br>Matter is anything that has mass and takes up space, and it is made of tiny particles called atoms. Its three basic properties are shape, volume (the amount of space it takes up) and mass (the amount of matter it has). Other observable properties include colour, length, density, elasticity, pressure and luster.<br><span style=\"display:inline-block;margin-top:6px;padding-left:10px;border-left:3px solid rgba(0,0,0,.15);color:#5a5a5a;font-style:italic\">🇧🇷 Matéria é tudo que tem massa e ocupa espaço, e é feita de partículas minúsculas chamadas átomos. Suas três propriedades básicas são forma, volume (o espaço que ocupa) e massa (a quantidade de matéria). Outras propriedades observáveis são cor, comprimento, densidade, elasticidade, pressão e brilho.</span><br><br><b style=\"font-size:14px\">🧊 STATES OF MATTER</b><br>A SOLID is rigid, with a fixed shape and a fixed volume, because its particles are packed tightly and barely move. A LIQUID is not rigid and has no fixed shape but does have a fixed volume, because its particles slide past each other. A GAS is not rigid and has neither a fixed shape nor a fixed volume, because its particles are spread far apart and move a lot. Water shows all three states: ice, water and water vapor.<br><span style=\"display:inline-block;margin-top:6px;padding-left:10px;border-left:3px solid rgba(0,0,0,.15);color:#5a5a5a;font-style:italic\">🇧🇷 O SÓLIDO é rígido, com forma e volume fixos, porque suas partículas estão bem juntas e quase não se movem. O LÍQUIDO não é rígido e não tem forma fixa, mas tem volume fixo, porque suas partículas deslizam umas sobre as outras. O GÁS não é rígido e não tem nem forma nem volume fixos, porque suas partículas ficam bem distantes e se movem muito. A água mostra os três estados: gelo, água e vapor.</span><br><br><b style=\"font-size:14px\">♻️ PHYSICAL CHANGE</b><br>A physical change does not form a new substance — it may change the shape, the size or the state of matter, and it can often be undone. Examples: melting, freezing, boiling, tearing, cutting, bending, breaking and dissolving.<br><span style=\"display:inline-block;margin-top:6px;padding-left:10px;border-left:3px solid rgba(0,0,0,.15);color:#5a5a5a;font-style:italic\">🇧🇷 Uma mudança física NÃO forma substância nova — pode mudar a forma, o tamanho ou o estado da matéria, e geralmente pode ser desfeita. Exemplos: derreter, congelar, ferver, rasgar, cortar, dobrar, quebrar e dissolver.</span><br><br><b style=\"font-size:14px\">🔥 CHEMICAL CHANGE</b><br>A chemical change always forms a new substance with different properties, may absorb or release heat, and usually cannot be undone. Signs of a chemical change are a change in colour, odour, sound, temperature, the release of gas or light, and the formation of a precipitate. Examples: burning, rusting, frying an egg, souring milk, baking a cake, digesting food and photosynthesis.<br><span style=\"display:inline-block;margin-top:6px;padding-left:10px;border-left:3px solid rgba(0,0,0,.15);color:#5a5a5a;font-style:italic\">🇧🇷 Uma mudança química SEMPRE forma uma substância nova, com propriedades diferentes, pode absorver ou liberar calor e geralmente não pode ser desfeita. Sinais de mudança química: mudança de cor, de cheiro, de som, de temperatura, liberação de gás ou de luz, e formação de precipitado. Exemplos: queimar, enferrujar, fritar um ovo, azedar o leite, assar um bolo, digerir alimento e fotossíntese.</span><br><br><b style=\"font-size:14px\">🔄 REVERSIBLE & IRREVERSIBLE</b><br>Reversible changes can be undone, returning a substance to its original state. Irreversible changes are permanent and often create a new substance that cannot be retrieved. Careful: physical/chemical and reversible/irreversible are two different questions — cutting an apple is physical but irreversible.<br><span style=\"display:inline-block;margin-top:6px;padding-left:10px;border-left:3px solid rgba(0,0,0,.15);color:#5a5a5a;font-style:italic\">🇧🇷 Mudanças reversíveis podem ser desfeitas, devolvendo a substância ao estado original. Mudanças irreversíveis são permanentes e muitas vezes criam uma substância nova que não dá para recuperar. Atenção: físico/químico e reversível/irreversível são DUAS perguntas diferentes — cortar uma maçã é físico, mas irreversível.</span",
   tips:[
     "🔑 <b>New substance? → CHEMICAL. Same substance? → PHYSICAL.</b><br><span style='color:#666;font-style:italic'>🇧🇷 Substância nova? QUÍMICA. Mesma substância? FÍSICA. Comece sempre por aí</span>",
     "🧠 Signs of a chemical change = <b>C-O-S-G-L-T</b>: Colour, Odour, Sound, Gas, Light, Temperature<br><span style='color:#666;font-style:italic'>🇧🇷 Cor, odor, som, gás, luz e temperatura</span>",
     "⚠️ Heat does NOT mean chemical! <b>Melting chocolate is physical AND reversible</b><br><span style='color:#666;font-style:italic'>🇧🇷 Calor não significa química. Derreter chocolate é físico e reversível</span>",
     "⚠️ Two different questions: physical/chemical AND reversible/irreversible<br><span style='color:#666;font-style:italic'>🇧🇷 Cortar maçã é FÍSICO (mesma substância) mas IRREVERSÍVEL (não dá pra colar)</span>",
     "🥚 <b>Breaking</b> an egg = physical · <b>Frying</b> an egg = chemical<br><span style='color:#666;font-style:italic'>🇧🇷 Quebrar o ovo é físico. Fritar o ovo é químico</span>",
     "🧊 <b>SOLID</b> = fixed shape + fixed volume · <b>LIQUID</b> = fixed volume only · <b>GAS</b> = neither<br><span style='color:#666;font-style:italic'>🇧🇷 Sólido tem forma e volume · líquido só volume · gás nenhum dos dois</span>",
     "📏 <b>M</b>ass = <b>M</b>atter · <b>V</b>olume = space<br><span style='color:#666;font-style:italic'>🇧🇷 Massa = quantidade de matéria. Volume = espaço ocupado</span>",
     "🔁 Melting ⇄ Freezing and Evaporation ⇄ Condensation are the reversible pairs<br><span style='color:#666;font-style:italic'>🇧🇷 Derreter ⇄ congelar e evaporar ⇄ condensar são os pares reversíveis</span>",
     "🔥 The 6 exam favourites: melting ice, burning wood, rusting iron, dissolving sugar, breaking glass, cooking an egg<br><span style='color:#666;font-style:italic'>🇧🇷 Os 6 exemplos que mais aparecem: derreter gelo, queimar madeira, enferrujar ferro, dissolver açúcar, quebrar vidro, cozinhar ovo</span>"

 x1=\"196\" y1=\"182\" x2=\"288\" y2=\"200\" stroke=\"#E24B4A\" stroke-width=\"3\"/><line x1=\"396\" y1=\"182\" x2=\"488\" y2=\"200\" stroke=\"#E24B4A\" stroke-width=\"3\"/><text x=\"556\" y=\"196\" text-anchor=\"middle\" font-size=\"24\" fill=\"#E24B4A\">✗</text><text x=\"300\" y=\"242\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#8f2d4f\">Gêneros diferentes juntos → adjetivo no MASCULINO PLURAL: o menino e a menina curiosOS</text></svg>"},{t:"🔄 No plural, tudo muda junto", svg:"<svg viewBox=\"0 0 600 300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto\"><rect width=\"600\" height=\"300\" rx=\"14\" fill=\"#fdeef3\"/><text x=\"300\" y=\"32\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#8f2d4f\">NO PLURAL, TUDO MUDA JUNTO</text><defs><marker id=\"pm\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L0,7 L10,3.5 z\" fill=\"#8f2d4f\"/></marker></defs><text x=\"60\" y=\"86\" font-size=\"19\" font-weight=\"800\" fill=\"#555\">O</text><text x=\"100\" y=\"86\" font-size=\"19\" font-weight=\"800\" fill=\"#555\">pequeno</text><text x=\"216\" y=\"86\" font-size=\"19\" font-weight=\"800\" fill=\"#555\">príncipe</text><line x1=\"320\" y1=\"80\" x2=\"360\" y2=\"80\" stroke=\"#8f2d4f\" stroke-width=\"3\" marker-end=\"url(#pm)\"/><rect x=\"374\" y=\"64\" width=\"34\" height=\"26\" rx=\"5\" fill=\"#f8d3e0\"/><text x=\"391\" y=\"84\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#8f2d4f\">Os</text><rect x=\"412\" y=\"64\" width=\"92\" height=\"26\" rx=\"5\" fill=\"#f8d3e0\"/><text x=\"458\" y=\"84\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#8f2d4f\">pequenos</text><rect x=\"508\" y=\"64\" width=\"86\" height=\"26\" rx=\"5\" fill=\"#f8d3e0\"/><text x=\"551\" y=\"84\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#8f2d4f\">príncipes</text><text x=\"60\" y=\"108\" font-size=\"11\" fill=\"#888\">artigo</text><text x=\"100\" y=\"108\" font-size=\"11\" fill=\"#888\">adjetivo</text><text x=\"216\" y=\"108\" font-size=\"11\" fill=\"#888\">substantivo</text><text x=\"60\" y=\"152\" font-size=\"19\" font-weight=\"800\" fill=\"#555\">O rei leão</text><line x1=\"320\" y1=\"146\" x2=\"360\" y2=\"146\" stroke=\"#8f2d4f\" stroke-width=\"3\" marker-end=\"url(#pm)\"/><rect x=\"374\" y=\"130\" width=\"220\" height=\"26\" rx=\"5\" fill=\"#f8d3e0\"/><text x=\"484\" y=\"150\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#8f2d4f\">Os reis leões</text><text x=\"60\" y=\"196\" font-size=\"19\" font-weight=\"800\" fill=\"#555\">Uma fazenda maluca</text><line x1=\"320\" y1=\"190\" x2=\"360\" y2=\"190\" stroke=\"#8f2d4f\" stroke-width=\"3\" marker-end=\"url(#pm)\"/><rect x=\"374\" y=\"174\" width=\"220\" height=\"26\" rx=\"5\" fill=\"#f8d3e0\"/><text x=\"484\" y=\"194\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"800\" fill=\"#8f2d4f\">Umas fazendas malucas</text><rect x=\"30\" y=\"218\" width=\"540\" height=\"66\" rx=\"10\" fill=\"#fdeeea\" stroke=\"#E24B4A\" stroke-width=\"2.5\"/><text x=\"300\" y=\"242\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" fill=\"#a32d2d\">⚠️ ARMADILHA — não esqueça nenhuma palavra</text><text x=\"300\" y=\"264\" text-anchor=\"middle\" font-size=\"14\" fill=\"#a32d2d\">✗ Os pequeno príncipes · ✗ Os reis leão · ✗ Umas fazenda malucas</text><text x=\"300\" y=\"280\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#0d6b4e\">✓ Confira SEMPRE as três palavras</text></svg>"}],
   summary:"O texto de DIVULGAÇÃO CIENTÍFICA explica descobertas e conhecimentos da ciência para o público comum, que não é especialista. Usa linguagem clara, apoia-se em fatos e dados verificados, cita as fontes (\"segundo os pesquisadores\") e recorre a comparações com o cotidiano. Circula em revistas, sites, museus e documentários, e não tem personagens inventados nem enredo de ficção. Segundo a apostila, o cientista é o profissional que faz ciência, ou seja, que produz conhecimento científico. As palavras a, as, o, os, uma, umas, um e uns chamam-se ARTIGOS e se alteram para concordar com os substantivos. Os substantivos acompanhados por o, os, um e uns são do gênero masculino; os acompanhados por a, as, uma e umas são do gênero feminino. Os artigos DEFINIDOS (o, a, os, as) indicam um ser específico ou já mencionado; os INDEFINIDOS (um, uma, uns, umas) apresentam um ser pela primeira vez — por isso apresentamos com o indefinido e retomamos com o definido: \"Vi UMA estrela. A estrela era brilhante.\" Alguns substantivos são COMUNS DE DOIS GÊNEROS, como motorista e jovem: servem para o masculino e o feminino, e só o artigo mostra qual é (o motorista / a motorista). O ADJETIVO é o termo que qualifica o substantivo, indicando-lhe determinada característica. Na CONCORDÂNCIA NOMINAL, tanto o artigo quanto o adjetivo concordam com o gênero e o número do substantivo: \"as plantas nativas\", \"os conhecimentos científicos\". Quando o adjetivo se refere a dois substantivos de gêneros diferentes, vai para o masculino plural: \"o menino e a menina curiosos\". Ao passar uma expressão para o PLURAL ou para o FEMININO, todas as palavras mudam juntas: \"O pequeno príncipe\" vira \"Os pequenos príncipes\"; \"O rei leão\" vira \"Os reis leões\"; \"Uma fazenda maluca\" vira \"Umas fazendas malucas\"; e \"o cientista como o profissional\" vira \"a cientista como a profissional\".",
   tips:[
     "🔑 Primeira vez que aparece? <b>UM/UMA</b>. Já conhecido ou específico? <b>O/A</b>",
     "🧠 O adjetivo <b>COPIA</b> o substantivo: feminino plural pede adjetivo feminino plural",
     "⚠️ No plural, confira as <b>TRÊS</b> palavras: artigo + substantivo + adjetivo. Esquecer uma é o erro mais comum",
     "⚠️ O adjetivo <b>depois do verbo</b> também concorda: \"são inteligent<b>es</b>\", nunca \"são inteligente\"",
     "🚕 <b>Motorista</b> e <b>jovem</b> servem para os dois gêneros — quem decide é o artigo (o/a)",
     "👦👧 Gêneros diferentes juntos → adjetivo no <b>masculino plural</b>: o menino e a menina <b>curiosos</b>",
     "📖 O <b>adjetivo</b> qualifica o substantivo. O <b>artigo</b> apenas o acompanha",
     "📰 Divulgação científica = ciência + linguagem simples + <b>fonte citada</b>",
     "✍️ Truque da leitura em voz alta: se \"soar estranho\", quase sempre é erro de concordância"
   ]},

oke-width=\"8\"/><text x=\"452\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#7d4d0c\">6 cm</text><text x=\"452\" y=\"228\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#7d4d0c\">6 cm</text><text x=\"332\" y=\"147\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#7d4d0c\">4</text><text x=\"572\" y=\"147\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#7d4d0c\">4</text><text x=\"452\" y=\"256\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"800\" fill=\"#7d4d0c\">6+4+6+4 = 20 cm</text><text x=\"452\" y=\"284\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#7d4d0c\">unidade: cm (simples)</text></svg>"},{t:"🔢 As classes do número", svg:"<svg viewBox=\"0 0 600 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto\"><rect width=\"600\" height=\"220\" rx=\"14\" fill=\"#fdf6ea\"/><text x=\"300\" y=\"32\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#7d4d0c\">VALOR POSICIONAL — 5.236.941</text><rect x=\"30\" y=\"50\" width=\"176\" height=\"112\" rx=\"10\" fill=\"#f2c98a\" stroke=\"#7d4d0c\" stroke-width=\"2\"/><text x=\"118\" y=\"74\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#5c3a08\">CLASSE DOS MILHÕES</text><text x=\"118\" y=\"118\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"800\" fill=\"#5c3a08\">5</text><text x=\"118\" y=\"150\" text-anchor=\"middle\" font-size=\"13\" fill=\"#5c3a08\">C · D · U de milhão</text><rect x=\"212\" y=\"50\" width=\"176\" height=\"112\" rx=\"10\" fill=\"#f7dcb0\" stroke=\"#7d4d0c\" stroke-width=\"2\"/><text x=\"300\" y=\"74\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"#5c3a08\">CLASSE DOS MILHARES</text><text x=\"300\" y=\"118\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"800\" fill=\"#5c3a08\">236</text><text x=\"300\" y=\"150\" text-anchor=\"middle\" font-size=\"13\" fill=\"#5c3a08\">C · D · U de milhar</text>    summary:"MEDIDAS DE MASSA: a unidade padrão é o grama. A regra de ouro é o número 1.000 — 1 tonelada = 1.000 kg, 1 quilograma = 1.000 g e 1 grama = 1.000 mg. A tonelada serve para coisas gigantescas (caminhões, elefantes, aviões), o quilograma para pessoas e sacos de arroz, o grama para itens leves como uma maçã ou um pão, e o miligrama para quantidades minúsculas como remédios. Cada balança mede uma faixa: a de precisão mede mg e g (laboratórios e joias), a de cozinha ou comercial mede g e kg (padarias e açougues), a pediátrica mede kg (bebês e pessoas) e a rodoviária mede toneladas (caminhões). MEDIDAS DE COMPRIMENTO: a unidade padrão é o metro, e aqui a regra NÃO é sempre 1.000. Um quilômetro tem 1.000 metros, mas um metro tem 100 centímetros e um centímetro tem 10 milímetros (por isso 1 m = 1.000 mm). Usa-se km para distâncias entre cidades, m para a altura de uma pessoa ou de um prédio, cm para objetos pequenos e mm para coisas minúsculas, como uma formiga de 5 mm. PERÍMETRO é a medida do contorno de uma figura plana, calculada somando as medidas de todos os lados do polígono: um campo de 34 m por 20 m tem perímetro 34 + 34 + 20 + 20 = 108 m. Mede-se em unidades simples (cm, m, km). ÁREA é a medida do espaço interno de uma figura bidimensional, calculada multiplicando o comprimento pela largura: uma sala de 12 m por 9 m tem área 12 × 9 = 108 m². Mede-se em unidades ao quadrado (cm², m²), porque a área representa quantos quadrados de 1 m por 1 m cabem no espaço. Numa malha quadriculada, conta-se os lados da borda para achar o perímetro e os quadradinhos internos para achar a área. Dois retângulos podem ter a mesma área e perímetros diferentes: 4 × 5 e 2 × 10 têm ambos 20 m² de área, mas perímetros de 18 m e 24 m. VALOR POSICIONAL: os números se organizam em classes de três ordens — unidades simples, milhares e milhões. Para ler, separe de três em três da direita para a esquerda. GRÁFICOS DE BARRAS: leia sempre o título e a escala antes de responder; a barra mais comprida ou mais alta representa o maior valor.",
   tips:[
     "🔑 <b>PERÍMETRO</b> = a cerca em volta (m) · <b>ÁREA</b> = o piso lá dentro (m²)",
     "⚠️ A área <b>SEMPRE</b> leva o ² na unidade. Escrever \"20 cm\" em vez de \"20 cm²\" conta como erro",
     "🎯 Perímetro 108 <b>m</b> e área 108 <b>m²</b> — a apostila usou o mesmo número de propósito. Só a unidade diferencia",
     "⚖️ <b>MASSA</b> é tudo de 1.000 em 1.000: t → kg → g → mg",
     "📏 <b>COMPRIMENTO</b> é diferente: km→m é 1.000, m→cm é <b>100</b>, cm→mm é <b>10</b>",
     "✍️ <b>Confira o que você copiou.</b> Terminou a conta armada? Veja se o número que foi para a resposta é o mesmo",
     "🔄 \"Duas voltas de arame\" = perímetro <b>× 2</b>. Não pare na primeira volta",
     "🧩 Mesma área não significa mesmo perímetro: 4×5 e 2×10 dão 20 m², mas 18 m e 24 m de contorno",
     "📊 Gráfico: leia o <b>título</b> e a <b>escala</b> antes de qualquer conta",
     "✅ Toda divisão se confere: <b>quociente × divisor + resto = número original</b>"
   ]},

ll=\"#777\">chega ao Caribe</text><circle cx=\"540\" cy=\"120\" r=\"11\" fill=\"#5F5E5A\"/><text x=\"540\" y=\"100\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"800\" fill=\"#2f2f2c\">1500</text><text x=\"540\" y=\"150\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#444\">Cabral chega</text><text x=\"540\" y=\"166\" text-anchor=\"middle\" font-size=\"12\" fill=\"#555\">ao Brasil</text><text x=\"540\" y=\"182\" text-anchor=\"middle\" font-size=\"11\" fill=\"#777\">indo para a Índia</text><rect x=\"40\" y=\"212\" width=\"540\" height=\"28\" rx=\"8\" fill=\"#fff\" stroke=\"#5F5E5A\" stroke-width=\"2\"/><text x=\"310\" y=\"231\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#2f2f2c\">1453 é a data-chave: fechar as rotas por terra fez nascer a Age of Exploration</text></svg>"},{t:"🧭 Compass rose — directions", svg:"<svg viewBox=\"0 0 600 300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto\"><rect width=\"600\" height=\"300\" rx=\"14\" fill=\"#f4f3ee\"/><text x=\"300\" y=\"30\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#2f2f2c\">COMPASS ROSE</text><circle cx=\"300\" cy=\"160\" r=\"106\" fill=\"#fff\" stroke=\"#5F5E5A\" stroke-width=\"2\"/><circle cx=\"300\" cy=\"160\" r=\"66\" fill=\"none\" stroke=\"#d8d6cd\" stroke-width=\"1.5\"/><path d=\"M300 62 L316 152 L300 142 L284 152 z\" fill=\"#E24B4A\"/><path d=\"M300 258 L284 168 L300 178 L316 168 z\" fill=\"#5F5E5A\"/><path d=\"M398 160 L308 176 L318 160 L308 144 z\" fill=\"#5F5E5A\"/><path d=\"M202 160 L292 144 L282 160 L292 176 z\" fill=\"#5F5E5A\"/><line x1=\"230\" y1=\"90\" x2=\"370\" y2=\"230\" stroke=\"#b9b7ad\" stroke-width=\"2\"/><line x1=\"370\" y1=\"90\" x2=\"230\" y2=\"230\" stroke=\"#b9b7ad\" stroke-width=\"2\"/><text x=\"300\" y=\"52\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#E24B4A\">N</text><text x=\"300\" y=\"286\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#2f2f2c\">S</text><text x=\"422\" y=\"168\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#2f2f2c\">E</text><text x=\"180\" y=\"168\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#2f2f2c\">W</text><text x=\"378\" y=\"94\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#6b6a63\">NE</text><text x=\"222\" y=\"94\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#6b6a63\">NW</text><text x=\"378\" y=\"238\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#6b6a63\">SE</text><text x=\"222\" y=\"238\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#6b6a63\">SW</text><text x=\"42\" y=\"86\" font-size=\"15\" font-weight=\"800\" fill=\"#2f2f2c\">CARDINAL</text><text x=\"42\" y=\"108\" font-size=\"14\" fill=\"#444\">N · S · E · W</text><text x=\"42\" y=\"140\" font-size=\"15\" font-weight=\"800\" fill=\"#2f2f2c\">INTERMEDIATE</text><text x=\"42\" y=\"162\" font-size=\"14\" fill=\"#444\">NE · NW · SE · SW</text><text x=\"42\" y=\"200\" font-size=\"14\" font-weight=\"700\" fill=\"#a32d2d\">☀️ Sun RISES in the East</text><text x=\"42\" y=\"222\" font-size=\"14\" font-weight=\"700\" fill=\"#2f2f2c\">🌙 and SETS in the West</text><text x=\"42\" y=\"252\" font-size=\"13\" fill=\"#666\">Never Eat Soggy Waffles</text><text x=\"42\" y=\"270\" font-size=\"13\" fill=\"#666\">= N, E, S, W (clockwise)</text></svg>"}],
   summary:"<b style=\"font-size:14px\">🛤️ THE SILK ROAD</b><br>The Silk Road was not one single road: it was a giant web of land and sea trade routes that connected Asia, the Middle East and Europe, going from China to Eastern Europe near today's Turkey and the Mediterranean Sea. Merchants travelled together in long groups called CARAVANS, using camels and horses and taking many guards to defend them from bandits; camels were popular because much of the road went through dry, harsh land. They traded silk cloth, spices, tea, gold, porcelain, salt and sugar — mostly expensive luxury goods, because the trip was long and there was little room. It was called the Silk Road because one of the major products traded was silk cloth from China, prized for its softness and luxury; the Romans even called China the \"land of silk\". People shared more than items: ideas, news and inventions travelled too, such as how to make paper and gunpowder. The Han Dynasty (206 BC to 220 AD) significantly expanded the silk trade, and later, under the Yuan Dynasty set up by Kublai Khan of the Mongols, trade reached its peak. In 1453 a powerful empire closed the land routes, making it very hard and expensive for Europeans to get goods from Asia.<br><span style=\"display:inline-block;margin-top:6px;padding-left:10px;border-left:3px solid rgba(0,0,0,.15);color:#5a5a5a;font-style:italic\">🇧🇷 A Rota da Seda não era uma estrada só: era uma grande teia de rotas de comércio por terra e por mar que ligava a Ásia, o Oriente Médio e a Europa, indo da China até o leste europeu, perto da Turquia de hoje e do mar Mediterrâneo. Os mercadores viajavam em grupos chamados CARAVANAS, com camelos e cavalos e muitos guardas para defendê-los de bandidos; o camelo era usado porque grande parte do caminho passava por terras secas e duras. Negociavam seda, especiarias, chá, ouro, porcelana, sal e açúcar — quase tudo artigo de luxo caro, porque a viagem era longa e cabia pouca coisa. Chama-se Rota da Seda porque um dos principais produtos era o tecido de seda da China, valorizado pela maciez e pelo luxo; os romanos chamavam a China de \"terra da seda\". Além de mercadorias, circulavam ideias, notícias e invenções, como fabricar papel e pólvora. A dinastia Han (206 a.C. a 220 d.C.) expandiu bastante esse comércio e, depois, sob a dinastia Yuan criada por Kublai Khan, o comércio atingiu seu auge. Em 1453 um império poderoso fechou as rotas terrestres, tornando muito difícil e caro para os europeus conseguir produtos da Ásia.</span><br><br><b style=\"font-size:14px\">🧭 THE AGE OF EXPLORATION</b><br>The Age of Exploration began because those land routes were closed and European countries — especially Spain and Portugal — decided to look for a sea route to Asia. Explorers set sail for three main reasons, the 3 Gs: GOLD, to get rich by trading spices and finding gold; GOD, to spread Christianity to new places; and GLORY, to become famous and claim new land for their king or queen. Spices such as pepper and cinnamon mattered because there were no refrigerators, so people dried meat, used salt and used spices to make food taste better. New inventions helped sailors navigate: the magnetic COMPASS showed which way was North, the ASTROLABE measured the position of the sun and the stars to tell how far north or south the ship was, the QUADRANT measured the height of Polaris the Pole star, and the CARAVEL was a new, faster ship whose triangular sails let it sail even against the wind.<br><span style=\"display:inline-block;margin-top:6px;padding-left:10px;border-left:3px solid rgba(0,0,0,.15);color:#5a5a5a;font-style:italic\">🇧🇷 A Era das Grandes Navegações começou porque as rotas por terra foram fechadas e países europeus — sobretudo Espanha e Portugal — decidiram procurar um caminho marítimo até a Ásia. Os exploradores partiram por três motivos, os 3 Gs: GOLD (ouro), para enriquecer com especiarias e ouro; GOD (Deus), para levar o cristianismo a novos lugares; e GLORY (glória), para ficarem famosos e reivindicar terras para seu rei ou rainha. As especiarias, como pimenta e canela, eram importantes porque não existia geladeira: secava-se a carne, usava-se sal e temperos para o alimento durar e ficar mais saboroso. Invenções ajudaram na navegação: a BÚSSOLA magnética mostrava onde era o Norte, o ASTROLÁBIO media a posição do sol e das estrelas para saber quão ao norte ou ao sul o navio estava, o QUADRANTE media a altura de Polaris, a Estrela Polar, e a CARAVELA era um navio novo e mais rápido, com velas triangulares que permitiam navegar até contra o vento.</span><br><br><b style=\"font-size:14px\">🌎 THE EXPLORERS</b><br>Marco Polo left Venice, Italy, with his father and uncle, travelled overland along the Silk Road on a journey of 24 years, stayed 17 years in China working for the ruler Kublai Khan, and wrote a book describing paper money, porcelain, a printing press, gunpowder, coal and even pasta. Christopher Columbus sailed west across the Atlantic in 1492 looking for Asia and landed in the Caribbean islands. Vasco da Gama was the first to sail directly from Europe to India by going around the bottom of Africa, which made trading for spices and silks much faster. Pedro Álvares Cabral, trying to follow that route, sailed far west and reached South America, claiming for Portugal the land that is now Brazil. Ferdinand Magellan led the first mission to sail all the way around the world, and his crew proved the Earth is round and that all the oceans are connected. Amerigo Vespucci realised the land across the Atlantic was a New World, and the continents of North and South America were named after him. Their journeys helped people create better maps, learn about different cultures and share foods such as potatoes, tomatoes, corn and chocolate.<br><span style=\"display:inline-block;margin-top:6px;padding-left:10px;border-left:3px solid rgba(0,0,0,.15);color:#5a5a5a;font-style:italic\">🇧🇷 Marco Polo saiu de Veneza, na Itália, com o pai e o tio, viajou por terra pela Rota da Seda numa jornada de 24 anos, ficou 17 anos na China trabalhando para o governante Kublai Khan e escreveu um livro descrevendo papel-moeda, porcelana, prensa de impressão, pólvora, carvão e até macarrão. Cristóvão Colombo cruzou o Atlântico para o oeste em 1492 procurando a Ásia e chegou às ilhas do Caribe. Vasco da Gama foi o primeiro a navegar direto da Europa até a Índia contornando o sul da África, o que tornou o comércio de especiarias e sedas muito mais rápido. Pedro Álvares Cabral, tentando seguir essa rota, foi longe demais para oeste e chegou à América do Sul, reivindicando para Portugal a terra que hoje é o Brasil. Fernão de Magalhães liderou a primeira expedição a dar a volta ao mundo, e sua tripulação provou que a Terra é redonda e que todos os oceanos são ligados. Américo Vespúcio percebeu que a terra do outro lado do Atlântico era um Novo Mundo, e os continentes da América do Norte e do Sul receberam seu nome. Essas viagens ajudaram a fazer mapas melhores, a conhecer outras culturas e a compartilhar alimentos como batata, tomate, milho e chocolate.</span><br><br><b style=\"font-size:14px\">🗺️ MAPS & COMPASS ROSE</b><br>A compass rose is a figure on a map, chart or compass that displays the cardinal directions — North, East, South and West — and the intermediate points — Northeast, Northwest, Southeast and Southwest — to show orientation. Every map also has a key explaining what each symbol means.<br><span style=\"display:inline-block;margin-top:6px;padding-left:10px;border-left:3px solid rgba(0,0,0,.15);color:#5a5a5a;font-style:italic\">🇧🇷 A rosa dos ventos é uma figura no mapa, carta ou bússola que mostra os pontos cardeais — Norte, Leste, Sul e Oeste — e os pontos colaterais — Nordeste, Noroeste, Sudeste e Sudoeste — para indicar a orientação. Todo mapa também tem uma legenda explicando o que cada símbolo significa.</span",
   tips:[
     "🔑 The three reasons for exploring: <b>Gold, God and Glory</b><br><span style='color:#666;font-style:italic'>🇧🇷 Os três motivos: ouro, Deus (religião) e glória (fama e terras)</span>",
     "🧠 Compass clockwise: <b>N</b>ever <b>E</b>at <b>S</b>oggy <b>W</b>affles → North, East, South, West<br><span style='color:#666;font-style:italic'>🇧🇷 Sentido horário: Norte, Leste, Sul, Oeste</span>",
     "⚠️ <b>Marco Polo</b> travelled the Silk Road · <b>Kublai Khan</b> was the ruler he met in China<br><span style='color:#666;font-style:italic'>🇧🇷 Marco Polo é o VIAJANTE. Kublai Khan é o GOVERNANTE que ele conheceu</span>",
     "🐫 <b>CARAVAN</b> = group of merchants with camels · <b>CARAVEL</b> = the fast ship<br><span style='color:#666;font-style:italic'>🇧🇷 CARAVANA é o grupo de mercadores. CARAVELA é o navio. Palavras parecidas, coisas diferentes</span>",
     "📅 <b>1274</b> Polos leave · <b>1453</b> routes closed · <b>1492</b> Columbus · <b>1500</b> Cabral<br><span style='color:#666;font-style:italic'>🇧🇷 1453 é a data-chave: fechar as rotas por terra fez começar as navegações</span>",
     "🏛️ <b>HAN</b> Dynasty expanded the silk trade · <b>YUAN</b> Dynasty (Kublai Khan) was its <b>peak</b><br><span style='color:#666;font-style:italic'>🇧🇷 Han EXPANDIU · Yuan foi o AUGE. Cuidado para não trocar</span>",
     "⛵ Cabral was sailing to <b>India</b> — Brazil was reached on the way<br><span style='color:#666;font-style:italic'>🇧🇷 Cabral ia para a Índia. Chegou ao Brasil no caminho</span>",
     "🥔 Foods shared after the voyages: <b>potatoes, tomatoes, corn and chocolate</b><br><span style='color:#666;font-style:italic'>🇧🇷 Batata, tomate, milho e chocolate</span>",
     "🧭 <b>Compass</b> = North · <b>Astrolabe</b> = sun and stars · <b>Quadrant</b> = Polaris<br><span style='color:#666;font-style:italic'>🇧🇷 Bússola = Norte · Astrolábio = sol e estrelas · Quadrante = Estrela Polar</span>"
   ]},

><circle cx=\"300\" cy=\"150\" r=\"9\" fill=\"#413a95\"/><text x=\"300\" y=\"176\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#413a95\">1695</text><text x=\"300\" y=\"192\" text-anchor=\"middle\" font-size=\"10\" fill=\"#555\">Zumbi morto</text><circle cx=\"400\" cy=\"150\" r=\"9\" fill=\"#E24B4A\"/><text x=\"400\" y=\"176\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#a32d2d\">1757</text><text x=\"400\" y=\"192\" text-anchor=\"middle\" font-size=\"10\" fill=\"#a32d2d\">fim escravidão</text><text x=\"400\" y=\"205\" text-anchor=\"middle\" font-size=\"10\" fill=\"#a32d2d\">indígena</text><circle cx=\"490\" cy=\"150\" r=\"9\" fill=\"#413a95\"/><text x=\"490\" y=\"176\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#413a95\">1822</text><text x=\"490\" y=\"192\" text-anchor=\"middle\" font-size=\"10\" fill=\"#555\">Independência</text><text x=\"490\" y=\"205\" text-anchor=\"middle\" font-size=\"10\" fill=\"#555\">Dom Pedro I</text><circle cx=\"565\" cy=\"150\" r=\"9\" fill=\"#E24B4A\"/><text x=\"565\" y=\"176\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#a32d2d\">1888</text><text x=\"565\" y=\"192\" text-anchor=\"middle\" font-size=\"10\" fill=\"#a32d2d\">Lei Áurea</text><text x=\"565\" y=\"205\" text-anchor=\"middle\" font-size=\"10\" fill=\"#a32d2d\">Princesa Isabel</text><rect x=\"40\" y=\"232\" width=\"540\" height=\"52\" rx=\"10\" fill=\"#fff\" stroke=\"#7F77DD\" stroke-width=\"2\"/><text x=\"310\" y=\"252\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"#413a95\">MÃO DE OBRA DE CADA CICLO</text><text x=\"310\" y=\"272\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#444\">Pau-brasil: indígenas (escambo) · Açúcar: africanos e indígenas escravizados · Ouro: africanos escravizados</text></svg>"},{t:"🌍 Equador, Greenwich e os hemisférios", svg:"<svg viewBox=\"0 0 600 300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto\"><rect width=\"600\" height=\"300\" rx=\"14\" fill=\"#f0effe\"/><text x=\"300\" y=\"30\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"800\" fill=\"#413a95\">LINHAS IMAGINÁRIAS</text><circle cx=\"230\" cy=\"166\" r=\"112\" fill=\"#dcefff\" stroke=\"#413a95\" stroke-width=\"2.5\"/><ellipse cx=\"230\" cy=\"112\" rx=\"98\" ry=\"10\" fill=\"none\" stroke=\"#9d97e8\" stroke-width=\"1.5\"/><ellipse cx=\"230\" cy=\"220\" rx=\"98\" ry=\"10\" fill=\"none\" stroke=\"#9d97e8\" stroke-width=\"1.5\"/><line x1=\"118\" y1=\"166\" x2=\"342\" y2=\"166\" stroke=\"#E24B4A\" stroke-width=\"4\"/><text x=\"352\" y=\"163\" font-size=\"14\" font-weight=\"800\" fill=\"#E24B4A\">EQUADOR 0°</text><text x=\"352\" y=\"180\" font-size=\"12\" fill=\"#a32d2d\">divide N / S</text><line x1=\"230\" y1=\"54\" x2=\"230\" y2=\"278\" stroke=\"#1D9E75\" stroke-width=\"4\"/><text x=\"150\" y=\"48\" font-size=\"14\" font-weight=\"800\" fill=\"#0d6b4e\">GREENWICH 0°</text><text x=\"164\" y=\"292\" font-size=\"12\" fill=\"#0d6b4e\">divide L / O</text><text x=\"176\" y=\"106\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#413a95\">N + O</text><text x=\"286\" y=\"106\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#413a95\">N + L</text><text x=\"286\" y=\"238\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#413a95\">S + L</text><circle cx=\"182\" cy=\"212\" r=\"13\" fill=\"#FFCF3F\" stroke=\"#7d6200\" stroke-width=\"2\"/><text x=\"182\" y=\"217\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"800\" fill=\"#5c4700\">BR</text><rect x=\"386\" y=\"196\" width=\"196\" height=\"90\" rx=\"10\" fill=\"#fff\" stroke=\"#7F77DD\" stroke-width=\"2\"/><text x=\"484\" y=\"220\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" fill=\"#413a95\">🇧🇷 BRASIL</text><text x=\"484\" y=\"243\" text-anchor=\"middle\" font-size=\"13\" fill=\"#333\">hemisfério SUL</text><text x=\"484\" y=\"262\" text-anchor=\"middle\" font-size=\"13\" fill=\"#333\">hemisfério OCIDENTAL</text><text x=\"484\" y=\"280\" text-anchor=\"middle\" font-size=\"12\" fill=\"#666\">(abaixo e à esquerda)</text><text x=\"484\" y=\"92\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#413a95\">PARAlelos = PARAdos</text><text x=\"484\" y=\"110\" text-anchor=\"middle\" font-size=\"12\" fill=\"#555\">deitados → LAtitude</text><text x=\"484\" y=\"136\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#413a95\">MERIDIANOS = em pé</text><text x=\"484\" y=\"154\" text-anchor=\"middle\" font-size=\"12\" fill=\"#555\">de polo a polo → longitude</text></svg>"}],
   summary:"A CHEGADA DOS PORTUGUESES: nos séculos XV e XVI os portugueses se tornaram grandes navegadores, nas viagens conhecidas como Grandes Navegações. Navegar era difícil e arriscado — ventos ruins, mapas com erros, fome, sede, doenças e o medo do desconhecido, pois muitos acreditavam que a Terra era achatada e que o barco cairia num abismo. Arriscavam-se por dois motivos: o econômico, em busca de especiarias e artigos de luxo, e o religioso, para levar a religião cristã a outros povos. As especiarias eram temperos das Índias — pimenta, cravo, canela e gengibre — essenciais porque não existia geladeira, ajudando a conservar os alimentos e a dar sabor, além de servirem para remédios e perfumes. Em 22 de abril de 1500 a expedição de Pedro Álvares Cabral chegou ao território brasileiro; ele permaneceu até 2 de maio, quando seguiu para as Índias. OS CICLOS ECONÔMICOS: no Período Pré-Colonial (1500–1535) o Brasil não era prioridade para Portugal, e explorou-se o pau-brasil, árvore nativa que fornecia um corante valioso, com os indígenas como principal mão de obra por meio do escambo, trocando objetos como machados por madeira. Em 1534 o rei Dom João III criou as capitanias hereditárias, dividindo o território em 15 partes entregues a capitães-donatários, responsáveis por desenvolver e defender suas terras, especialmente contra estrangeiros como os franceses. O ciclo do açúcar (1535–1700) concentrou-se na capitania de Pernambuco, com mão de obra de escravizados africanos e indígenas. O ciclo do ouro (1695–1800) começou quando grandes depósitos foram encontrados em Minas Gerais, transformando a região no centro econômico do Brasil; os portugueses cobravam impostos sobre a extração. A ESCRAVIDÃO: quando as pessoas migram por não terem escolha, a migração é considerada forçada. Foi o caso dos povos africanos trazidos entre os séculos XVI e XIX. Mais de 4 milhões de africanos foram capturados, principalmente em Angola, Congo e Moçambique, e transportados em navios negreiros, com porões sem ventilação, sem higiene e com alimentação escassa. A maior parte era de origem banto, povos da África Central que compartilhavam a mesma língua. Bahia, Pernambuco, Maranhão, Minas Gerais, São Paulo e Rio de Janeiro recebiam a maior quantidade, por serem os lugares mais desenvolvidos economicamente. A escravidão indígena foi proibida em 1757. Em 1845 os ingleses criaram uma lei que proibia a circulação de navios negreiros, pois a Inglaterra queria ampliar seu mercado consumidor e entendia que a escravidão prejudicava seus ganhos. Em 1888 foi assinada a Lei Áurea pela Princesa Isabel — o Brasil foi o último país da América a abolir a escravidão. A independência havia sido proclamada antes, em 7 de setembro de 1822, sob a liderança de Dom Pedro I. A INFLUÊNCIA AFRICANA: ao longo de mais de 350 anos, os conhecimentos dos povos africanos foram incorporados à cultura brasileira, e a miscigenação entre africanos, indígenas e europeus é a base da formação populacional do Brasil. Na música e na dança vieram o batuque, o coco, a dança de roda do Nordeste, o samba (que surgiu no começo do século XX a partir das rodas de dança dos escravizados) e o maracatu, fundado em Pernambuco. Os instrumentos incluem berimbau, atabaque, tambor, agogô, cuíca e afoxé. A capoeira, hoje um dos maiores símbolos da cultura brasileira, nasceu na escravidão como forma de luta e resistência, permitindo defesa contra os capitães do mato. Nas religiões estão o candomblé, que cultua os orixás, divindades que representam a força da natureza, a umbanda, baseada no candomblé, no catolicismo e no espiritismo, e o catimbó. Iemanjá é a orixá que representa o mar, festejada em 2 de fevereiro em Salvador. Na alimentação entraram inhame, pimenta, gengibre, açafrão e azeite de dendê, base de pratos como acarajé, vatapá e caruru. No idioma ficaram palavras como cafuné, dengo, moleque, quitanda, caçula, fubá e camundongo. A lei 10.639 instituiu o 20 de novembro como Dia da Consciência Negra, data em que Zumbi dos Palmares foi morto, em 1695; ele foi o último líder do Quilombo dos Palmares, em Alagoas, que chegou a ter 20 mil pessoas. GEOGRAFIA: o planisfério representa o planeta em forma de mapa planificado e o globo terrestre o representa em forma esférica, sendo a representação que mais se aproxima da forma real. Cerca de 70% da superfície é coberta por água, com 5 oceanos — Pacífico, Atlântico, Índico, Glacial Ártico e Glacial Antártico — e 97% da água é salgada, apenas 3% doce. A América pode ser dividida em América do Norte, Central e do Sul, mas é um único continente. Na Antártida não há divisão de países nem habitantes fixos, apenas bases de pesquisa, e a mineração é proibida. As LINHAS IMAGINÁRIAS recebem esse nome porque não estão traçadas na superfície da Terra: a Linha do Equador divide o planeta em Hemisfério Norte e Sul, e o Meridiano de Greenwich, escolhido em convenção no final do século XIX por Londres ser o grande centro econômico da época, divide em Hemisfério Ocidental e Oriental. Os paralelos são linhas na mesma direção da Linha do Equador — Círculo Polar Ártico, Trópico de Câncer, Trópico de Capricórnio e Círculo Polar Antártico — e os meridianos são linhas na mesma direção de Greenwich. Os pontos cardeais são Norte (setentrional ou boreal), Sul (meridional ou austral), Leste (East, onde o Sol nasce) e Oeste (West); os colaterais são Nordeste, Sudeste, Sudoeste e Noroeste. A rosa dos ventos representa graficamente esses pontos e, depois do ano 1.300, foi incorporada aos mapas e à bússola. O Brasil está em sua maior parte no hemisfério Sul e na porção Ocidental, é banhado pelo Atlântico e só não faz fronteira com Equador e Chile na América do Sul. A divisão regional foi elaborada pelo IBGE em cinco regiões, e o país tem 26 estados e o Distrito Federal, totalizando 27 unidades federativas; São Paulo fica no Sudeste, tem 645 municípios e é o estado mais populoso.",
