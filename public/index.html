   summary:"Microorganisms (microbes) are tiny living things that you can only see with a microscope. They live everywhere: in the air, water, soil and even inside your body. Most are helpful, and a few are harmful pathogens (germs). There are four groups. BACTERIA are single-celled (rods, spirals or spheres); they make yogurt and cheese, help digestion and break down dead plants, but some cause tetanus, typhoid fever or pneumonia. Antibiotics fight them. VIRUSES are much smaller than bacteria and have no cells: like tiny hijackers, they must enter a living host cell to make copies. They cause the flu, the common cold and measles. Antibiotics do NOT work on viruses; vaccines train the immune system to build antibodies. FUNGI (mushrooms, mold and yeast) have no chlorophyll, so they decompose matter or live as parasites; they reproduce with spores and cannot move. Yeast makes bread rise, penicillin comes from a fungus, and fungi recycle dead things into the soil. PROTOZOA are single-celled organisms that live mostly in water, move with flagella, cilia or pseudopodia and eat bacteria. Some are parasites that cause malaria or giardiasis. An infectious disease is caused by a pathogen (virus, bacteria, parasite or fungus) and spreads through the air, touch, food and water or insect bites. Washing hands with soap and water is the best everyday defense.",
   blocks:[{"t": "✍️ Words you must know how to SPELL", "html": "<p style=\"margin:0 0 6px;font-size:13px\">Unscramble and fill-in questions need the right spelling:</p><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E1F5EE;color:#085041;font-weight:700;font-size:13px\">microbes</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E1F5EE;color:#085041;font-weight:700;font-size:13px\">bacteria</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E1F5EE;color:#085041;font-weight:700;font-size:13px\">virus</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E1F5EE;color:#085041;font-weight:700;font-size:13px\">fungi</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E1F5EE;color:#085041;font-weight:700;font-size:13px\">protozoa</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E1F5EE;color:#085041;font-weight:700;font-size:13px\">pathogen</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E1F5EE;color:#085041;font-weight:700;font-size:13px\">infectious</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E1F5EE;color:#085041;font-weight:700;font-size:13px\">antibiotics</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E1F5EE;color:#085041;font-weight:700;font-size:13px\">vaccine</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E1F5EE;color:#085041;font-weight:700;font-size:13px\">antibodies</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E1F5EE;color:#085041;font-weight:700;font-size:13px\">decomposers</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E1F5EE;color:#085041;font-weight:700;font-size:13px\">flagella</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E1F5EE;color:#085041;font-weight:700;font-size:13px\">chlorophyll</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E1F5EE;color:#085041;font-weight:700;font-size:13px\">spores</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E1F5EE;color:#085041;font-weight:700;font-size:13px\">microscope</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E1F5EE;color:#085041;font-weight:700;font-size:13px\">parasite</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E1F5EE;color:#085041;font-weight:700;font-size:13px\">yeast</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E1F5EE;color:#085041;font-weight:700;font-size:13px\">mold</span>"}, {"t": "⚠️ True or False traps", "html": "<div style=\"margin:6px 0;line-height:1.4\">Most bacteria are dangerous and always make us sick. <b style=\"color:#A32D2D\">FALSE</b><br><span style=\"opacity:.85\">→ Most bacteria are harmless or helpful. Only pathogens make us sick.</span></div><div style=\"margin:6px 0;line-height:1.4\">There are no bacteria in our food. <b style=\"color:#A32D2D\">FALSE</b><br><span style=\"opacity:.85\">→ Yogurt, cheese, pickles and soy sauce are made with bacteria.</span></div><div style=\"margin:6px 0;line-height:1.4\">Fungi get food by decomposing matter or as parasites. <b style=\"color:#0F6E56\">TRUE</b><br><span style=\"opacity:.85\">→ They have no chlorophyll, so they cannot make their own food.</span></div><div style=\"margin:6px 0;line-height:1.4\">Viruses are large particles. <b style=\"color:#A32D2D\">FALSE</b><br><span style=\"opacity:.85\">→ Viruses are much smaller than bacteria.</span></div><div style=\"margin:6px 0;line-height:1.4\">Protozoa belong to the kingdom Protista. <b style=\"color:#0F6E56\">TRUE</b><br><span style=\"opacity:.85\">→ They are protists: single-celled with a more complex cell.</span></div><div style=\"margin:6px 0;line-height:1.4\">An infectious disease is caused only by bacteria. <b style=\"color:#A32D2D\">FALSE</b><br><span style=\"opacity:.85\">→ Viruses, bacteria, parasites and fungi can all cause it.</span></div><div style=\"margin:6px 0;line-height:1.4\">Antibiotics work against viruses. <b style=\"color:#A32D2D\">FALSE</b><br><span style=\"opacity:.85\">→ Antibiotics are for bacteria. For viruses: vaccines and the immune system.</span></div>"}, {"t": "📝 Model answers (explain with BECAUSE)", "html": "<div style=\"margin:8px 0;line-height:1.45\"><b>Why is soap and water often better than hand sanitizer?</b><br>Soap and water wash away most pathogens, <b>because</b> sanitizer also clears out helpful bacteria and gives pathogens a better chance. The good bacteria quickly come back.</div><div style=\"margin:8px 0;line-height:1.45\"><b>How do fungi get their food, and how is it different from plants?</b><br>Fungi get food by decomposing matter or eating off a host as parasites. Plants make their own food, <b>because</b> they have chlorophyll. Fungi do not have it.</div><div style=\"margin:8px 0;line-height:1.45\"><b>What is the difference between a helpful microbe and a pathogen?</b><br>A helpful microbe helps us or nature (digesting food, making yogurt, decomposing dead plants). A pathogen is a germ that makes us sick, <b>because</b> it invades the body.</div><div style=\"margin:8px 0;line-height:1.45\"><b>How do viruses reproduce and take over a host?</b><br>A virus enters a living cell and injects its genetic material. <b>Then</b> it uses the cell to make more viruses, like a tiny hijacker.</div>"}],
   tips:[
     "🔑 <b>B·V·F·P</b> = the 4 groups: <b>B</b>acteria · <b>V</b>irus · <b>F</b>ungi · <b>P</b>rotozoa",
     "🧬 <b>Virus = hijacker.</b> It needs a living HOST cell to make copies. Alone on a table it does nothing",
     "💊 <b>ANTIbiotics</b> fight bacteria. For viruses use <b>VACCINES</b> (they train your immune system to make antibodies)",
     "🍞 <b>Yeast</b> eats sugar and makes CO₂ bubbles, so the dough rises. Yeast is a fungus!",
     "🍄 Fungi have <b>no chlorophyll</b>, so they cannot make their own food like plants do",
     "🧼 <b>Soap + water</b> beats sanitizer: sanitizer also clears the helpful bacteria",
     "🧪 <b>Pathogen = germ.</b> Most microbes are helpful, only a few make us sick",
     "💧 <b>Protozoa = water</b>: most live in ponds, lakes and oceans, and they eat bacteria"
   ]},
  {key:'social3', tri:3, label:'🌎 Social Studies', color:'#5F5E5A', light:'#F1EFE8', dark:'#2C2C2A', lang:'en', priority:true,
   summary:"A community is a place where people live, and geographers group communities into three types. URBAN areas are big, busy cities with tall buildings and a very high population density. SUBURBAN areas are just outside a big city: quieter, with houses and yards, and many adults commute (travel from home to work and back). RURAL areas are far from cities, with farms, ranches, forests and open fields, and very few people. People move for push factors (negative things that push them away, like no jobs, famine or natural disasters) or pull factors (positive things that attract them, like better schools, safer neighborhoods and jobs). The economy has three sectors. The PRIMARY sector gets raw materials from nature (farming, fishing, forestry, mining), mostly in rural areas. The SECONDARY sector is manufacturing: it turns raw materials into products by hand or with machines. The TERTIARY sector provides services and sells goods (stores, banks, hospitals, teachers, drivers). A good is an object you can touch and buy; a service is work someone does for you. Example: a farmer grows cotton (primary), a factory makes the T-shirt (secondary), a truck delivers it and a shop sells it (tertiary). The sectors and communities are interdependent: the city needs the countryside for food and raw materials, and the countryside needs the city for machines and services. Renewable resources can grow back (trees, crops); non-renewable resources, like oil, coal and metals, are gone forever once used. Markets follow supply (how much is available) and demand (how much people want). When demand goes up, supply has to go up. Local governments, like the mayor and council members in the municipal chamber, write local laws and decide how public money is spent on public services such as safe roads, waste collection, vaccinations and clean water.",
   blocks:[{"t": "✍️ Words you must know how to SPELL", "html": "<p style=\"margin:0 0 6px;font-size:13px\">Fill-in-the-blank and word-bank questions need the right spelling:</p><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">urban</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">suburban</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">rural</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">commute</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">population</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">density</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">raw materials</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">manufacturing</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">manufacturer</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">primary</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">secondary</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">tertiary</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">goods</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">services</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">supply</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">demand</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">interdependent</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">renewable</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">non-renewable</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">government</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">mayor</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#F1EFE8;color:#2C2C2A;font-weight:700;font-size:13px\">municipal chamber</span>"}, {"t": "⚠️ True or False traps", "html": "<div style=\"margin:6px 0;line-height:1.4\">Suburban areas are usually noisier and busier than cities. <b style=\"color:#A32D2D\">FALSE</b><br><span style=\"opacity:.85\">→ Suburban areas are quieter. The big, busy places are urban.</span></div><div style=\"margin:6px 0;line-height:1.4\">Rural communities are right next to the city center. <b style=\"color:#A32D2D\">FALSE</b><br><span style=\"opacity:.85\">→ Rural areas are far from cities.</span></div><div style=\"margin:6px 0;line-height:1.4\">Urban areas usually have more farms than rural areas. <b style=\"color:#A32D2D\">FALSE</b><br><span style=\"opacity:.85\">→ Farms and ranches are in rural areas.</span></div><div style=\"margin:6px 0;line-height:1.4\">A fisherman works in the primary sector. <b style=\"color:#0F6E56\">TRUE</b><br><span style=\"opacity:.85\">→ Fishing gets a raw material from nature.</span></div><div style=\"margin:6px 0;line-height:1.4\">The tertiary sector harvests raw materials. <b style=\"color:#A32D2D\">FALSE</b><br><span style=\"opacity:.85\">→ Harvesting is primary. Tertiary = services.</span></div><div style=\"margin:6px 0;line-height:1.4\">A teacher works in the secondary sector. <b style=\"color:#A32D2D\">FALSE</b><br><span style=\"opacity:.85\">→ A teacher gives a service, so it is tertiary.</span></div><div style=\"margin:6px 0;line-height:1.4\">People in rural areas mostly work in the tertiary sector. <b style=\"color:#A32D2D\">FALSE</b><br><span style=\"opacity:.85\">→ Rural work is mostly primary (farming, forestry, ranching).</span></div><div style=\"margin:6px 0;line-height:1.4\">When demand for a product goes up, supply should go down. <b style=\"color:#A32D2D\">FALSE</b><br><span style=\"opacity:.85\">→ More demand means more must be supplied.</span></div><div style=\"margin:6px 0;line-height:1.4\">Government offices belong to the primary sector. <b style=\"color:#A32D2D\">FALSE</b><br><span style=\"opacity:.85\">→ They give services, so they are tertiary.</span></div>"}, {"t": "📝 Model answers (explain with BECAUSE)", "html": "<div style=\"margin:8px 0;line-height:1.45\"><b>What is one difference between an urban and a suburban community?</b><br>Urban areas are big, busy cities with tall buildings and many people close together. Suburban areas are quieter and just outside the city, <b>because</b> they have houses with yards and fewer people.</div><div style=\"margin:8px 0;line-height:1.45\"><b>Why do the city and the countryside need each other?</b><br>The city needs the countryside for food and raw materials. The countryside needs the city for machines and services like hospitals. They are interdependent, <b>because</b> each one has something the other needs.</div><div style=\"margin:8px 0;line-height:1.45\"><b>How does the government help keep a community healthy and safe?</b><br>The government builds safe roads and manages waste. It also provides public health services like vaccinations and clean water, <b>because</b> these services protect everyone.</div><div style=\"margin:8px 0;line-height:1.45\"><b>Follow a T-shirt through the three sectors.</b><br>A farmer grows cotton (primary). <b>Then</b> a factory sews the T-shirt (secondary). <b>Finally</b> a truck delivers it and a shop sells it (tertiary).</div><div style=\"margin:8px 0;line-height:1.45\"><b>Give one push factor and one pull factor.</b><br>A lack of jobs is a push factor, <b>because</b> it pushes people to leave. Better schools are a pull factor, <b>because</b> they attract families to a new community.</div>"}],
   tips:[
     "🔑 <b>1-2-3 sectors</b>: <b>Primary</b> GETS it · <b>Secondary</b> MAKES it · <b>Tertiary</b> SERVES it",
     "🧵 <b>T-shirt journey</b>: cotton (primary) → T-shirt (secondary) → truck + shop (tertiary)",
     "📈 <b>Demand up → supply up.</b> More people want it, so more must be made",
     "🔀 <b>PUSH</b> pushes people away (bad things). <b>PULL</b> pulls people in (good things)",
     "🏙️ <b>URBAN</b> = big and busy · <b>SUBURBAN</b> = just outside, quiet · <b>RURAL</b> = far, farms",
     "🚗 <b>Commute</b> = go to work and come back home",
     "♻️ <b>Renewable</b> grows back (trees, crops). <b>Non-renewable</b> is gone forever (oil, coal, metals)",
     "🍎 <b>Good</b> = you can TOUCH it. <b>Service</b> = someone does WORK for you"
   ]},
  {key:'ciencias3', tri:3, label:'🧫 Ciências', color:'#378ADD', light:'#E6F1FB', dark:'#0C447C', lang:'pt', priority:true,
   summary:"Microrganismos são seres vivos tão pequenos que só podemos ver com microscópio. Estão no ar, no solo, na água e até no corpo do homem. Estudamos dois grupos: fungos e bactérias. Eles são os principais DECOMPOSITORES da natureza: transformam matéria orgânica (restos de plantas e animais) em produtos inorgânicos, e os nutrientes voltam ao meio ambiente para serem usados por outros seres vivos. Sem a decomposição, a vida acabaria. FUNGOS (Reino Fungi) não produzem o próprio alimento e não são plantas. Decompõem restos no solo (orelha-de-pau, mofo em frutas, pães e queijos), podem causar doenças (micose, frieira e a ferrugem das plantas), fabricam medicamentos (a penicilina, descoberta por acaso por Alexander Fleming em 1928) e ajudam na alimentação: cogumelos comestíveis (champignon, shimeji, shitake), shoyu (soja), vinho (uva), cerveja (cevada) e pão. As leveduras (fermento) fazem a fermentação: transformam o açúcar em álcool e soltam gás carbônico, que faz os furinhos e o crescimento da massa. Elas precisam de temperatura adequada, por isso usamos líquido morno. Queijos azuis e verdes têm fungos comestíveis. BACTÉRIAS são microscópicas e podem fazer bem ou mal. As decompositoras devolvem nutrientes ao meio ambiente. As patogênicas causam doenças e se multiplicam rápido (pneumonia, nos pulmões; otite, nos ouvidos). Os lactobacilos, as bactérias do bem, ajudam a fazer iogurtes, queijos e bebidas lácteas (Yakult) por fermentação do açúcar do leite. Alimentos probióticos (coalhada, iogurte, kefir, leite fermentado) têm microrganismos vivos que fazem bem ao intestino. Os furinhos do queijo suíço são gases liberados por bactérias. VACINAS são feitas com um microrganismo ou parte dele (vírus morto ou atenuado) e estimulam o sistema imunológico a preparar a defesa. Quanto mais gente vacinada, menor o risco de doenças para toda a população.",
   blocks:[{"t": "✍️ Palavras para saber ESCREVER", "html": "<p style=\"margin:0 0 6px;font-size:13px\">Nas perguntas de completar, a ortografia conta:</p><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">microrganismos</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">microscópio</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">decomposição</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">decompositores</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">nutrientes</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">fungos</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">bactérias</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">leveduras</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">fermentação</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">gás carbônico</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">penicilina</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">antibiótico</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">patogênicas</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">lactobacilos</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">probióticos</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">pneumonia</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">otite</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">ferrugem</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">micose</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">vacina</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">atenuado</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#E6F1FB;color:#0C447C;font-weight:700;font-size:13px\">sistema imunológico</span>"}, {"t": "⚠️ Pegadinhas de Verdadeiro ou Falso", "html": "<div style=\"margin:6px 0;line-height:1.4\">Os fungos produzem o seu próprio alimento. <b style=\"color:#A32D2D\">FALSO</b><br><span style=\"opacity:.85\">→ Fungos NÃO produzem o próprio alimento.</span></div><div style=\"margin:6px 0;line-height:1.4\">Todas as espécies de fungos são vistas só com microscópio. <b style=\"color:#A32D2D\">FALSO</b><br><span style=\"opacity:.85\">→ Cogumelos (champignon, shimeji) se veem a olho nu.</span></div><div style=\"margin:6px 0;line-height:1.4\">Os fungos são usados na fabricação de queijos e dão sabor. <b style=\"color:#0F6E56\">VERDADEIRO</b><br><span style=\"opacity:.85\">→ Queijos azuis e verdes têm fungos comestíveis.</span></div><div style=\"margin:6px 0;line-height:1.4\">Fungos podem ajudar na fermentação de vinhos e cervejas. <b style=\"color:#0F6E56\">VERDADEIRO</b><br><span style=\"opacity:.85\">→ As leveduras fazem a fermentação.</span></div><div style=\"margin:6px 0;line-height:1.4\">Todos os fungos causam doenças. <b style=\"color:#A32D2D\">FALSO</b><br><span style=\"opacity:.85\">→ Muitos ajudam: decompõem, fazem alimentos e remédios.</span></div><div style=\"margin:6px 0;line-height:1.4\">Os fungos decompositores não são importantes. <b style=\"color:#A32D2D\">FALSO</b><br><span style=\"opacity:.85\">→ Sem eles os nutrientes não voltam para a natureza.</span></div><div style=\"margin:6px 0;line-height:1.4\">Todas as bactérias causam doenças. <b style=\"color:#A32D2D\">FALSO</b><br><span style=\"opacity:.85\">→ Há bactérias do bem: lactobacilos, decompositoras.</span></div><div style=\"margin:6px 0;line-height:1.4\">Os furinhos do queijo vêm de gases de bactérias. <b style=\"color:#0F6E56\">VERDADEIRO</b><br><span style=\"opacity:.85\">→ Os gases são liberados durante a fabricação.</span></div><div style=\"margin:6px 0;line-height:1.4\">Vinho e pão são feitos por bactérias. <b style=\"color:#A32D2D\">FALSO</b><br><span style=\"opacity:.85\">→ São feitos por fungos (leveduras). Iogurte é que usa bactérias.</span></div><div style=\"margin:6px 0;line-height:1.4\">A falta de vacinação é problema só de quem não se vacina. <b style=\"color:#A32D2D\">FALSO</b><br><span style=\"opacity:.85\">→ Atinge toda a população.</span></div><div style=\"margin:6px 0;line-height:1.4\">Vacinas servem para matar bactérias quando já estamos doentes. <b style=\"color:#A32D2D\">FALSO</b><br><span style=\"opacity:.85\">→ Vacina protege ANTES de ficar doente. Quem trata depois é o antibiótico.</span></div>"}, {"t": "📝 Respostas-modelo (use PORQUE)", "html": "<div style=\"margin:8px 0;line-height:1.45\"><b>Qual é a importância da decomposição na natureza?</b><br>A decomposição é importante <b>porque</b> fungos e bactérias transformam a matéria orgânica em produtos inorgânicos e os nutrientes voltam ao meio ambiente para outros seres vivos usarem.</div><div style=\"margin:8px 0;line-height:1.45\"><b>Dê 3 exemplos do que os fungos podem fazer.</b><br>Os fungos podem decompor restos de plantas e animais, causar doenças (micose, frieira, ferrugem) e produzir medicamentos (penicilina). Também ajudam a fazer pão, queijos, vinho e shoyu.</div><div style=\"margin:8px 0;line-height:1.45\"><b>Dê 3 exemplos do que as bactérias podem fazer.</b><br>As bactérias podem decompor restos de seres vivos, causar doenças (pneumonia e otite) e ajudar a fazer alimentos, como iogurtes e queijos, por fermentação.</div><div style=\"margin:8px 0;line-height:1.45\"><b>O que são alimentos probióticos?</b><br>São alimentos com microrganismos vivos, uma colônia de bactérias que fazem bem à saúde e ao equilíbrio do intestino. Exemplos: coalhada, iogurte e kefir.</div><div style=\"margin:8px 0;line-height:1.45\"><b>O que são os furinhos dos queijos?</b><br>São buracos formados pelos gases que as bactérias liberam durante a fabricação do queijo.</div><div style=\"margin:8px 0;line-height:1.45\"><b>O que é o fermento biológico? Dê um exemplo.</b><br>É feito de leveduras, que são fungos. Elas fazem a fermentação dos açúcares e soltam gás carbônico, que faz a massa crescer. Exemplo: massa de pão.</div><div style=\"margin:8px 0;line-height:1.45\"><b>O que Fleming descobriu e por que foi importante?</b><br>Fleming descobriu a penicilina, um antibiótico. Foi importante <b>porque</b> ela combate bactérias e salvou milhares de vidas, como a de soldados na guerra.</div><div style=\"margin:8px 0;line-height:1.45\"><b>Qual é a importância das vacinas?</b><br>As vacinas estimulam o sistema imunológico a se defender, protegem a pessoa e toda a população e diminuem o risco de doenças.</div>"}],
   tips:[
     "🔑 <b>Decompositores</b> = <b>fungos + bactérias</b>. Eles reciclam os nutrientes da natureza",
     "🍞 <b>Pão, vinho e cerveja</b> = fungos (leveduras). <b>Iogurte e queijo suíço</b> = bactérias",
     "💨 O <b>fermento</b> solta <b>gás carbônico</b>: por isso o pão tem furinhos e cresce",
     "🌡️ Líquido <b>morno</b> na massa: as leveduras precisam de temperatura adequada para fermentar",
     "🧪 <b>Fleming (1928)</b> descobriu a <b>penicilina</b> por acaso: em volta do mofo não havia bactérias",
     "🥛 <b>Probióticos</b> = microrganismos vivos que fazem bem ao intestino (coalhada, iogurte, kefir)",
     "💉 <b>Vacina</b> = vírus morto ou atenuado que ensina o sistema imunológico a se defender",
     "🍄 Fungos <b>não</b> produzem o próprio alimento e <b>não</b> são plantas. Nem todo fungo é microscópico"
   ]},
  {key:'portugues3', tri:3, label:'📚 Língua Portuguesa', color:'#D4537E', light:'#FBEAF0', dark:'#72243E', lang:'pt', priority:true,
   summary:"LENDAS BRASILEIRAS são histórias populares passadas de geração em geração, de boca em boca (tradição oral). O autor é desconhecido. Misturam realidade e fantasia, têm seres do folclore como personagens (Curupira, Saci, Iara, Boitatá), costumam explicar a origem de algo ou deixar uma lição e começam com expressões como \"há muito tempo\". VERBOS indicam ação (correr), estado (ser, estar) ou fenômeno da natureza (chover, trovejar, nevar). Conjugações: 1ª termina em -AR (cantar), 2ª em -ER (comer) e 3ª em -IR (partir). O verbo muda conforme a pessoa e o tempo: presente (eu como), passado (eu comi, eles comeram) e futuro (eu comerei, eles comerão). VERBOS EM -AM e -ÃO: no passado terminam em -AM, sem til (comeram, brincaram). No futuro terminam em -ÃO, com til (comerão, brincarão). Use a palavra de tempo como pista: ontem pede -AM e amanhã pede -ÃO. CONCORDÂNCIA VERBAL: o verbo precisa combinar com o sujeito, que é quem faz a ação. Sujeito no singular, verbo no singular (O gato corre). Sujeito no plural, verbo no plural (Os gatos correm). O sujeito pode estar oculto: em \"Brincamos no parque\" o sujeito é \"nós\". Na concordância nominal, artigo, substantivo e adjetivo combinam em número e gênero (As meninas alegres). PLURAL DAS PALAVRAS EM L e U: terminadas em U só ganham S (cacau, cacaus). Em AL, EL e OL tira-se o L e acrescenta-se IS (jornal, jornais; anel, anéis; sol, sóis). Em IL tira-se o L e acrescenta-se S (barril, barris). É uma regra básica e existem exceções. DISCURSO DIRETO reproduz a fala exata de alguém, com dois-pontos, travessão e mudança de linha, e verbos que anunciam a fala (dizer, perguntar, responder). No DISCURSO INDIRETO o narrador conta o que foi dito com as próprias palavras, usando \"que\" e sem travessão. Fala direta e discurso direto são sinônimos, assim como fala indireta e discurso indireto. APOSTO é uma palavra ou frase que explica um substantivo que aparece antes e está quase sempre entre vírgulas (Brasília, capital do Brasil, é planejada). VOCATIVO é o termo que chama alguém e está sempre separado por vírgula; pode vir no início, no meio ou no fim (Paulo, venha aqui! / Ei, você, venha cá! / Você sabe que horas são, amiga?).",
   blocks:[{"t": "✍️ Palavras para saber ESCREVER", "html": "<p style=\"margin:0 0 6px;font-size:13px\">Na prova de Português, erros de escrita descontam nota:</p><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">lenda</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">folclore</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">conjugação</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">concordância</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">discurso direto</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">discurso indireto</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">travessão</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">dois-pontos</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">vocativo</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">aposto</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">passado</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">presente</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">futuro</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">sujeito</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">plural</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">chapéus</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">hotéis</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">anéis</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">sóis</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">caracóis</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">pincéis</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">túneis</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">automóveis</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">mingaus</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">barris</span><span style=\"display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:14px;background:#FBEAF0;color:#72243E;font-weight:700;font-size:13px\">funis</span>"}, {"t": "🔤 Plural das palavras em L e U (lista do caderno)", "html": "<p style=\"margin:0 0 6px;font-size:13px\">U → + S · AL, EL, OL → tira o L + IS · IL → tira o L + S</p><div style=\"columns:2;column-gap:18px;font-size:13px;line-height:1.7\"><div>anel → <b>anéis</b></div><div>automóvel → <b>automóveis</b></div><div>barril → <b>barris</b></div><div>berimbau → <b>berimbaus</b></div><div>cacau → <b>cacaus</b></div><div>caracol → <b>caracóis</b></div><div>Carnaval → <b>Carnavais</b></div><div>céu → <b>céus</b></div><div>chapéu → <b>chapéus</b></div><div>curral → <b>currais</b></div><div>degrau → <b>degraus</b></div><div>espacial → <b>espaciais</b></div><div>funil → <b>funis</b></div><div>gentil → <b>gentis</b></div><div>girassol → <b>girassóis</b></div><div>hotel → <b>hotéis</b></div><div>jornal → <b>jornais</b></div><div>litoral → <b>litorais</b></div><div>mingau → <b>mingaus</b></div><div>Natal → <b>Natais</b></div><div>numeral → <b>numerais</b></div><div>pardal → <b>pardais</b></div><div>pica-pau → <b>pica-paus</b></div><div>pincel → <b>pincéis</b></div><div>policial → <b>policiais</b></div><div>punhal → <b>punhais</b></div><div>sideral → <b>siderais</b></div><div>Sol → <b>sóis</b></div><div>sutil → <b>sutis</b></div><div>troféu → <b>troféus</b></div><div>túnel → <b>túneis</b></div><div>varal → <b>varais</b></div></div>"}, {"t": "⚠️ Pegadinhas de Verdadeiro ou Falso", "html": "<div style=\"margin:6px 0;line-height:1.4\">Verbos terminados em -er são da 1ª conjugação. <b style=\"color:#A32D2D\">FALSO</b><br><span style=\"opacity:.85\">→ -er é a 2ª conjugação. A 1ª é -ar e a 3ª é -ir.</span></div><div style=\"margin:6px 0;line-height:1.4\">Se o sujeito está no plural, o verbo fica no singular. <b style=\"color:#A32D2D\">FALSO</b><br><span style=\"opacity:.85\">→ O verbo concorda: plural com plural.</span></div><div style=\"margin:6px 0;line-height:1.4\">Ontem, eles comerão o lanche. <b style=\"color:#A32D2D\">FALSO</b><br><span style=\"opacity:.85\">→ Ontem pede passado: eles comeram.</span></div><div style=\"margin:6px 0;line-height:1.4\">O vocativo só aparece no começo da frase. <b style=\"color:#A32D2D\">FALSO</b><br><span style=\"opacity:.85\">→ Pode estar no início, no meio ou no fim.</span></div><div style=\"margin:6px 0;line-height:1.4\">O aposto serve para chamar alguém. <b style=\"color:#A32D2D\">FALSO</b><br><span style=\"opacity:.85\">→ Quem chama é o vocativo. O aposto explica.</span></div><div style=\"margin:6px 0;line-height:1.4\">No discurso indireto usamos travessão. <b style=\"color:#A32D2D\">FALSO</b><br><span style=\"opacity:.85\">→ Travessão e dois-pontos são do discurso direto.</span></div><div style=\"margin:6px 0;line-height:1.4\">O plural de mingau é mingais. <b style=\"color:#A32D2D\">FALSO</b><br><span style=\"opacity:.85\">→ Terminada em U só ganha S: mingaus.</span></div><div style=\"margin:6px 0;line-height:1.4\">O autor de uma lenda é sempre conhecido. <b style=\"color:#A32D2D\">FALSO</b><br><span style=\"opacity:.85\">→ Lenda é popular e o autor é desconhecido.</span></div><div style=\"margin:6px 0;line-height:1.4\">O plural de funil é funis. <b style=\"color:#0F6E56\">VERDADEIRO</b><br><span style=\"opacity:.85\">→ IL: tira o L e põe S.</span></div><div style=\"margin:6px 0;line-height:1.4\">Fala direta é sinônimo de discurso direto. <b style=\"color:#0F6E56\">VERDADEIRO</b><br><span style=\"opacity:.85\">→ Fala indireta = discurso indireto.</span></div><div style=\"margin:6px 0;line-height:1.4\">Chover e trovejar indicam fenômenos da natureza. <b style=\"color:#0F6E56\">VERDADEIRO</b><br><span style=\"opacity:.85\">→ São verbos de fenômeno da natureza.</span></div>"}, {"t": "📝 Respostas-modelo (use PORQUE)", "html": "<div style=\"margin:8px 0;line-height:1.45\"><b>Por que \"As crianças brinca no parque\" está errada? Corrija.</b><br>Está errada <b>porque</b> o sujeito \"as crianças\" está no plural e o verbo ficou no singular. O certo é: As crianças brincam no parque.</div><div style=\"margin:8px 0;line-height:1.45\"><b>Escreva duas diferenças e uma semelhança entre discurso direto e indireto.</b><br>No direto a fala é reproduzida exatamente, com travessão e dois-pontos. No indireto o narrador conta a fala com suas palavras, usando \"que\", sem travessão. Semelhança: nos dois alguém fala e o narrador conta o que foi dito.</div><div style=\"margin:8px 0;line-height:1.45\"><b>O que é o aposto? Dê um exemplo.</b><br>Aposto é uma palavra ou frase que explica um substantivo que aparece antes, quase sempre entre vírgulas. Exemplo: Brasília, capital do Brasil, é uma cidade planejada.</div><div style=\"margin:8px 0;line-height:1.45\"><b>O que é o vocativo? Dê um exemplo.</b><br>Vocativo é o termo que chama alguém e fica separado por vírgula. Exemplo: Gente, quem aceita tomar sorvete comigo?</div><div style=\"margin:8px 0;line-height:1.45\"><b>Una as duas frases com um aposto: \"Valentina é minha prima. Ela mora em outra cidade.\"</b><br>Valentina, minha prima, mora em outra cidade.</div><div style=\"margin:8px 0;line-height:1.45\"><b>Quais são as características de uma lenda?</b><br>Lenda é uma história popular passada de boca em boca, de autor desconhecido. Mistura realidade e fantasia, tem seres do folclore e costuma explicar a origem de algo ou deixar uma lição.</div><div style=\"margin:8px 0;line-height:1.45\"><b>Passe para o plural: \"A planta flutua sobre o lago.\"</b><br>As plantas flutuam sobre os lagos. (Mudou o artigo, o substantivo e o verbo.)</div>"}, {"t": "📌 Anotação do caderno", "html": "<p style=\"margin:0 0 8px;line-height:1.5\">Anotação da Lala no caderno: <b>pôr, compor e propor são da 2ª conjugação</b> (vêm de \"poer\"). A apostila lista os verbos em -or junto com a 3ª. Se aparecer na prova, vale o que a professora ensinou em sala.</p><p style=\"margin:0;line-height:1.5\">Verbos como <b>latir, partir, sorrir e ir</b> são da 3ª. <b>Ler, comer, correr e entender</b> são da 2ª.</p>"}],
   tips:[
     "🕐 <b>Ontem</b> pede <b>-AM</b> (comeram). <b>Amanhã</b> pede <b>-ÃO</b>, com til (comerão)",
     "📝 Quem faz a ação é o <b>sujeito</b>. Sujeito plural = <b>verbo plural</b>: Os cachorros <b>latem</b>",
     "🔤 <b>U</b> → + S · <b>AL, EL, OL</b> → tira o L + IS · <b>IL</b> → tira o L + S",
     "✏️ Atenção aos acentos: anel → <b>anéis</b> · hotel → <b>hotéis</b> · sol → <b>sóis</b> · caracol → <b>caracóis</b>",
     "💬 Discurso <b>direto</b>: dois-pontos e travessão · <b>indireto</b>: \"disse <b>que</b>\"",
     "📖 <b>Aposto explica</b> (Lucas, o goleiro do time, ...) · 📣 <b>Vocativo chama</b> (Paulo, venha aqui!)",
     "🧙 <b>Lenda</b>: autor desconhecido, tradição oral, mistura realidade e fantasia, deixa uma lição",
     "⚠️ Enunciado com <b>INCORRETA, FALSA ou ERRADA</b>? Leia duas vezes antes de marcar"
   ]},
];

  {key:"science2", tri:2, label:"🔬 Science", color:"#1D9E75", lang:"en",
   subtopics:[
    {label:"🧱 Matter & properties", fixed:true,
     questions:[
      {q:"What is matter?", opts:["Anything that has mass and takes up space","Only solid objects","Anything you can see with your eyes","Anything that is alive"], a:0, exp:"Matter is anything that has mass and takes up space. It is generally found in three states: solid, liquid or gas."},
      {q:"What are the properties of matter?", opts:["The price of an object","The characteristics that describe an object","The place where an object is kept","The name given to an object"], a:1, exp:"Properties of matter are the characteristics that describe objects — size, temperature, texture, shape and mass."},
      {q:"Which THREE basic properties of matter did we study?", opts:["Heat, light and sound","Height, width and depth","Shape, volume and mass","Colour, smell and taste"], a:2, exp:"Shape, volume and mass. Volume is the amount of space matter takes up; mass is the amount of matter an object has."},
      {q:"All matter is made up of tiny particles called...", opts:["grains","cells","drops","atoms"], a:3, exp:"All matter is made up of tiny particles called atoms. How they are arranged decides the state of matter."},
      {q:"Volume is the amount of ______ that matter takes up.", opts:["space","weight","energy","matter"], a:0, exp:"Volume = space. Careful, mass = the amount of matter an object has. They are different!"},
      {q:"Mass is the amount of ______ an object has.", opts:["water","matter","space","air"], a:1, exp:"Mass = amount of matter. Volume = amount of space. This pair is a classic exam trap."},
      {q:"Which of these is an observable physical property?", opts:["Being irreversible","Producing bubbles","Luster (how shiny something is)","Being a new substance"], a:2, exp:"Observable properties include length, colour, density, mass, elasticity, pressure, volume and luster."},
      {q:"Which property describes how much a material can stretch and go back to its shape?", opts:["Volume","Density","Luster","Elasticity"], a:3, exp:"Elasticity is what a rubber band has. Luster is shine; density compares mass and volume."},
      {q:"Which item does NOT belong in the group 'flexible'?", opts:["A hammer","A rubber hose","A piece of wire","A t-shirt"], a:0, exp:"Flexible things bend without breaking. A hammer is rigid and hard."},
      {type:'fill', q:"Matter is anything that has mass and takes up ______.", accept:["space"], exp:"Matter = mass + space. Everything around you is matter."},
      {type:'fill', q:"All matter is made up of tiny particles called ______.", accept:["atoms","atom"], exp:"Atoms are the tiny particles that make up all matter."}
     ]},
    {label:"🧊 States of matter", fixed:true,
     questions:[
      {q:"Which state of matter is RIGID, with a fixed shape and a fixed volume?", opts:["Liquid","Solid","Gas","None of them"], a:1, exp:"Solid = rigid, fixed shape, fixed volume. Its particles are packed tightly and barely move."},
      {q:"A liquid is NOT rigid, has NO fixed shape, but has...", opts:["no volume at all","no particles","a fixed volume","a fixed shape"], a:2, exp:"Liquid = not rigid, no fixed shape, FIXED volume. It takes the shape of its container."},
      {q:"Which state has no fixed shape AND no fixed volume?", opts:["Liquid","Solid","Ice","Gas"], a:3, exp:"Gas = not rigid, no fixed shape, no fixed volume. It spreads out to fill all the space available."},
      {q:"How do the particles behave in a SOLID?", opts:["They are packed tightly together and barely move at all","They are spread far apart and move a lot","They slide against each other","They stop existing"], a:0, exp:"Packed tightly and barely moving — that is why solids do not change shape."},
      {q:"How do the particles behave in a LIQUID?", opts:["They are spread far apart and move very fast","They are close together but slide against each other","They are joined in a fixed pattern","They are packed tightly and cannot move"], a:1, exp:"Close together but sliding — that is why a liquid flows and takes the shape of its container."},
      {q:"Why can a gas fill a whole room?", opts:["Its particles are packed tightly","Gas particles never move","Its particles are spread far apart and move around a lot","Gas has a fixed volume"], a:2, exp:"Gases change shape AND spread out to fill all the space in a container."},
      {q:"Which list contains only SOLIDS?", opts:["Milk, oil, shampoo, juice","Ice cube, oxygen, paint, fish","Oxygen, helium, carbon dioxide, water vapor","Pencil, cookie, salt, sand"], a:3, exp:"Careful with mixed lists — check every item before choosing."},
      {q:"Which list contains only GASES?", opts:["Oxygen, helium, carbon dioxide, water vapor","Pencil, fish, salt, sand","Milk, maple syrup, gasoline, paint","Ice cube, water vapor, oil, helium"], a:0, exp:"The atmosphere contains oxygen, carbon dioxide, nitrogen, water vapor and helium."},
      {q:"Maple syrup and shampoo are examples of...", opts:["solids","liquids","gases","none of the states"], a:1, exp:"They flow and take the shape of their container, so they are liquids."},
      {q:"A pot on the stove shows three states at once. Which is correct?", opts:["The pot is liquid, the water is gas, the steam is solid","Everything in the picture is liquid","The pot is solid, the water inside is liquid, the steam above is gas","The pot is gas, the water is solid, the steam is liquid"], a:2, exp:"This is the classic booklet picture — matter is everywhere and often in all three states at the same time."},
      {type:'fill', q:"Solids have a definite shape and a definite ______.", accept:["volume"], exp:"Solid = fixed shape + fixed volume. Liquid = fixed volume only. Gas = neither."},
      {type:'fill', q:"Liquids take the shape of their ______.", accept:["container"], exp:"A liquid has a fixed volume but no fixed shape."}
     ]},
    {label:"♻️ Physical changes", fixed:true,
     questions:[
      {q:"What is a physical change?", opts:["A process that only happens when something burns","A process that is always permanent","A process in which a new substance is always formed","A process in which a substance changes its state of matter, but the chemical bonds stay the same"], a:3, exp:"In a physical change no new products are formed and the molecular composition remains the same."},
      {q:"Which of these is an example of a physical change?", opts:["Melting ice into water","Burning a piece of paper","Baking a cake","Rust forming on a bike"], a:0, exp:"This exact question was on the study guide! Melting only changes the state — the water molecules stay the same."},
      {q:"Which of these is NOT a sign of a physical change?", opts:["Change of state","Formation of bubbles of a new gas","Change of shape","Change in size"], a:1, exp:"Signs of physical change: change of shape, of state, of size, or of any other physical property. Bubbles signal a CHEMICAL change."},
      {q:"You break a glass. What substance is formed after the change?", opts:["A new substance called broken-glass","Sand","Glass — it is still glass, just in pieces","Nothing"], a:2, exp:"Before: glass. After: glass. That is exactly why breaking is a physical change."},
      {q:"Bending a paperclip is a physical change because...", opts:["the change involves heat","a new metal is created","the paperclip disappears","only the shape changes — it is still the same metal"], a:3, exp:"Physical change affects only physical properties such as shape, size and weight."},
      {q:"Which group contains ONLY physical changes?", opts:["Chopping vegetables, bending a paperclip, cutting fabric","Burning firewood, iron rusting, frying an egg","Freezing water, digesting food, breaking a glass","Melting an ice cube, souring of milk, tearing paper"], a:0, exp:"None of the three forms a new substance — the material stays the same."},
      {type:'fill', q:"In a physical change, no new products are formed and the molecular composition remains the ______.", accept:["same"], exp:"Same substance, different appearance. That is the whole idea."}
     ]},
    {label:"🔥 Chemical changes", fixed:true,
     questions:[
      {q:"What is a chemical change?", opts:["Any change caused by water","A process in which one kind of substance is changed into a different kind of substance","A process in which only the shape changes","A change of state, like melting"], a:1, exp:"Chemical changes produce substances that were not there when it started. They are irreversible and permanent."},
      {q:"Which of the following is a chemical change?", opts:["Breaking a glass","Crushing a can","Burning wood","Dissolving sugar in water"], a:2, exp:"This exact question was on the study guide! The other three are physical changes."},
      {q:"Which is NOT a sign of a chemical change?", opts:["Formation of bubbles","Change in temperature","Change in odor","Change of shape"], a:3, exp:"Signs of chemical change: temperature, colour, odor, taste, formation of a precipitate, formation of bubbles. Shape is a PHYSICAL sign."},
      {q:"Burning firewood: what substance is formed AFTER the chemical change?", opts:["Ash","Firewood","Wood","Smokewood"], a:0, exp:"Before: firewood. After: ash. A completely new substance — and you cannot rebuild the wood from the ashes."},
      {q:"Iron rusting: before the change there is iron. After the change there is...", opts:["iron","rust","steel","metal"], a:1, exp:"Iron + oxygen + water → rust. New substance, so it is a chemical change."},
      {q:"Which of these lists contains ONLY chemical changes?", opts:["Cutting fabric, chopping vegetables, tearing paper","Melting ice, boiling water, freezing juice","Photosynthesis, digesting food, teeth decaying","Bending a paperclip, breaking a glass, dissolving salt"], a:2, exp:"The booklet lists photosynthesis, respiration, digestion, fruit ripening and teeth decaying as chemical changes."},
      {q:"Chemical changes happen on a ______ level, when atomic bonds are broken or created.", opts:["visible","liquid","physical","molecular"], a:3, exp:"Physical changes do NOT happen on a molecular level; chemical changes do."},
      {type:'fill', q:"A chemical change is when a new ______ is made.", accept:["substance"], exp:"New substance = chemical change. Same substance = physical change."}
     ]},
    {label:"🔄 Reversible & irreversible", fixed:true,
     questions:[
      {q:"What is a reversible change?", opts:["A process where the substance can return to its original state","A process that always creates a new substance","A process that only happens with heat","A process that is always permanent"], a:0, exp:"Reversible changes can be undone, returning a substance to its original state."},
      {q:"What is an irreversible change?", opts:["A change that can be repeated many times","A process that alters a substance permanently and cannot be undone","Any change that involves water","A change of state"], a:1, exp:"Irreversible changes are permanent. New substances are often formed and the original ones cannot be retrieved easily."},
      {q:"Melting an ice cube and freezing it back into ice is...", opts:["irreversible","a chemical change","reversible","impossible"], a:2, exp:"States of matter are the classic reversible change — you can go back and forth."},
      {q:"Dissolving salt in water is reversible because...", opts:["a new substance is created","the water becomes salt","the salt disappears forever","the salt can be recovered by evaporating the water"], a:3, exp:"Evaporate the water and the salt crystals come back. Nothing new was formed."},
      {q:"Frying an egg is irreversible because...", opts:["the proteins change permanently and the egg cannot become raw again","the egg only changes shape","the egg gets smaller","you can put it back in the shell"], a:0, exp:"Cooking an egg, baking a cake and burning wood are all permanent."},
      {q:"CAREFUL — melting chocolate is:", opts:["irreversible, because it looks completely different","reversible, because cooling it makes it solid chocolate again","irreversible, because heat was used","a chemical change"], a:1, exp:"Melting is a change of STATE, so it is reversible. Heat alone does not make a change permanent!"},
      {q:"CAREFUL — cooking raw rice is:", opts:["a physical change with no new substance","reversible, because you can dry the rice out","irreversible, because the cooked rice cannot become raw again","reversible, because rice is still rice"], a:2, exp:"Heating food is listed as irreversible in the booklet. Once cooked, it cannot go back."},
      {q:"Chopping an apple into pieces is a PHYSICAL change, but it is:", opts:["reversible, because the apple is still an apple","not a change at all","a chemical change","irreversible, because you cannot join the pieces back together"], a:3, exp:"Important: physical/chemical and reversible/irreversible are TWO different questions. Cutting is physical but permanent."},
      {q:"Inflating a balloon is reversible, but POPPING a balloon is:", opts:["irreversible","a change of state","reversible","not a change"], a:0, exp:"You can let the air out and inflate again — but a popped balloon cannot be unpopped."},
      {q:"Which list has ONLY irreversible changes?", opts:["States of matter, solid + liquid, solid + solid","Burning, rusted metals, heating food, mixed ingredients","Melting ice, freezing juice, inflating a balloon","Dissolving salt, stretching a rubber band, melting butter"], a:1, exp:"That is exactly the booklet's irreversible list."},
      {type:'fill', q:"A change that can be undone, returning a substance to its original state, is called ______.", accept:["reversible"], exp:"Reversible = can go back. Irreversible = permanent."},
      {type:'fill', q:"Burning wood or paper is ______ because it turns into ash and smoke.", accept:["irreversible"], exp:"You cannot reconstruct the paper from its ashes."}
     ]},
    {label:"📖 Reading: Why Matter Matters", fixed:true,
     ctxTitle:"🔬 WHY DOES MATTER MATTER?",
     ctxParas:["Every single thing around you is matter. Matter is anything that has mass and takes up space, and it is made of tiny particles called atoms. Your chair, the water in your glass and even the air you breathe are all matter, although they look nothing alike.","The reason they look so different is the way their atoms are arranged. In a solid, the atoms are packed tightly together and barely move, so the object keeps a fixed shape and a fixed volume. In a liquid, the atoms are still close but they slide against one another, which is why milk spreads across the floor when it is spilled and why the same amount of milk looks different in a tall glass and in a wide mug.","Gases behave differently again. Their atoms are spaced much farther apart and move freely in every direction. If a gas is not held inside a container it will spread out indefinitely. That is why you cannot see the air around you, and yet it is genuinely there, in the tyres of your bicycle and across the whole atmosphere.","Matter can also change. When ice melts into water, the state changes but the substance does not, so we call it a physical change. When firewood burns and turns into ash, something new is created that cannot be turned back, and we call that a chemical change. Learning to tell the two apart is the first step to understanding why matter matters."],
     questions:[
      {q:"According to the text, what is matter?", opts:["Only liquids and solids","Only living things","Anything that has mass and takes up space","Anything that can be seen"], a:2, exp:"The definition appears in the very first sentence of the passage."},
      {q:"Why do a chair, water and air look so different if they are all matter?", opts:["Because only one of them is really matter","Because they have the same volume","Because they are made of different kinds of matter","Because the way their atoms are arranged is different"], a:3, exp:"The arrangement and movement of the atoms decides the state of matter."},
      {q:"In paragraph three, the word 'indefinitely' tells you that a gas will spread...", opts:["without any limit","only a little bit","downwards","for exactly one hour"], a:0, exp:"'Indefinitely' means without a defined end or limit — the gas keeps spreading."},
      {q:"Why does the same amount of milk look different in a tall glass and a wide mug?", opts:["Because the glass adds volume to the milk","Because a liquid has a fixed volume but takes the shape of its container","Because the amount of milk changes","Because milk is a solid"], a:1, exp:"Fixed volume, no fixed shape — the defining pair for liquids."},
      {q:"Using the text, which change is PHYSICAL and which is CHEMICAL?", opts:["Ice melting is chemical; firewood burning is physical","Ice melting is physical; firewood burning is chemical","Both are physical","Both are chemical"], a:1, exp:"Melting changes the state only. Burning creates ash, a new substance."},
      {q:"Which sentence from the passage best explains why burning is a chemical change?", opts:["The atoms are spaced much farther apart","The atoms slide against one another","Matter is anything that has mass","Something new is created that cannot be turned back"], a:3, exp:"New substance + cannot go back = chemical and irreversible."}
     ]},
    {label:"🎯 Change Challenge", fixed:true,
     questions:[
      {q:"When water evaporates from a puddle, what type of change is happening?", opts:["Physical change","Chemical change","Both","Neither"], a:0, exp:"Evaporation is a change of STATE. The water becomes water vapor but it is still water."},
      {q:"When sugar dissolves in water, what type of change is it?", opts:["Chemical change","Physical change","Both","Neither"], a:1, exp:"The sugar spreads between the water particles but stays sugar — you can still taste it. Nothing new is made."},
      {q:"Fireworks exploding is an example of:", opts:["no change at all","a physical change","a chemical change","a change of state"], a:2, exp:"New substances, light, heat and gas are produced — and you can never get the firework back."},
      {q:"Digesting food is:", opts:["a change of state","a physical change, because the food only changes shape","not a change","a chemical change, because the food is broken into new substances"], a:3, exp:"The booklet lists digesting food, respiration and photosynthesis as chemical changes."},
      {q:"Which of these is a physical change?", opts:["Boiling water","Digesting food","Burning wood","Baking bread"], a:0, exp:"Boiling changes liquid into gas. The other three all create new substances."},
      {q:"Which of the following describes a chemical change?", opts:["Paper tearing","Fireworks exploding","Cutting a cake","Water freezing into ice"], a:1, exp:"Freezing, tearing and cutting are all physical — the substance never changes."},
      {q:"Which of these changes CANNOT be reversed?", opts:["Freezing water","Melting chocolate","Burning wood","Inflating a balloon"], a:2, exp:"Burning creates ash and smoke permanently. The other three can all be undone."},
      {q:"Which of these is NOT a sign of a chemical change?", opts:["Temperature change","Colour change","Formation of gas","Change in shape"], a:3, exp:"Shape is a PHYSICAL sign. Chemical signs: colour, odor, taste, temperature, bubbles, precipitate."},
      {q:"What happens during a physical change?", opts:["The substance changes its shape or state but stays the same substance","A new substance is made","The substance disappears","Energy is created"], a:0, exp:"Same substance, new appearance. That is the whole definition."},
      {q:"When iron turns rusty, this is an example of:", opts:["freezing","a chemical change","melting","a physical change"], a:1, exp:"Iron + oxygen + water → rust, a brand new substance that cannot easily be turned back."},
      {q:"Crushing an empty can is:", opts:["a chemical change — the can looks completely different","a physical change — it is still aluminium, just a different shape","both a physical and a chemical change","neither, because nothing happened"], a:1, exp:"Careful: looking different is not the same as BEING different. The substance never changed."},
      {q:"A candle is lit. The wax melts and the wick burns. This shows:", opts:["only a chemical change","only a physical change","a physical change and a chemical change at the same time","neither type of change"], a:2, exp:"Melting wax = physical. Burning wick = chemical. Some situations show both at once."},
      {type:'fill', q:"Water evaporating from a puddle is a ______ change.", accept:["physical"], exp:"The state changes, the substance does not."},
      {type:'fill', q:"Fireworks exploding and iron rusting are both ______ changes.", accept:["chemical"], exp:"Both create new substances permanently."},
      {q:"Breaking an egg is a ______ change, but frying an egg is a ______ change.", opts:["physical / chemical","physical / physical","chemical / physical","chemical / chemical"], a:0, exp:"Breaking only changes how the egg looks. Frying creates new substances that can never become raw again."},
      {q:"Which of these can be a sign of a CHEMICAL change?", opts:["Changing shape","Creating sound or producing light","Changing state of matter","Changing size"], a:1, exp:"Signs of chemical change include colour, odor, sound, released gas, light, and absorbing or releasing heat."},
      {q:"A chemical change may:", opts:["only absorb heat","only release heat","absorb OR release heat","never involve heat"], a:2, exp:"Both directions count. Burning releases heat; some reactions take heat in."},
      {q:"Which sentence is the most accurate?", opts:["Physical changes can ALWAYS be undone; chemical changes NEVER can","Physical changes can OFTEN be undone; chemical changes USUALLY cannot","Both types can always be undone","Neither type can ever be undone"], a:1, exp:"Careful with 'always' and 'never'. Cutting an apple is physical but cannot be undone — that is why we say 'often'."},
      {q:"A physical change may change the shape, the size, or the...", opts:["state of matter","substance itself","number of atoms","chemical bonds"], a:0, exp:"Shape, size or state — those are the three things a physical change can alter."},
      {q:"Fireworks exploding produce light, sound, heat and gas. This tells you it is:", opts:["not a change at all","a chemical change, because those are all signs of a new substance forming","a physical change, because only the shape changed","a change of state"], a:1, exp:"Four signs of chemical change at once. And it can never be undone."}
     ]},

    {label:"📖 Leitura: Tartarugas por satélite", fixed:true,
     ctxTitle:"🐢 TARTARUGAS RASTREADAS POR SATÉLITE",
     ctxParas:["Você já se perguntou como os cientistas descobrem para onde vão as tartarugas-marinhas depois que deixam a praia onde nasceram? A resposta está em pequenos aparelhos colados na casca do animal: os transmissores de satélite.","Segundo pesquisadores brasileiros do Projeto Tamar, o equipamento tem mais ou menos o tamanho de um celular antigo e é fixado com uma resina que não machuca o animal. Cada vez que a tartaruga sobe para respirar, o aparelho envia um sinal para um satélite, que registra a posição exata no oceano.","Os dados obtidos são impressionantes. Uma fêmea marcada no litoral da Bahia percorreu mais de três mil quilômetros até a costa da África. Esses estudos incluem também o acompanhamento de espécies migratórias, como aves e baleias, a busca por espécies raras e o monitoramento das mudanças climáticas.","Com essas informações, é possível criar áreas de proteção nos trechos mais visitados pelos animais. Ou seja, um aparelho pequeno ajuda a resolver um problema enorme: proteger espécies ameaçadas de extinção."],
     questions:[
      {q:"Qual é o assunto principal do texto?", opts:["Como os cientistas usam transmissores de satélite para acompanhar tartarugas-marinhas","A história do Projeto Tamar","Como as tartarugas põem ovos na praia","A poluição dos oceanos brasileiros"], a:0, exp:"Todo o texto explica o rastreamento por satélite e para que ele serve."},
      {q:"Por que esse texto é de DIVULGAÇÃO CIENTÍFICA?", opts:["Tenta vender transmissores","Explica uma pesquisa real em linguagem simples e cita a fonte (pesquisadores do Projeto Tamar)","Expressa a opinião pessoal do autor sobre tartarugas","Conta uma história com personagens inventados"], a:1, exp:"Fato real + fonte citada + linguagem acessível = divulgação científica."},
      {q:"Quantos quilômetros percorreu a fêmea marcada na Bahia?", opts:["Menos de mil","Trinta mil","Mais de três mil","Exatamente cem"], a:2, exp:"Informação explícita no terceiro parágrafo."},
      {q:"A comparação 'mais ou menos o tamanho de um celular antigo' serve para...", opts:["mostrar que o aparelho é ultrapassado","vender celulares","deixar o texto mais longo","ajudar o leitor a imaginar o tamanho do aparelho"], a:3, exp:"Comparação com o cotidiano — recurso típico do gênero."},
      {q:"No trecho 'espécies migratórias', o adjetivo está no plural porque...", opts:["o substantivo 'espécies' está no plural e o adjetivo concorda com ele","o texto fala de vários animais diferentes","migratórias é uma palavra longa","adjetivo é sempre plural"], a:0, exp:"Concordância nominal em ação dentro do texto."},
      {q:"Em 'pesquisadores brasileiros do Projeto Tamar', o adjetivo é:", opts:["Projeto","brasileiros","pesquisadores","Tamar"], a:1, exp:"Adjetivo qualifica o substantivo: brasileiros ← pesquisadores."},
      {q:"No trecho 'os transmissores de satélite', o artigo 'os' indica que...", opts:["existe só um transmissor","são transmissores desconhecidos","são transmissores específicos, já apresentados na frase anterior","os transmissores pertencem ao leitor"], a:2, exp:"Artigo definido retoma algo já mencionado — é o 'estabelecimento de relações'."},

  {key:"social2", tri:2, label:"🌎 Social Studies", color:"#5F5E5A", lang:"en",
   subtopics:[
    {label:"🛤️ The Silk Road", fixed:true,
     questions:[
      {q:"What was the Silk Road?", opts:["A giant web of land and sea trade routes that connected Asia, the Middle East and Europe","The road between the silk factories and the capital of Ancient China","A short road covered with silk between the emperor's house and his palace","One single paved highway through central China"], a:0, exp:"Study guide: it was NOT one single road. It was a network of routes."},
      {q:"The Silk Road went from China to...", opts:["Australia","Eastern Europe, near today's Turkey and the Mediterranean Sea","the North Pole","South America"], a:1, exp:"It went along the northern borders of China, India and Persia."},
      {q:"Why was it called the Silk Road?", opts:["Because of the silk worms along the route","Because the road was made of silk","Because one of the major products traded was silk cloth from China","Because the Romans built it"], a:2, exp:"People throughout Asia and Europe prized Chinese silk for its softness and luxury."},
      {q:"What did the Romans call China?", opts:["The land of tea","The land of gold","The land of spices","The land of silk"], a:3, exp:"The Chinese sold silk for thousands of years."},
      {q:"Besides silk, what did the Chinese export?", opts:["Teas, salt, sugar, porcelain and spices","Cotton, ivory and wool","Paper money and coal","Only gold and silver"], a:0, exp:"Cotton, ivory, wool, gold and silver were IMPORTED, not exported."},
      {q:"Why was most of what was traded expensive luxury goods?", opts:["Because cheap goods did not exist","Because it was a long trip and merchants didn't have a lot of room for goods","Because the emperor ordered it","Because poor people were not allowed to trade"], a:1, exp:"Little room + long journey = only the most valuable goods were worth carrying."},
      {q:"How did merchants travel along the Silk Road?", opts:["Alone, on foot","By ship across the Atlantic","In large caravans with many guards, using camels","By train"], a:2, exp:"Traveling in a big group helped in defending from bandits."},
      {q:"Why were camels popular for transport on the Silk Road?", opts:["Because they could swim","Because they carried no weight","Because they were faster than horses","Because much of the road went through dry and harsh land"], a:3, exp:"Camels handle dry, harsh terrain well."},
      {q:"Which dynasty significantly expanded and promoted the silk trade?", opts:["The Han Dynasty, which ruled from 206 BC to 220 AD","The Ming Dynasty","The Yuan Dynasty","The Tang Dynasty"], a:0, exp:"Careful: the Han EXPANDED the trade. The peak came later, under the Yuan."},
      {q:"Under which dynasty did trade along the Silk Road reach its PEAK?", opts:["The Han Dynasty","The Yuan Dynasty, set up by Kublai Khan of the Mongols","The Zhou Dynasty","The Ming Dynasty"], a:1, exp:"The Mongols controlled a large portion of the route, so Chinese merchants could travel safely."},
      {q:"Besides goods, what else did people share along the Silk Road?", opts:["Nothing but silk","Ideas, news and inventions — like how to make paper and gunpowder","Only money","Only weapons"], a:1, exp:"Study guide, Passage 1. Culture and inventions spread along the route."},
      {q:"In 1453, what happened to the land routes?", opts:["They were opened to everyone","They were made shorter","They were paved with stone","A powerful empire closed them, making it hard and expensive for Europeans to get goods from Asia"], a:3, exp:"This is what pushed Europeans to look for a sea route."},
      {type:'fill', q:"Groups of merchants traveling together with camels were called ______.", accept:["caravans","caravan"], exp:"Word bank of the study guide."},
      {type:'fill', q:"People loved trading for ______ to make their food taste better.", accept:["spices","spice"], exp:"Word bank of the study guide."}
     ]},
    {label:"🧭 Age of Exploration & the 3 Gs", fixed:true,
     questions:[
      {q:"Why did the Age of Exploration begin?", opts:["Because the land routes were closed, so European countries looked for a sea route to Asia","Because ships were no longer needed","Because Europeans wanted to visit the North Pole","Because the Silk Road was too short"], a:0, exp:"Study guide, Passage 2."},
      {q:"What are the 3 Gs?", opts:["Gold, God and Government","Gold, God and Glory","God, Glory and Government","Gold, Grain and Glory"], a:1, exp:"The three main reasons explorers set sail."},
      {q:"Which 'G' means getting rich by trading spices and finding gold?", opts:["God","Glory","Gold","Grain"], a:2, exp:"Explorers wanted immense riches: actual gold, but also valuable spices and silk fabric."},
      {q:"Which 'G' means spreading Christianity to new places?", opts:["Gold","Glory","Grace","God"], a:3, exp:"Many European rulers and sailors wanted to teach their religion to the people they met."},
      {q:"Which 'G' stands for wanting to become famous and claim land for kings?", opts:["Glory","Greatness","Gold","God"], a:0, exp:"Quiz question of the booklet. Sailors wanted to become famous heroes."},
      {q:"By the end of the 15th century, what was changing in Europe?", opts:["The population disappeared","The population started to grow quickly and a new class of merchants emerged","Everyone stopped trading","Ships were forbidden"], a:1, exp:"Booklet page 49. The merchants wanted to buy and sell expensive products from Asia."},
      {q:"Why did people in those days use spices like pepper and cinnamon?", opts:["Because they were used as money","Because spices were cheap","Because there were no refrigerators, so they dried meat, used salt and spices to make food taste better","Because they were used to build ships"], a:2, exp:"Booklet page 49. The spices came from India."},
      {q:"Which empire controlled the overland routes in the 15th century?", opts:["The Mongol Empire","The Roman Empire","The Chinese Empire","The Turkish Empire"], a:3, exp:"That made it even more difficult for European merchants to pass through."},
      {q:"Which two European countries decided to find out if there was a sea route to India?", opts:["Spain and Portugal","England and France","Germany and Russia","Italy and Greece"], a:0, exp:"Booklet page 49."},
      {type:'fill', q:"Gold, God and Glory are known as the ______ of exploration.", accept:["3 gs","3gs","three gs","tres gs"], exp:"Word bank of the study guide."}
     ]},
    {label:"⛵ Tools for sailing", fixed:true,
     questions:[
      {q:"What did the magnetic compass show sailors?", opts:["Where the spices were","Which way was North","How deep the ocean was","How fast the ship was going"], a:1, exp:"No matter which way the ship turned, the needle always pointed North."},
      {q:"What did the needle of a compass always point to?", opts:["The Sun","South","North","East"], a:2, exp:"Quiz question of the booklet."},
      {q:"What was a caravel?", opts:["A type of compass","A kind of map","A spice from India","A new, faster ship with special triangular sails to catch the wind"], a:3, exp:"The triangular sails let it sail even when the wind was blowing against it."},
      {q:"True or False: caravels were slow ships that could not sail against the wind.", opts:["False — they were faster and their triangular sails let them sail against the wind","True — they had no sails","False — they could only sail with the wind behind","True — they were very slow"], a:0, exp:"True/False question of the booklet. The answer is FALSE."},
      {q:"What does the astrolabe measure?", opts:["The depth of the sea","The position of the sun and the stars","The weight of the cargo","The speed of the wind"], a:1, exp:"It told the captain how far north or south the ship was from home."},
      {q:"True or False: explorers used the astrolabe to look at the sun and stars.", opts:["False","True","Only at night","Only in Portugal"], a:1, exp:"True/False question of the booklet. The answer is TRUE."},
      {q:"What was the quadrant used for?", opts:["To measure the ship's weight","To store spices","To draw maps","To measure the height of Polaris, the Pole star"], a:3, exp:"Booklet page 49. It was used at sea as early as the mid 1400s."},
      {type:'fill', q:"A fast European ship with triangular sails was called a ______.", accept:["caravel"], exp:"Word bank of the study guide."}
     ]},
    {label:"🧳 Marco Polo", fixed:true,

      {q:"Who did Marco Polo travel with on his big trip?", opts:["Kublai Khan","His father and his uncle","Christopher Columbus","His mother and sister"], a:1, exp:"Marco, Niccolo and his uncle set out together."},

      {q:"How long was their entire journey?", opts:["24 years","22 years","1 year","5 years"], a:0, exp:"Booklet page 55."},
