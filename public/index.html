ria causa doença; cogumelos se veem a olho nu."}, {"q": "QUESTÃO 3 (continuação). Escolha uma frase que você marcou F e reescreva. Qual é a correção certa para \"Todas as bactérias causam doenças\"?", "opts": ["Todas as bactérias são úteis", "Nenhuma bactéria existe no solo", "Todas as bactérias são fungos", "Algumas bactérias causam doenças, mas muitas são úteis, como as que fazem iogurte e decompõem restos"], "a": 3, "exp": "Corrigir é trocar \"todas\" por \"algumas\" e explicar com um exemplo."}, {"type": "match", "q": "QUESTÃO 4. Relacione cada situação ao microrganismo ou processo responsável.", "left": ["Pão fofinho e cheio de furinhos", "Folhas com manchas cor de laranja", "Furinhos no queijo suíço", "Morangos com mofo na fruteira", "Pneumonia"], "right": ["Leveduras (fungos) fazendo fermentação", "Fungo causador da ferrugem", "Gases liberados por bactérias", "Decomposição por fungos", "Infecção causada por bactérias"], "exp": "Cada situação tem um responsável: leveduras no pão, fungos na ferrugem e no mofo, bactérias nos furinhos do queijo e na pneumonia."}, {"q": "QUESTÃO 5, parte 1. Lia e Caio estão fazendo pão. Lia misturou o fermento com leite morno e Caio com leite bem gelado. Qual é o nome do processo que faz a massa crescer?", "opts": ["Fermentação", "Decomposição", "Vacinação", "Evaporação"], "a": 0, "exp": "As leveduras fazem a fermentação e produzem o gás que faz a massa crescer."}, {"q": "QUESTÃO 5, parte 2. Na mesma situação, a massa de quem vai crescer mais rápido e por quê?", "opts": ["A de Caio, porque o frio faz as leveduras trabalharem mais", "A de Lia, porque o leite morno é mais doce", "A de Lia, porque as leveduras precisam de uma temperatura adequada para iniciar a fermentação", "As duas crescem igual, porque a temperatura não importa"], "a": 2, "exp": "A temperatura é muito importante: as leveduras precisam de temperatura adequada para começar."}, {"q": "QUESTÃO 6. Qual é um exemplo de fungo comestível?", "opts": ["Pneumonia", "Lactobacilo", "Penicilina", "Cogumelo shimeji"], "a": 3, "exp": "Cogumelos como shimeji, shitake e champignon são fungos comestíveis."}, {"q": "QUESTÃO 7. Por que o queijo suíço tem furinhos?", "opts": ["Porque as bactérias liberam gases durante a fabricação do queijo", "Porque as leveduras fazem vinho dentro dele", "Porque o queijo seca ao ar livre", "Porque os fungos azuis comem o queijo"], "a": 0, "exp": "Os furinhos aparecem pelos gases que as bactérias soltam."}, {"q": "QUESTÃO 8. Marque a alternativa FALSA.", "opts": ["Fleming descobriu a penicilina em 1928", "A penicilina é um antibiótico feito a partir de um fungo", "Fleming viu que em volta do mofo havia muitas bactérias", "A penicilina foi usada em larga escala na Segunda Guerra Mundial"], "a": 2, "exp": "Em volta do mofo não havia bactérias. Foi assim que Fleming percebeu que o mofo as bloqueava."}, {"q": "QUESTÃO 9. O que é um probiótico?", "opts": ["Um tipo de antibiótico", "Microrganismo vivo que faz bem ao equilíbrio do intestino", "Um vírus enfraquecido de vacina", "Um fungo que causa doenças"], "a": 1, "exp": "Probióticos são microrganismos vivos, como os lactobacilos de coalhada, iogurte e kefir."}, {"type": "match", "q": "QUESTÃO 10. Relacione cada alimento à explicação.", "left": ["Vinho", "Queijo suíço", "Pão", "Iogurte"], "right": ["Leveduras fazem a fermentação da uva", "Furinhos feitos por gases de bactérias", "Leveduras soltam gás carbônico e a massa cresce", "Lactobacilos transformam o açúcar do leite"], "exp": "Vinho e pão usam leveduras (fungos). Queijo suíço e iogurte usam bactérias."}, {"type": "short", "q": "DESAFIO. Explique em uma frase por que fungos e bactérias são importantes para o planeta.", "model": "Fungos e bactérias são importantes porque decompõem restos de seres vivos, e assim os nutrientes voltam ao meio ambiente para serem usados por outros seres. Além disso, ajudam a fazer alimentos e medicamentos.", "exp": "Foque na decomposição e na reciclagem dos nutrientes. Sem eles, os nutrientes não poderiam ser reaproveitados."}]}]},
  {key:"science3",tri:3,label:"Science",color:"#1D9E75",lang:"en",exam:"2026-11-11",subtopics:[{"label": "Study guide: The Microbe Marvels", "fixed": true, "ctxTitle": "The Microbe Marvels: Your Tiny Team!", "ctxParas": ["Our Invisible Houseguests. Look around you! You might spot people, trees, or even a scurrying squirrel. But did you know that the vast majority of life forms around you are completely invisible? These are microbes: minuscule organisms that are only detectable with a microscope.", "Microbes are truly global citizens. They inhabit the water you drink, the food you eat, and the air you breathe. As you read this, trillions of microbes are calling your belly and skin their home! They live, feed, and reproduce right there on and within your body. But don't fret! Most of these tiny residents are friendly, not \"germs.\" In fact, many are essential for your well-being.", "A World of Habitats Within You. Your body is a bustling metropolis for various microbes. While fungi and viruses are present, bacteria are the most common inhabitants. Each part of your body offers a unique environment, attracting specific types of microbes. From the intricate folds of your gut to the delicate lining of your mouth and even your brain, different microbe communities thrive, finding the perfect combination of shelter, moisture, and nutrients they need to grow.", "Your Body's Best Buds. Imagine shaking hands or opening a door: you might pick up harmful microbes, known as pathogens. Luckily, your resident friendly bacteria often act as your personal security guards, fighting off these unwelcome guests. However, using hand sanitizer can unfortunately clear out many of these helpful bacteria, giving pathogens a better chance. This is why washing your hands with good old soap and water is often the better choice. It washes away most pathogens, and while some good bacteria are also swept away, they quickly re-establish themselves in their rightful place.", "Beyond hand-to-hand combat, microbes are tirelessly working throughout your body. They bolster your defenses against pathogens, assist in digesting your food, manufacture crucial vitamins, and even contribute to your brain's healthy function!"], "questions": [{"type": "match", "q": "Match each term to its correct definition.", "left": ["Pathogen", "Bacteria", "Microbe"], "right": ["A harmful microbe that can make you sick", "The most common type of microbe found in your body", "A tiny organism that is invisible without a microscope"], "exp": "A microbe is any tiny organism you need a microscope to see. Pathogens are the harmful ones. Bacteria are the most common microbes in your body."}, {"type": "fill", "q": "Microbes live everywhere, including the ______ you drink.", "accept": ["water"], "exp": "The text says microbes inhabit the water you drink, the food you eat and the air you breathe."}, {"type": "fill", "q": "Microbes live everywhere, including the ______ you eat.", "accept": ["food"], "exp": "Microbes are in water, food and air. Most of them are friendly."}, {"type": "fill", "q": "Different microbes live in different parts of your body. Write one place from the text (for example your skin).", "accept": ["gut", "belly", "skin", "mouth", "brain", "stomach"], "exp": "The text names your gut (belly), skin, mouth and even your brain as habitats for different microbe communities."}, {"q": "Which of the following is NOT a type of microbe mentioned as living in your body?", "opts": ["Fungi", "Plants", "Viruses", "Bacteria"], "a": 1, "exp": "The text names bacteria, fungi and viruses. Plants are not microbes: they are big, and you can see them without a microscope."}, {"q": "What do microbes need to grow and thrive in your body?", "opts": ["Sunlight, warmth and oxygen", "Sand, air and water", "Dirt, sugar and protein", "Shelter, moisture and nutrients"], "a": 3, "exp": "Each body part gives microbes the perfect mix of shelter, moisture and nutrients."}, {"q": "What is one important way helpful microbes contribute to your health?", "opts": ["They help you digest food", "They make you sleep better", "They change your eye color", "They make you taller"], "a": 0, "exp": "Helpful microbes bolster your defenses, help digest food and make vitamins."}, {"q": "Why is washing your hands with soap and water often better than using hand sanitizer?", "opts": ["Sanitizer is made of bacteria", "Soap kills every single microbe on your body", "Soap and water wash away most pathogens, and the good bacteria quickly come back", "Water makes helpful bacteria stronger"], "a": 2, "exp": "Sanitizer can clear out many helpful bacteria, which gives pathogens a better chance. With soap and water, pathogens wash away and the good bacteria re-establish themselves."}, {"type": "vf", "q": "Read each statement. Choose True or False.", "items": [{"t": "Most bacteria are dangerous and always make us sick.", "v": false}, {"t": "There are no bacteria found in our food.", "v": false}, {"t": "Fungi obtain their food by decomposing matter or acting as parasites.", "v": true}, {"t": "Viruses are large particles that can easily infect animals and plants.", "v": false}, {"t": "Protozoa are organisms that belong to the biological kingdom Protista.", "v": true}, {"t": "An infectious disease is any illness caused only by bacteria.", "v": false}], "exp": "Most bacteria are harmless or helpful and some are used to make food. Fungi decompose matter or live as parasites. Viruses are very small. Protozoa are protists. Infectious diseases can come from viruses, bacteria, parasites or fungi."}, {"type": "multi", "q": "Which of these things do helpful microbes do in your body? Choose all the correct ones.", "opts": ["Help fight off pathogens", "Make crucial vitamins", "Change the color of your eyes", "Help you digest your food"], "answers": [0, 1, 3], "exp": "The text says microbes bolster your defenses, help digest food, manufacture vitamins and help the brain work well. Eye color is not on the list."}, {"type": "fill", "q": "Unscramble the letters to form a word related to microbes: MOCIBERS", "accept": ["microbes", "microbe"], "exp": "MOCIBERS = MICROBES, the tiny organisms you can only see with a microscope."}, {"type": "fill", "q": "Unscramble the letters to form a word related to microbes: RATEBCIA", "accept": ["bacteria"], "exp": "RATEBCIA = BACTERIA, the most common microbes in your body."}, {"type": "fill", "q": "Unscramble the letters to form a word related to microbes: TOORZPOA", "accept": ["protozoa"], "exp": "TOORZPOA = PROTOZOA, tiny single-celled organisms that live mostly in water."}, {"type": "short", "q": "Explain two ways microbes help your body.", "model": "They help digest food and make vitamins. They also fight off harmful pathogens and bolster our defenses.", "exp": "Pick two jobs from the text: digesting food, making vitamins, fighting pathogens or helping the brain."}]}, {"label": "Bacteria", "fixed": true, "questions": [{"q": "Bacteria come in different shapes. Which shape is NOT a bacteria shape?", "opts": ["Rods", "Spirals", "Cubes", "Spheres"], "a": 2, "exp": "Bacteria can be rods, spirals or spheres. Cubes are not on the list."}, {"q": "Some bacteria \"swim\" using long tails. What are these tails called?", "opts": ["Flagella", "Antibiotics", "Tissue", "Pathogens"], "a": 0, "exp": "Flagella are long tails that help some bacteria swim around."}, {"type": "fill", "q": "Disease-causing bacteria are called ______.", "accept": ["pathogens", "pathogen"], "exp": "A pathogen is a germ that makes us sick. Most bacteria are not pathogens."}, {"q": "Why do we need a microscope to see bacteria?", "opts": ["Because they hide under the soil", "Because they are made of glass", "Because they only come out at night", "Because they are too small to see with our eyes alone"], "a": 3, "exp": "Bacteria are so small that we can't see them without a microscope, even though they are all around us."}, {"type": "classify", "q": "Are these bacteria helpful or harmful? Choose the right one.", "cats": ["Helpful", "Harmful"], "items": [{"t": "Making yogurt and cheese", "c": 0}, {"t": "Causing tetanus", "c": 1}, {"t": "Breaking down dead plants in the soil", "c": 0}, {"t": "Causing typhoid fever", "c": 1}, {"t": "Helping us digest food", "c": 0}, {"t": "Causing pneumonia", "c": 1}], "exp": "Helpful bacteria make foods, help our digestion and clean the soil. Pathogens cause diseases like tetanus, typhoid fever and pneumonia."}, {"q": "What are decomposers?", "opts": ["Bacteria that cause tetanus", "Bacteria that break down dead plants and animals", "Long tails used for swimming", "Soap that kills germs"], "a": 1, "exp": "Decomposers break down material from dead plants and animals. This helps to create soil and get rid of dead tissue."}, {"q": "Which one of these foods uses bacteria during its preparation?", "opts": ["Fresh fruit", "White bread", "Pasteurized milk", "Yogurt"], "a": 3, "exp": "Bacteria are used to make foods like yogurt, cheese, pickles and soy sauce."}, {"type": "vf", "q": "Read each statement. Choose True or False.", "items": [{"t": "Most bacteria are not dangerous.", "v": true}, {"t": "Bacteria are found only inside hospitals.", "v": false}, {"t": "Antibiotics help fight off bad bacteria.", "v": true}, {"t": "Bacteria live in the air, on our skin and in the ground.", "v": true}, {"t": "Bacteria are never found inside our bodies.", "v": false}], "exp": "Bacteria are everywhere: air, skin, ground and inside our bodies. Most are harmless. Antibiotics help against the bad ones."}, {"type": "multi", "q": "Which of these foods are made with the help of bacteria? Choose all the correct ones.", "opts": ["Cheese", "Pickles", "Fresh apples", "Soy sauce"], "answers": [0, 1, 3], "exp": "The text lists yogurt, cheese, pickles and soy sauce. A fresh apple is just fruit."}, {"q": "What do we use to keep wounds clean of bacteria?", "opts": ["Antiseptics", "Flagella", "Decomposers", "Spirals"], "a": 0, "exp": "Antiseptics keep wounds clean. Antibiotics and antibiotic soap help keep bad pathogens off."}, {"q": "A student says: \"All bacteria are germs that make us sick.\" What is the best correction?", "opts": ["It is correct: every bacterium is dangerous", "Only a small group, the pathogens, make us sick. Most bacteria are harmless or helpful", "Bacteria are not living things", "Only bacteria in the soil can make us sick"], "a": 1, "exp": "Many bacteria help us (digestion, food, soil). Only the pathogens cause disease."}, {"type": "short", "q": "Explain two ways that \"good\" bacteria help human beings.", "model": "Good bacteria help us digest and break down our food. They also help our immune system protect us from organisms that can make us sick.", "exp": "The text says bacteria help to digest food and help the immune system protect us. They are also used to make foods like yogurt and cheese."}]}, {"label": "Viruses", "fixed": true, "questions": [{"q": "Why do many scientists wonder if viruses are alive?", "opts": ["Because they are bigger than bacteria", "Because they live only in water", "Because they have no cells and cannot survive or reproduce on their own", "Because they can swim"], "a": 2, "exp": "Unlike bacteria, fungi and protozoa, viruses do not have cells and cannot reproduce on their own, so scientists debate if they are alive."}, {"q": "What does a virus need to do to make copies of itself?", "opts": ["Enter a living host cell", "Stay on a dry table", "Eat bacteria", "Live in the air"], "a": 0, "exp": "A virus is like a tiny hijacker. It must enter the body of a living host and take over its healthy cells."}, {"type": "fill", "q": "Viruses are much ______ than bacteria.", "accept": ["smaller", "tinier"], "exp": "Viruses are much, much smaller than bacteria. You can't even see them with a normal microscope."}, {"type": "vf", "q": "Read each statement. Choose True or False.", "items": [{"t": "You can see viruses with a normal microscope.", "v": false}, {"t": "Viruses can have different shapes, like balls and rods.", "v": true}, {"t": "Viruses can live and grow on their own.", "v": false}, {"t": "Antibiotics work against viruses.", "v": false}, {"t": "Viruses can be passed on by insect bites.", "v": true}], "exp": "Viruses are incredibly small and need a living cell to make more viruses. Antibiotics work against bacteria, not viruses."}, {"q": "How do vaccines (like the flu shot) protect us against viruses?", "opts": ["They kill the virus immediately on contact with skin", "They clean the air and water around us", "They help our bodies develop their own defenses called antibodies", "They act as antibiotics"], "a": 2, "exp": "A vaccine teaches your immune system to recognize the virus, so your body builds antibodies."}, {"type": "order", "q": "Put the steps in the right order to show how a vaccine protects you.", "items": ["You get a vaccine made from a dead or weakened virus", "Your immune system learns to recognize the virus", "Your body builds antibodies", "If the real virus attacks later, your immune system knows how to defeat it"], "exp": "A vaccine is a practice round: the immune system learns first, then it is ready for the real virus."}, {"q": "Which of the following is NOT a way viruses can spread?", "opts": ["Floating through the air when someone sneezes", "Shaking hands with someone who is sick", "Insect bites or contact with animals", "Staying alone in a clean, closed room"], "a": 3, "exp": "Viruses travel through the air, water, touch, food, insects and animals. Staying alone in a clean room is not a way they spread."}, {"type": "match", "q": "Match each word to its meaning.", "left": ["Vaccine", "Antibodies", "Host", "Antibiotics"], "right": ["Helps the immune system learn to recognize a virus", "Special proteins the body builds to fight the virus", "The living body a virus enters to make copies", "Medicine that does not work against viruses"], "exp": "A host is the living thing a virus uses. Vaccines train the immune system to make antibodies. Antibiotics only work on bacteria."}, {"q": "Which habits help strengthen your immune system to fight off viruses?", "opts": ["Staying up all night", "Getting plenty of sleep and exercise", "Never going outside", "Eating only candy"], "a": 1, "exp": "Sleep and exercise help strengthen your immune system. It is the body's own defense against viruses."}, {"q": "A virus is on a table, far from any living cell. What will it most likely do?", "opts": ["Grow bigger on its own", "Nothing: it cannot grow or reproduce without a living host cell", "Make copies of itself", "Eat dust and multiply"], "a": 1, "exp": "Viruses cannot live or grow on their own. They need to get inside a living cell to survive and make more viruses."}, {"q": "Antibiotics do not work against viruses. Why not?", "opts": ["Because viruses are too big", "Because viruses live inside plants only", "Because antibiotics are made of viruses", "Because viruses are different from bacteria"], "a": 3, "exp": "Antibiotics are for bacteria. Against dangerous viruses, our best defense is vaccination."}, {"type": "short", "q": "How do viruses reproduce and take over a host body?", "model": "A virus enters a living cell and injects its genetic material. Then it uses the cell to make more viruses and goes on to take over more cells.", "exp": "Remember the hijacker: the virus gets into a cell, takes it over and makes copies."}]}, {"label": "Fungi", "fixed": true, "questions": [{"q": "Fungi are a group of living organisms that are NOT...", "opts": ["Alive", "Found on land", "Animals, plants or bacteria", "Decomposers"], "a": 2, "exp": "Fungi are their own group of organisms. They are not animals, plants or bacteria."}, {"q": "How do fungi get their food?", "opts": ["By decomposing matter or eating off their hosts as parasites", "By photosynthesis", "By hunting animals", "By drinking sunlight"], "a": 0, "exp": "Fungi do not make their own food like plants do. They decompose matter or act as parasites."}, {"type": "fill", "q": "Fungi do not have ______ like plants.", "accept": ["chlorophyll"], "exp": "Chlorophyll is the green substance plants use to make food with sunlight. Fungi do not have it."}, {"type": "vf", "q": "Read each statement. Choose True or False.", "items": [{"t": "Fungi reproduce through spores.", "v": true}, {"t": "Fungi can actively move around.", "v": false}, {"t": "Fungi make their own food through photosynthesis.", "v": false}, {"t": "All fungi are microscopic.", "v": false}, {"t": "Fungi love warm, wet and dark places.", "v": true}], "exp": "Fungi use spores, stay in one place and cannot do photosynthesis. Some are microscopic (yeasts, molds) and some are big (mushrooms)."}, {"type": "match", "q": "Match each fungus to its description.", "left": ["Mushroom", "Mold", "Yeast"], "right": ["The fruiting body of a fungus; some are very poisonous", "Forms on old fruit, bread and cheese and can look furry", "Makes bread dough rise"], "exp": "Never eat a mushroom you find in the woods. Mold grows on old food and yeast is used when baking."}, {"type": "classify", "q": "Is this fungus role helpful or harmful?", "cats": ["Helpful", "Harmful"], "items": [{"t": "Yeast making bread rise", "c": 0}, {"t": "Mold spoiling a loaf of bread", "c": 1}, {"t": "Making the antibiotic penicillin", "c": 0}, {"t": "Athlete's foot infection", "c": 1}, {"t": "Decomposing dead wood and leaves", "c": 0}, {"t": "A poisonous mushroom in the woods", "c": 1}], "exp": "Fungi are helpful as food, medicine and recyclers. They can be harmful when they spoil food, infect skin or are poisonous."}, {"q": "What does yeast do to bread dough?", "opts": ["It creates bubbles of carbon dioxide that make the dough rise and become soft", "It makes the dough harder", "It turns the dough into soil", "It kills all bacteria in it"], "a": 0, "exp": "Yeast feeds on the sugar in dough and makes tiny bubbles of carbon dioxide. The bubbles get trapped and the dough rises."}, {"q": "Why are fungi called nature's great recyclers?", "opts": ["They turn plastic into paper", "They clean the air with chlorophyll", "They break down dead wood, leaves and organic matter, and return nutrients to the soil", "They make bread rise"], "a": 2, "exp": "Along with bacteria, fungi decompose dead things so that the soil is rich again and new plants can grow."}, {"q": "Which medicine is made by a fungus?", "opts": ["Hand soap", "Penicillin", "Sanitizer", "The flu shot"], "a": 1, "exp": "Some fungi make antibiotics like penicillin and cephalosporin that kill bacteria."}, {"type": "multi", "q": "Which of these are types of fungi? Choose all the correct ones.", "opts": ["Mushrooms", "Mold", "Viruses", "Yeast"], "answers": [0, 1, 3], "exp": "Mushrooms, molds and yeasts are fungi. Viruses are a different group of microbes."}, {"q": "A loaf of bread was left out for many days and now has fuzzy green patches. What happened?", "opts": ["The bread learned to photosynthesize", "A virus made the bread rise again", "The bread became a mushroom", "Mold, a fungus, grew on the bread and spoiled it"], "a": 3, "exp": "Microscopic molds can grow on bread left out too long. Keeping spaces dry and clean helps prevent fungi."}, {"type": "short", "q": "How do fungi obtain their food, and how is that different from plants?", "model": "Fungi get food by decomposing matter or eating off their hosts as parasites. Plants make their own food with chlorophyll, but fungi do not have chlorophyll.", "exp": "Fungi do not have chlorophyll, so they cannot make food like plants. They take food from dead matter or from a host."}]}, {"label": "Protozoa", "fixed": true, "questions": [{"q": "How many cells are protozoa made of?", "opts": ["Many cells organized into tissues", "Exactly two cells", "No cells at all", "Only a single cell"], "a": 3, "exp": "Protozoa are single-celled organisms, but their cell is more complex than a bacterium's."}, {"q": "Where do most protozoa prefer to live?", "opts": ["Dry desert environments", "Wet places like freshwater, oceans and puddles", "High in the air", "On dry metal surfaces"], "a": 1, "exp": "Most protozoa live in aquatic environments: puddles, ponds, lakes, oceans and damp soil."}, {"q": "What do most protozoa use to move?", "opts": ["Flagella, cilia or pseudopodia", "Wings", "Wheels", "Roots"], "a": 0, "exp": "Most protozoa species have flagella, cilia or pseudopodia, which help in their movement."}, {"type": "fill", "q": "Protozoa belong to a diverse group of organisms called ______.", "accept": ["protists", "protist", "protista"], "exp": "Protozoa are protists. Unlike bacteria, they have a more complex cell structure."}, {"type": "vf", "q": "Read each statement. Choose True or False.", "items": [{"t": "Protozoa are made of many cells.", "v": false}, {"t": "Most protozoa live in wet environments.", "v": true}, {"t": "Protozoa eat bacteria and other tiny particles.", "v": true}, {"t": "All protozoa are harmful.", "v": false}, {"t": "Some protozoa can make people sick if they drink untreated water.", "v": true}], "exp": "Protozoa are single-celled and eat bacteria and tiny particles. Most are harmless but some are pathogens."}, {"q": "Which of the following diseases is NOT caused by protozoa?", "opts": ["Malaria", "Giardiasis", "Influenza (the flu)", "Toxoplasmosis"], "a": 2, "exp": "Malaria, giardiasis, amoebiasis and toxoplasmosis are caused by protozoa. The flu is caused by a virus."}, {"q": "What is a parasite?", "opts": ["A tiny animal that lives in outer space", "A living thing that lives on or inside another living thing (the host) and can cause harm", "A machine used to see microbes", "A food that has bacteria"], "a": 1, "exp": "Many protozoa are parasites. Their host can be a human."}, {"q": "Why are protozoa important in aquatic food webs?", "opts": ["They eat bacteria and tiny particles, and larger water animals eat them, passing energy on", "They make the water colder", "They stop plants from growing", "They turn the water into soil"], "a": 0, "exp": "Protozoa are consumers. They are eaten by slightly larger water animals, which keeps the energy moving in the ecosystem."}, {"type": "multi", "q": "In which ways can protozoa spread to humans? Choose all the correct ones.", "opts": ["Contaminated food or water", "Insect bites", "Close contact with an infected person or animal", "Reading a book"], "answers": [0, 1, 2], "exp": "The text lists contaminated food or water, insect bites and direct contact."}, {"q": "Why do governments work hard to build clean water systems?", "opts": ["So that protozoa have more water to live in", "To make the water taste like soap", "Because clean water has no minerals", "So people do not drink water with harmful microbes that can make them very sick"], "a": 3, "exp": "Some harmful protozoa can live in untreated water. Safe, clean water keeps communities healthy."}]}, {"label": "Infectious diseases", "fixed": true, "questions": [{"q": "What is an infectious disease?", "opts": ["Any disease caused only by eating too much", "A disease only found in plants", "Any disease caused by a pathogen such as a virus, bacterium, parasite or fungus", "A disease that cannot be passed on"], "a": 2, "exp": "An infectious disease comes from a pathogen (germ). People, animals and plants can all get one."}, {"type": "fill", "q": "\"Pathogen\" is the scientific name for ______.", "accept": ["germ", "germs"], "exp": "Pathogens are tiny microorganisms that invade the body and make it sick."}, {"type": "classify", "q": "Which pathogen causes each disease?", "cats": ["Virus", "Bacteria", "Parasite", "Fungus"], "items": [{"t": "Influenza", "c": 0}, {"t": "Tuberculosis", "c": 1}, {"t": "Malaria", "c": 2}, {"t": "Ringworm", "c": 3}, {"t": "Measles", "c": 0}, {"t": "Tetanus", "c": 1}, {"t": "Sleeping sickness", "c": 2}, {"t": "Thrush", "c": 3}], "exp": "Viruses: influenza, common cold, measles, yellow fever, hepatitis. Bacteria: tuberculosis, cholera, typhoid fever, tetanus. Parasites: malaria, sleeping sickness, scabies. Fungi: fungal meningitis, ringworm, thrush."}, {"type": "multi", "q": "Which of these are ways infectious diseases can be transmitted? Choose all the correct ones.", "opts": ["Food and water contamination", "Insect bites", "Direct contact, like shaking hands", "Looking at a picture"], "answers": [0, 1, 2], "exp": "Infectious diseases travel through contaminated food and water, insect bites, direct contact and the air when someone sneezes."}, {"q": "When your mom says to wash your hands, what does she want?", "opts": ["To make your hands cold", "To get the pathogens off your hands so they will not go into your mouth and body", "To remove the color of your skin", "To kill all the good bacteria forever"], "a": 1, "exp": "Hand washing removes pathogens before they can get into your body."}, {"type": "vf", "q": "Read each statement. Choose True or False.", "items": [{"t": "Only people can get an infectious disease.", "v": false}, {"t": "Viruses, bacteria, parasites and fungi can all be pathogens.", "v": true}, {"t": "Tetanus is caused by bacteria.", "v": true}, {"t": "Ringworm is caused by a fungus.", "v": true}, {"t": "Malaria is caused by a virus.", "v": false}], "exp": "Animals, plants and microorganisms can also get infectious diseases. Tetanus is bacterial, ringworm is fungal and malaria is caused by a parasite."}, {"type": "match", "q": "Match each kind of pathogen to a disease it causes.", "left": ["Virus", "Bacteria", "Parasite", "Fungus"], "right": ["Yellow fever", "Typhoid fever", "Malaria", "Fungal meningitis"], "exp": "Different pathogens cause different diseases. Knowing the pathogen helps doctors choose the right treatment."}, {"q": "A doctor finds that an illness is caused by bacteria. Which medicine is most likely to help?", "opts": ["No medicine ever", "Only a vaccine", "A hand sanitizer", "Antibiotics"], "a": 3, "exp": "Antibiotics help fight bad bacteria. They do not work on viruses."}, {"q": "Why does a doctor NOT give antibiotics for the flu?", "opts": ["The flu is caused by a virus, and antibiotics work against bacteria", "The flu is caused by a protozoan", "Antibiotics only work on plants", "The flu is not a real disease"], "a": 0, "exp": "Antibiotics are the wrong tool for viruses. The flu shot and a strong immune system help instead."}, {"type": "short", "q": "Name two ways to protect yourself from pathogens.", "model": "Wash your hands with soap and water, get vaccines, sleep and exercise to keep your immune system strong. Keeping spaces clean and dry also helps.", "exp": "Hand washing, vaccines, sleep and exercise, and clean and dry spaces are all ways the text mentions to avoid pathogens."}]}, {"label": "Full exam (all topics)", "fixed": true, "questions": [{"type": "match", "q": "Match each microbe to its description.", "left": ["Bacteria", "Virus", "Fungi", "Protozoa"], "right": ["Simple single-celled organisms, some helpful and some harmful", "Needs a living host cell to make copies of itself", "Mushrooms, molds and yeast", "Single-celled organisms that mostly live in water"], "exp": "Each microbe group has its own traits. Bacteria are single-celled, viruses need hosts, fungi include mushrooms, mold and yeast, and protozoa live mostly in water."}, {"type": "fill", "q": "Unscramble the letters to form a word related to microbes: RIVUS", "accept": ["virus"], "exp": "RIVUS = VIRUS, a tiny particle that needs a host cell to make copies."}, {"type": "fill", "q": "Unscramble the letters to form a word related to microbes: GUNFI", "accept": ["fungi"], "exp": "GUNFI = FUNGI, the group that includes mushrooms, molds and yeast."}, {"q": "What tool do you need to see microbes?", "opts": ["A telescope", "A thermometer", "A microscope", "A magnet"], "a": 2, "exp": "Microbes are so small that you can only see them with a microscope."}, {"type": "classify", "q": "Which microbe group does each clue describe?", "cats": ["Bacteria", "Virus", "Fungi", "Protozoa"], "items": [{"t": "Used to make yogurt and cheese", "c": 0}, {"t": "Needs a host cell to copy itself", "c": 1}, {"t": "Yeast, mold and mushrooms", "c": 2}, {"t": "Lives in ponds and eats bacteria", "c": 3}, {"t": "Measles and the common cold", "c": 1}, {"t": "Rods, spirals and spheres", "c": 0}, {"t": "Flagella, cilia or pseudopodia", "c": 3}, {"t": "Reproduces with spores", "c": 2}], "exp": "Bacteria make foods and come in rods, spirals and spheres. Viruses need hosts. Fungi use spores. Protozoa live in water and move with flagella, cilia or pseudopodia."}, {"type": "vf", "q": "Read each statement. Choose True or False.", "items": [{"t": "Most microorganisms are helpful.", "v": true}, {"t": "Viruses are bigger than bacteria.", "v": false}, {"t": "Fungi make their own food by photosynthesis.", "v": false}, {"t": "Protozoa are single-celled.", "v": true}, {"t": "Antibiotics work against viruses.", "v": false}], "exp": "Most microbes are helpful. Viruses are much smaller than bacteria. Fungi have no chlorophyll. Antibiotics are for bacteria."}, {"q": "Why is washing your hands with soap and water often a better choice than sanitizer?", "opts": ["It kills all bacteria forever", "It makes your hands bigger", "It washes away most pathogens, and the good bacteria quickly come back", "It turns pathogens into helpful microbes"], "a": 2, "exp": "Sanitizer can clear out many helpful bacteria and give pathogens a better chance."}, {"type": "order", "q": "Put the steps in the right order to show how yeast makes bread rise.", "items": ["Yeast feeds on the sugar in the dough", "It creates tiny bubbles of carbon dioxide", "The bubbles get trapped in the dough", "The dough rises and becomes soft and fluffy"], "exp": "Yeast is a fungus that ferments the sugar in dough. The gas bubbles make the bread fluffy."}, {"type": "multi", "q": "Which statements about fungi are true? Choose all the correct ones.", "opts": ["They reproduce through spores", "They cannot actively move around", "They make food using chlorophyll", "They can decompose dead wood and leaves"], "answers": [0, 1, 3], "exp": "Fungi use spores, stay in place and decompose dead things. They do not have chlorophyll."}, {"q": "What are decomposers?", "opts": ["Living things that break down dead plants and animals and return nutrients to the soil", "Animals that eat only plants", "Medicines that kill viruses", "Microscopes used in science class"], "a": 0, "exp": "Bacteria and fungi are nature's clean-up crew. They return healthy nutrients to the soil."}, {"q": "Which of these microbes can antibiotics help fight?", "opts": ["Viruses", "Protozoa and viruses only", "All microbes the same way", "Harmful bacteria"], "a": 3, "exp": "Antibiotics work against bacteria. Viruses need vaccines and the immune system."}, {"q": "Which sentence about viruses and bacteria is correct?", "opts": ["Bacteria are smaller than viruses and need a host cell", "Viruses are much smaller than bacteria and need a living host cell to make copies", "Both are large enough to see without a microscope", "Viruses can live and grow on their own like bacteria"], "a": 1, "exp": "A virus cannot reproduce by itself, while a bacterium is a single-celled living organism."}, {"q": "What is a pathogen?", "opts": ["A tool used to see microbes", "A kind of antibiotic", "A helpful decomposer", "A microbe that causes disease"], "a": 3, "exp": "A pathogen is a germ that invades the body and makes it sick."}, {"q": "Which disease is caused by a protozoan parasite?", "opts": ["Malaria", "Measles", "Tetanus", "Ringworm"], "a": 0, "exp": "Malaria, giardiasis, amoebiasis and toxoplasmosis are protozoan. Measles is viral, tetanus is bacterial and ringworm is fungal."}, {"type": "short", "q": "Explain in your own words the difference between a helpful microbe and a pathogen.", "model": "A helpful microbe benefits us or nature, for example by digesting food, making yogurt, or decomposing dead plants. A pathogen is a harmful microbe that makes us sick.", "exp": "Helpful microbes do good jobs (digestion, food, soil). Pathogens cause infectious diseases."}]}]},
  {key:"portugues3",tri:3,label:"Língua Portuguesa",color:"#D4537E",lang:"pt",exam:"2026-11-12",subtopics:[{"label": "Lendas brasileiras", "fixed": true, "context": "A lenda do Curupira\n\nContam os moradores das florestas do Brasil que, há muito tempo, vive entre as árvores um menino de cabelos vermelhos como fogo. O nome dele é Curupira e ele tem uma característica muito estranha: seus pés são virados para trás.\n\nQuando um caçador entra na mata para caçar animais sem necessidade, o Curupira aparece. Ele dá assobios e faz o caçador se perder. Quem tenta seguir as pegadas do Curupira anda em círculos, porque elas apontam para o lado contrário.\n\nDizem que um caçador, certa vez, ficou três dias rodando pela mesma trilha. Cansado e assustado, ele prometeu que nunca mais caçaria mais do que precisava. Só então encontrou o caminho de volta.\n\nAté hoje, os mais velhos contam essa história aos netos para lembrar que a floresta e os animais devem ser respeitados.", "questions": [{"q": "QUESTÃO 1. A que gênero textual pertence o texto \"A lenda do Curupira\"?", "opts": ["Lenda", "Notícia de jornal", "Receita culinária", "Carta pessoal"], "a": 0, "exp": "O texto conta uma história popular com um ser fantástico do folclore. É uma lenda."}, {"q": "QUESTÃO 2. Quem é o Curupira?", "opts": ["Um caçador que mora na mata", "Um menino comum que vive na cidade", "Um animal que assobia", "Um ser do folclore que protege a floresta"], "a": 3, "exp": "O Curupira é um personagem fantástico do folclore brasileiro, que protege a floresta e os animais."}, {"type": "fill", "q": "QUESTÃO 3. As lendas são histórias populares passadas de geração em geração, geralmente de forma ______ (de boca em boca).", "accept": ["oral", "oralmente", "falada"], "exp": "Lendas nascem da tradição oral: as pessoas contam umas às outras, e por isso o autor não é conhecido."}, {"q": "QUESTÃO 4. Qual expressão do começo do texto mostra que a história é muito antiga?", "opts": ["\"três dias\"", "\"há muito tempo\"", "\"cabelos vermelhos\"", "\"até hoje\""], "a": 1, "exp": "Lendas costumam começar com expressões como \"há muito tempo\", que deixam o tempo da história indefinido."}, {"q": "QUESTÃO 5. No trecho \"ficou três dias rodando pela mesma trilha\", a palavra \"trilha\" significa:", "opts": ["Caminho estreito dentro da mata", "Lugar com muita água", "Casa de madeira", "Tipo de animal"], "a": 0, "exp": "Trilha é um caminho estreito. O sentido aparece pelo contexto: ele anda pela mata e se perde."}, {"q": "QUESTÃO 6. Por que quem segue as pegadas do Curupira se perde?", "opts": ["Porque ele apaga as pegadas com folhas", "Porque ele voa e não deixa pegadas", "Porque a mata é muito escura", "Porque os pés dele são virados para trás e as pegadas apontam para o lado contrário"], "a": 3, "exp": "A característica estranha do Curupira, os pés virados para trás, faz as pegadas apontarem para o lado contrário."}, {"type": "order", "q": "QUESTÃO 7. Coloque os acontecimentos na ordem em que aparecem no texto.", "items": ["O caçador entra na mata para caçar animais sem necessidade", "O Curupira aparece e assobia", "O caçador roda três dias pela mesma trilha", "O caçador promete caçar só o necessário e acha o caminho de volta"], "exp": "Primeiro o caçador entra, depois o Curupira age, o caçador se perde e, por fim, faz a promessa."}, {"type": "vf", "q": "QUESTÃO 8. Marque Verdadeiro (V) ou Falso (F).", "items": [{"t": "O Curupira tem os pés virados para trás.", "v": true}, {"t": "O Curupira ajuda os caçadores a caçarem mais animais.", "v": false}, {"t": "O caçador ficou perdido por apenas um dia.", "v": false}, {"t": "Os mais velhos contam a história aos netos para ensinar a respeitar a natureza.", "v": true}], "exp": "O caçador ficou três dias perdido. O Curupira não ajuda quem caça sem necessidade: ele protege a floresta."}, {"q": "QUESTÃO 9. Marque a alternativa INCORRETA sobre as lendas.", "opts": ["Elas passam de geração em geração", "O autor da lenda é sempre conhecido e assina a história", "Elas misturam realidade e fantasia", "Elas têm seres fantásticos do folclore como personagens"], "a": 1, "exp": "Cuidado com INCORRETA! Em lendas o autor é desconhecido, porque a história nasceu na boca do povo."}, {"type": "classify", "q": "QUESTÃO 10. Lenda ou notícia de jornal? Classifique cada característica.", "cats": ["Lenda", "Notícia de jornal"], "items": [{"t": "Mistura realidade e fantasia", "c": 0}, {"t": "Conta fatos reais que aconteceram há pouco tempo", "c": 1}, {"t": "Tem seres do folclore como personagens", "c": 0}, {"t": "Cita data, local e fontes de informação", "c": 1}, {"t": "O autor é desconhecido e a história passa de boca em boca", "c": 0}], "exp": "Lenda é popular, com fantasia e autor desconhecido. Notícia informa fatos reais, com data, local e fonte."}, {"q": "QUESTÃO 11. Qual é a mensagem (o ensinamento) da lenda?", "opts": ["Devemos sempre andar com os pés virados", "Os caçadores são muito corajosos", "Devemos respeitar a floresta e os animais, caçando só o necessário", "Quem entra na mata sempre ganha um prêmio"], "a": 2, "exp": "A lenda explica e ensina: o Curupira castiga quem caça sem necessidade para lembrar o respeito à natureza."}, {"q": "QUESTÃO 12. Qual destes seres faz parte do folclore brasileiro?", "opts": ["Papai Noel", "Super-Homem", "Dragão de Natal", "Saci-pererê"], "a": 3, "exp": "Saci, Curupira, Iara, Boitatá e Mula sem cabeça são seres do folclore brasileiro."}, {"q": "QUESTÃO 13. A frase \"Contam os moradores das florestas\" mostra que:", "opts": ["A história foi inventada por um cientista", "A história vem da tradição oral das pessoas que vivem ali", "A história foi publicada em um jornal ontem", "A história é um relato de um caçador famoso"], "a": 1, "exp": "\"Contam\" indica que as pessoas passam a história de uns para os outros, como em toda lenda."}, {"type": "short", "q": "QUESTÃO 14. Por que o Curupira aparece para o caçador? Explique com informações do texto.", "model": "O Curupira aparece porque o caçador entrou na mata para caçar animais sem necessidade. Ele protege a floresta e faz o caçador se perder para ensinar a respeitar a natureza.", "exp": "Use PORQUE e uma informação do texto: o caçador caçou sem necessidade e o Curupira protege a floresta."}]}, {"label": "Verbos e conjugações", "fixed": true, "questions": [{"q": "O verbo é a palavra que indica:", "opts": ["Somente o nome das coisas", "Somente as características das pessoas", "Ação, estado ou fenômeno da natureza", "Somente lugares"], "a": 2, "exp": "Verbo = ação (correr), estado (estar, ser) ou fenômeno da natureza (chover)."}, {"type": "classify", "q": "Ação, estado ou fenômeno da natureza? Classifique o verbo de cada frase.", "cats": ["Ação", "Estado", "Fenômeno da natureza"], "items": [{"t": "As crianças brincaram no parque.", "c": 0}, {"t": "Eu sou observadora.", "c": 1}, {"t": "Choveu muito hoje.", "c": 2}, {"t": "Lucas está cansado.", "c": 1}, {"t": "Trovejou durante a noite.", "c": 2}, {"t": "Ele corre todas as manhãs.", "c": 0}], "exp": "Brincar e correr são ações. Ser e estar mostram estado. Chover e trovejar são fenômenos da natureza."}, {"q": "Qual frase tem um verbo que indica fenômeno da natureza?", "opts": ["Ventou muito ontem à noite.", "Rita é muito simpática.", "Os meninos correram até a escola.", "Ela está feliz."], "a": 0, "exp": "Ventar, chover, nevar e trovejar são fenômenos da natureza. Não têm pessoa fazendo a ação."}, {"type": "classify", "q": "Em qual conjugação está cada verbo? Termine em -AR, -ER ou -IR.", "cats": ["1ª conjugação (-ar)", "2ª conjugação (-er)", "3ª conjugação (-ir)"], "items": [{"t": "pegar", "c": 0}, {"t": "comer", "c": 1}, {"t": "partir", "c": 2}, {"t": "lavar", "c": 0}, {"t": "ler", "c": 1}, {"t": "latir", "c": 2}, {"t": "falar", "c": 0}, {"t": "correr", "c": 1}, {"t": "sorrir", "c": 2}], "exp": "Olhe só para a terminação: -ar é 1ª, -er é 2ª e -ir é 3ª."}, {"q": "Verbos terminados em -ar pertencem a qual conjugação?", "opts": ["À 1ª conjugação", "À 2ª conjugação", "À 3ª conjugação", "A nenhuma conjugação"], "a": 0, "exp": "1ª = -ar (cantar, falar, estudar, amar)."}, {"q": "A qual conjugação pertence o verbo \"sorrir\"?", "opts": ["À 1ª conjugação", "À 2ª conjugação", "À 3ª conjugação", "Não pertence a nenhuma"], "a": 2, "exp": "Sorrir termina em -ir e é da 3ª conjugação, junto com partir e ir."}, {"q": "Marque o verbo que NÃO é da 2ª conjugação.", "opts": ["correr", "partir", "entender", "esclarecer"], "a": 1, "exp": "Cuidado com a negação! Correr, entender e esclarecer terminam em -er. Partir termina em -ir (3ª conjugação)."}, {"q": "Em \"Ontem, eu comprei um livro muito interessante\", o verbo está no:", "opts": ["Presente", "Futuro", "Não é um verbo", "Passado"], "a": 3, "exp": "A palavra ONTEM e a forma \"comprei\" mostram que a ação já aconteceu."}, {"type": "classify", "q": "Passado, presente ou futuro? Classifique cada forma do verbo COMER.", "cats": ["Passado", "Presente", "Futuro"], "items": [{"t": "comeram", "c": 0}, {"t": "come", "c": 1}, {"t": "comerá", "c": 2}, {"t": "comi", "c": 0}, {"t": "como", "c": 1}, {"t": "comerão", "c": 2}], "exp": "Passado: comi, comeu, comeram. Presente: como, come, comem. Futuro: comerei, comerá, comerão."}, {"type": "fill", "q": "Hoje eu estudo. Ontem eu ______ (estudar) também.", "accept": ["estudei"], "exp": "No passado, o verbo estudar com \"eu\" fica \"estudei\"."}, {"type": "fill", "q": "Hoje eles fazem a lição. Amanhã eles ______ (fazer) a lição.", "accept": ["farão", "farao"], "exp": "No futuro, fazer com \"eles\" vira \"farão\", com til."}, {"q": "Qual forma do verbo COMER combina com \"nós\" no futuro?", "opts": ["comerão", "comeram", "comeste", "comeremos"], "a": 3, "exp": "Comer, no futuro: comerei, comerás, comerá, comeremos, comereis, comerão."}, {"type": "match", "q": "Ligue cada pessoa ao verbo COMER no presente.", "left": ["Eu", "Tu", "Ele/ela", "Nós", "Eles/elas"], "right": ["como", "comes", "come", "comemos", "comem"], "exp": "O verbo muda de final para combinar com a pessoa: eu como, tu comes, ele come, nós comemos, eles comem."}, {"type": "vf", "q": "Marque Verdadeiro (V) ou Falso (F).", "items": [{"t": "Verbos só indicam ação.", "v": false}, {"t": "O verbo muda de forma de acordo com a pessoa e com o tempo.", "v": true}, {"t": "Chover, trovejar e nevar indicam fenômenos da natureza.", "v": true}, {"t": "Verbos terminados em -er pertencem à 1ª conjugação.", "v": false}], "exp": "O verbo também indica estado e fenômeno. Terminados em -er são da 2ª conjugação."}, {"q": "Em qual frase o verbo está no futuro?", "opts": ["Elas cantaram no coral ontem.", "Elas cantarão no coral amanhã.", "Elas cantam no coral toda semana.", "Elas estão cantando no coral agora."], "a": 1, "exp": "Cantarão = futuro (-ão, com til). Cantaram = passado. Cantam e estão cantando = presente."}]}, {"label": "Verbos em -AM e -ÃO", "fixed": true, "questions": [{"q": "Qual frase está no futuro?", "opts": ["Os meninos correrão amanhã.", "Os meninos correram ontem.", "Os meninos correm agora.", "Os meninos já correram."], "a": 0, "exp": "Correrão (-ÃO, com til) é futuro. Correram (-AM) é passado."}, {"q": "Como se escreve o verbo CANTAR, com \"eles\", no passado?", "opts": ["cantarão", "cantão", "cantaram", "cantarom"], "a": 2, "exp": "No passado, o final é -AM, sem til: cantaram."}, {"type": "fill", "q": "Ontem as meninas ______ (brincar) no pátio.", "accept": ["brincaram"], "exp": "Ontem = passado, então o verbo termina em -AM, sem til."}, {"type": "fill", "q": "Amanhã os alunos ______ (viajar) para o Rio de Janeiro.", "accept": ["viajarão", "viajarao"], "exp": "Amanhã = futuro, então o verbo termina em -ÃO, com til."}, {"type": "classify", "q": "Passado (-AM) ou futuro (-ÃO)? Classifique cada verbo.", "cats": ["Passado (-AM)", "Futuro (-ÃO)"], "items": [{"t": "voltaram", "c": 0}, {"t": "voltarão", "c": 1}, {"t": "comeram", "c": 0}, {"t": "ficarão", "c": 1}, {"t": "bateram", "c": 0}, {"t": "salvarão", "c": 1}], "exp": "O til e o -ÃO aparecem no futuro. Verbos no passado terminam em -AM, sem til."}, {"q": "O que os verbos no futuro têm em comum?", "opts": ["Terminam em -AM, sem til", "Terminam em -ÃO, com til", "Terminam em -OM", "Terminam sempre em -ou"], "a": 1, "exp": "Futuro: conhecerão, mudarão, ganharão, ficarão. Todos com -ÃO."}, {"q": "Qual palavra mostra que o verbo está no futuro?", "opts": ["amanhã", "ontem", "semana passada", "há dois dias"], "a": 0, "exp": "Ontem, semana passada e há dois dias apontam para o passado. Amanhã aponta para o futuro."}, {"type": "match", "q": "Ligue cada forma do verbo BRINCAR ao seu tempo.", "left": ["brincam", "brincaram", "brincarão"], "right": ["Presente", "Passado", "Futuro"], "exp": "Brincam = agora. Brincaram = já brincaram. Brincarão = vão brincar."}, {"type": "vf", "q": "Marque Verdadeiro (V) ou Falso (F).", "items": [{"t": "Ontem, as atletas ficaram no Brasil.", "v": true}, {"t": "Amanhã, as atletas ficaram no Brasil.", "v": false}, {"t": "Na próxima semana, os cavaleiros salvarão a princesa.", "v": true}, {"t": "Ontem, os cavaleiros salvarão a princesa.", "v": false}], "exp": "Ontem pede passado (-AM). Amanhã e próxima semana pedem futuro (-ÃO)."}, {"type": "fill", "q": "Passe para o futuro: \"Os pais ficaram felizes.\" → Os pais ______ felizes.", "accept": ["ficarão", "ficarao"], "exp": "Para o futuro, troque -aram por -arão: ficaram vira ficarão."}, {"type": "fill", "q": "Passe para o passado: \"As cachorras correrão pela rua.\" → As cachorras ______ pela rua.", "accept": ["correram"], "exp": "Para o passado, troque -erão por -eram: correrão vira correram."}, {"q": "Qual frase está escrita corretamente?", "opts": ["Eles disputarão o campeonato ontem.", "Eles disputaram o campeonato amanhã.", "Eles disputarom o campeonato amanhã.", "Eles disputarão o campeonato amanhã."], "a": 3, "exp": "O tempo do verbo tem que combinar com a palavra de tempo: amanhã pede disputarão."}, {"q": "Em qual alternativa os dois verbos estão no passado?", "opts": ["Eles comerão e correram.", "Eles comem e correram.", "Eles comeram e correram.", "Eles comeram e correrão."], "a": 2, "exp": "Passado = -AM nos dois: comeram e correram. As outras misturam passado com presente ou futuro."}]}, {"label": "Concordância verbal e nominal", "fixed": true, "questions": [{"q": "O que é concordância verbal?", "opts": ["Uma regra para escrever as palavras com acento", "O uso da vírgula para chamar alguém", "A regra que faz o verbo e o sujeito combinarem", "A troca da fala do narrador por aspas"], "a": 2, "exp": "O verbo muda para combinar com quem faz a ação, o sujeito."}, {"q": "O sujeito é a palavra que mostra:", "opts": ["Onde a ação acontece", "Quando a ação acontece", "Como a ação termina", "Quem ou o que faz a ação"], "a": 3, "exp": "Pense no sujeito como o capitão do time: é quem faz a ação."}, {"q": "Qual frase está correta?", "opts": ["As crianças brinca no parque.", "As crianças brincam no parque.", "A criança brincam no parque.", "As criança brincam no parque."], "a": 1, "exp": "Sujeito no plural pede verbo no plural. Uma só criança pede verbo no singular."}, {"type": "fill", "q": "O gato ______ (correr) atrás da bola.", "accept": ["corre"], "exp": "Um só gato, uma só ação: verbo no singular."}, {"type": "fill", "q": "Os gatos ______ (correr) atrás da bola.", "accept": ["correm"], "exp": "Vários gatos, várias ações: verbo no plural."}, {"type": "classify", "q": "A concordância está correta (C) ou incorreta (I)?", "cats": ["Correta", "Incorreta"], "items": [{"t": "Os alunos e a professora farão uma visita.", "c": 0}, {"t": "As pessoas gosta de chocolate.", "c": 1}, {"t": "Os meninos estudaram para a prova.", "c": 0}, {"t": "Eles disputou a final.", "c": 1}, {"t": "Um único homem ganhou na loteria.", "c": 0}, {"t": "Os jornalistas fotografou o evento.", "c": 1}], "exp": "Se o sujeito está no plural, o verbo também. Nas frases incorretas faltou o plural no verbo."}, {"type": "fill", "q": "Corrija: \"Os meninos estudou para a prova.\" → Os meninos s S", "Só acrescentamos S", "Acrescentamos ES"], "a": 1, "exp": "Barril vira barris e funil vira funis."}, {"type": "classify", "q": "Em qual regra cada palavra se encaixa?", "cats": ["Só acrescenta S (-U)", "Tira o L e põe IS (-AL, -EL, -OL)", "Tira o L e põe S (-IL)"], "items": [{"t": "mingau", "c": 0}, {"t": "caracol", "c": 1}, {"t": "barril", "c": 2}, {"t": "curral", "c": 1}, {"t": "troféu", "c": 0}, {"t": "funil", "c": 2}, {"t": "girassol", "c": 1}, {"t": "degrau", "c": 0}], "exp": "Olhe a terminação: U só ganha S, AL/EL/OL viram IS e IL perde o L e ganha S."}, {"type": "match", "q": "Ligue cada palavra ao seu plural.", "left": ["pincel", "túnel", "Sol", "varal"], "right": ["pincéis", "túneis", "sóis", "varais"], "exp": "Terminadas em EL, OL e AL: tira o L e põe IS. Preste atenção nos acentos: pincéis, sóis."}, {"type": "fill", "q": "Escreva o plural de \"caracol\".", "accept": ["caracóis", "caracois"], "exp": "Terminada em OL: tira o L e põe IS. O O ganha acento: caracóis."}, {"type": "fill", "q": "Escreva o plural de \"barril\".", "accept": ["barris"], "exp": "Terminada em IL: tira o L e acrescenta S."}, {"type": "fill", "q": "Escreva o plural de \"automóvel\".", "accept": ["automóveis", "automoveis"], "exp": "Terminada em EL: tira o L e põe IS. Sem acento no plural: automóveis."}, {"q": "Marque o plural ERRADO.", "opts": ["funils", "céus", "girassóis", "degraus"], "a": 0, "exp": "Cuidado com ERRADO! Funil termina em IL: o plural certo é funis."}, {"type": "vf", "q": "Marque Verdadeiro (V) ou Falso (F).", "items": [{"t": "O plural de \"hotel\" é \"hotéis\".", "v": true}, {"t": "O plural de \"mingau\" é \"mingais\".", "v": false}, {"t": "O plural de \"Natal\" é \"Natais\".", "v": true}, {"t": "O plural de \"sutil\" é \"sutiles\".", "v": false}], "exp": "Mingau + S = mingaus. Sutil perde o L e ganha S: sutis."}, {"q": "Qual é o plural de \"Sol\"?", "opts": ["sols", "soles", "soís", "sóis"], "a": 3, "exp": "Terminada em OL: tira o L e põe IS, e o O ganha acento: ": "No direto a fala é reproduzida exatamente, com travessão e dois-pontos; no indireto o narrador conta a fala com suas palavras, usando \"que\" e sem travessão. Semelhança: nos dois alguém fala e o narrador conta o que foi dito, com verbos como disse, perguntou e respondeu.", "exp": "Compare: exatidão da fala, sinais de pontuação e papel do narrador. Semelhança: os dois contam o que alguém disse."}]}, {"label": "Aposto e vocativo", "fixed": true, "questions": [{"q": "O que é o aposto?", "opts": ["Palavra que chama alguém", "Palavra ou frase que explica um substantivo que aparece antes", "Palavra que indica ação", "Palavra que mostra o plural"], "a": 1, "exp": "O aposto explica. Ele aparece quase sempre entre vírgulas."}, {"q": "Para que serve o vocativo?", "opts": ["Para explicar um substantivo", "Para mostrar o tempo do verbo", "Para dar a ordem das palavras", "Para chamar alguém ou dirigir a fala a um ouvinte"], "a": 3, "exp": "O vocativo evoca, chama o ouvinte, real ou imaginário."}, {"q": "Qual é a boa dica para identificar o vocativo?", "opts": ["Ele sempre vem no fim da frase", "Ele é sempre um verbo", "Ele sempre tem artigo", "Ele está sempre separado por vírgula"], "a": 3, "exp": "Vírgula é a pista principal do vocativo. Ele pode estar no início, no meio ou no fim."}, {"q": "Qual palavra é o vocativo em \"Amiga, você sabe que horas são?\"", "opts": ["você", "Amiga", "horas", "sabe"], "a": 1, "exp": "\"Amiga\" é quem está sendo chamada. Está separada por vírgula."}, {"q": "Qual é o aposto em \"Lucas, o goleiro do time, fez uma defesa incrível\"?", "opts": ["o goleiro do time", "Lucas", "uma defesa incrível", "fez"], "a": 0, "exp": "\"O goleiro do time\" explica quem é o Lucas e está entre vírgulas."}, {"type": "classify", "q": "Aposto ou vocativo? Classifique o termo entre vírgulas de cada frase.", "cats": ["Aposto", "Vocativo"], "items": [{"t": "Carlos, venha aqui!", "c": 1}, {"t": "Ana, minha irmã, mora longe.", "c": 0}, {"t": "Gente, vamos começar!", "c" <script>
// ===== TRIMESTRE =====
var currentTri = 2;
function setTri(n){
  currentTri = n;
  document.getElementById('tri-1').classList.toggle('active', n===1);
  document.getElementById('tri-2').classList.toggle('active', n===2);
  document.getElementById('tri-3').classList.toggle('active', n===3);
  // Painel
  document.getElementById('dash-1tri').style.display = (n===1)?'':'none';
  document.getElementById('dash-2tri').style.display = (n===2)?'':'none';
  document.getElementById('dash-3tri').style.display = (n===3)?'':'none';
  hideDetail();
  // Limpa as navs para forçar rebuild filtrado por trimestre
  ['sim-nav','mind-nav','res-nav','qf'].forEach(function(id){
    var el=document.getElementById(id); if(el) el.innerHTML='';
  });
  document.getElementById('sim-questions').innerHTML='';
  document.getElementById('res-content').innerHTML='';
  document.getElementById('qbox').innerHTML='';
  // Re-renderiza a aba que está ativa
  var active = document.querySelector('.screen.active');
  if(active){
    var id=active.id;
    if(id==='sim') buildSimNav();
    if(id==='mind') buildMindNav();
    if(id==='res') buildResNav();
    if(id==='quiz'){buildQF();var f=document.querySelector('.qf-btn');if(f)startQuiz('all',f);}
  }
}
// Atalho do card do 2º tri direto para o simulado
function goSim(key){
  showTab('sim','#BA7517');
  var s=SIMS.find(function(x){return x.key===key;});
  var btns=document.querySelectorAll('.sim-btn');
  btns.forEach(function(b){ if(b.dataset.key===key){ b.click(); } });
}
// Aviso reutilizável para abas sem conteúdo no trimestre
function triEmptyHTML(ico,title,msg){
  return '<div class="tri-empty"><span class="ico">'+ico+'</span><h3>'+title+'</h3><p>'+msg+'</p>'
    +'<button onclick="showTab(\'sim\',\'#BA7517\')">📋 Ir para os Simulados</button></div>';
}

// ===== TABS =====
function showTab(id,col){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>{t.classList.remove('active');t.style.background='';t.style.color='';t.style.borderColor='var(--border)'});
  document.getElementById(id).classList.add('active');
  var btn=document.getElementById('t-'+id);
  btn.classList.add('active');btn.style.background=col;btn.style.color='#fff';btn.style.borderColor=col;
  if(id==='quiz'){buildQF();var f=document.querySelector('.qf-btn');if(f)startQuiz('all',f);}
  if(id==='sim') buildSimNav();
  if(id==='mind') buildMindNav();
  if(id==='res') buildResNav();
}

// ===== DETAIL =====
function showDetail(key){
  var d=DETAIL[key];
  document.getElementById('dash-main').style.display='none';
  var p=document.getElementById('dash-detail');p.style.display='block';
  var lb=d.lang==='en'?'background:#E6F1FB;color:#0C447C':'background:#FBEAF0;color:#72243E';
  var h='<button class="detail-back" onclick="hideDetail()">← Back / Voltar</button>';
  h+='<div class="detail-title">'+d.title+'<span class="lang-pill" style="'+lb+'">'+d.lang.toUpperCase()+'</span></div>';
  h+='<div class="topic-grid">';
  d.topics.forEach(t=>{
    h+='<div class="topic-card" style="background:'+d.light+';color:'+d.dark+'"><h4>'+t.h+'</h4><ul>';
    t.items.forEach(i=>{h+='<li>'+i+'</li>';});
    h+='</ul><div class="activity"><strong>'+(d.lang==='en'?'⚡ Try this':'⚡ Atividade')+'</strong>'+t.act+'</div></div>';
  });
  h+='</div>';p.innerHTML=h;
}
function hideDetail(){document.getElementById('dash-main').style.display='';document.getElementById('dash-detail').style.display='none';document.getElementById('dash-detail').innerHTML='';}

// ===== QUIZ =====
var cQ=[],qi=0,sc=0,ans=false,af='all';
var CATS=[['all','Todas / All','#2C2C2A'],['science','🌿 Science','#1D9E75'],['ciencias','🗺️ Ciências','#378ADD'],['portugues','✏️ Português','#D4537E'],['mat','🔢 Math','#BA7517'],['la','📖 Lang Arts','#E24B4A'],['social','🌎 Social','#5F5E5A'],['geohist','🏛️ Geo & Hist','#7F77DD']];
function buildQF(){
  var w=document.getElementById('qf');
  var prog=document.querySelector('#quiz .prog-bar');
  if(currentTri!==1){
    if(w){w.style.display='none';w.innerHTML='';}
    if(prog)prog.style.display='none';
    document.getElementById('qbox').innerHTML=triEmptyHTML('🎯','Quiz do '+currentTri+'º trimestre em breve','O quiz rápido deste trimestre entra com o conteúdo do caderno. Por enquanto, treina pelos Simulados.');
    return;
  }
  if(w)w.style.display='';
  if(prog)prog.style.display='';
  if(w.childElementCount)return;
  CATS.forEach((c,i)=>{
    var b=document.createElement('button');b.className='qf-btn'+(i===0?' active':'');
    b.textContent=c[1];if(i===0){b.style.background=c[2];b.style.color='#fff';b.style.borderColor=c[2];}
    b.onclick=()=>startQuiz(c[0],b);w.appendChild(b);
  });
}
function startQuiz(filter,btn){
  af=filter;
  document.querySelectorAll('.qf-btn').forEach(b=>{b.classList.remove('active');b.style.background='';b.style.color='var(--muted)';b.style.borderColor='var(--border)';});
  if(btn){btn.classList.add('active');var cc=CATS.find(c=>c[0]===filter);btn.style.background=cc[2];btn.style.color='#fff';btn.style.borderColor=cc[2];}
  cQ=(filter==='all'?shuf(QUIZ.slice()):shuf(QUIZ.filter(q=>q.cat===filter))).map(prepQ);
  qi=0;sc=0;ans=false;renderQ();
}
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
// Embaralha as alternativas de uma pergunta e remapeia o índice da resposta certa (a).
// Opções "coringa" (Both / Neither / As duas / Nenhuma...) ficam no fim, na ordem original.
// Pergunta com noShuffle:true, tipo fill ou sem opts passa direto, sem mudança.
var TAIL_RE=/^(both\b|neither\b|none of the\b|all of the\b|as duas\b|ambas\b|nenhum[a]?\b|todas as anteriores|todas as alternativas)/i;
function prepQ(q){
  if(!q||q.noShuffle) return q;
  var t=q.type||'mc';
  var c={};for(var k in q)c[k]=q[k];
  if(t==='mc'||t==='multi'){
    if(!q.opts) return q;
    var idx=q.opts.map(function(_,i){return i;});
    var tail=idx.filter(function(i){return TAIL_RE.test(String(q.opts[i]).trim());});
    var head=shuf(idx.filter(function(i){return tail.indexOf(i)<0;}));
    var order=head.concat(tail);
    c.opts=order.map(function(i){return q.opts[i];});
    if(t==='mc') c.a=order.indexOf(q.a);
    else c.answers=q.answers.map(function(i){return order.indexOf(i);}).sort(function(x,y){return x-y;});
    return c;
  }
  if(t==='vf'||t==='classify'){ c.items=shuf(q.items.slice()); return c; }
  if(t==='match'){ var L=q.left.map(function(_,i){return i;}); c.lorder=shuf(L.slice()); c.rorder=shuf(q.right.map(function(_,i){return i;})); return c; }
  if(t==='order'){
    var n=q.items.map(function(_,i){return i;}), d=shuf(n.slice()), tries=0;
    while(d.every(function(v,i){return v===i;}) && n.length>1 && tries++<20) d=shuf(n.slice());
    c.disp=d; return c;
  }
  return q;
}
function renderQ(){
  document.getElementById('prog').style.width=Math.round(qi/cQ.length*100)+'%';
  var box=document.getElementById('qbox');
  if(qi>=cQ.length){
    var pct=Math.round(sc/cQ.length*100);
    var bg=pct>=80?'var(--green-l)':'var(--amber-l)';var col=pct>=80?'var(--green-d)':'var(--amber-d)';
    var emoji=pct>=80?'🌟':pct>=60?'👍':'💪';
    box.innerHTML='<div class="score-card show" style="background:'+bg+';color:'+col+'"><h2>'+emoji+' '+sc+'/'+cQ.length+'</h2><p>'+pct+'%'+(pct>=80?' — Excellent! Ready for the exam!':pct>=60?' — Good! Review the red answers.':' — Keep practicing!')+'</p><button class="retry-btn" onclick="startQuiz(af,null)">🔄 Play again</button></div>';
    document.getElementById('prog').style.width='100%';return;
  }
  var q=cQ[qi];
  var ce={science:'🌿',ciencias:'🗺️',portugues:'✏️',mat:'🔢',la:'📖',geohist:'🏛️',social:'🌎'};
  var lb=q.lang==='en'?'background:#E6F1FB;color:#0C447C':'background:#FBEAF0;color:#72243E';
  var L=['A','B','C','D'];
  var h='<div class="q-meta">'+ce[q.cat]+' Q'+(qi+1)+'/'+cQ.length+'<span class="lang-pill" style="'+lb+'">'+q.lang.toUpperCase()+'</span></div>';
  h+='<div class="q-text">'+q.q+'</div><div class="opts">';
  q.opts.forEach((o,i)=>{h+='<button class="opt" onclick="doAns('+i+')"><span class="opt-letter">'+L[i]+'</span>'+o+'</button>';});
  h+='</div><div class="feedback" id="fb"></div><button class="next-btn" id="nxt" style="background:'+NC[q.cat]+'" onclick="nextQ()">Next →</button>';
  box.innerHTML=h;ans=false;
}
function doAns(i){
  if(ans)return;ans=true;
  var q=cQ[qi];var opts=document.querySelectorAll('.opt');
  opts[q.a].classList.add('correct');
  var fb=document.getElementById('fb');
  if(i===q.a){sc++;fb.textContent='✅ Correct! '+q.exp;fb.className='feedback ok';}
  else{opts[i].classList.add('wrong');fb.textContent='❌ Answer: '+['A','B','C','D'][q.a]+'. '+q.exp;fb.className='feedback bad';}
  document.getElementById('nxt').style.display='inline-block';
}
function nextQ(){qi++;renderQ();}

// ===== MAPA MENTAL NAV =====
var MINDS=[
  ['science','🌿 Science','#1D9E75',1],
  ['ciencias','🗺️ Ciências','#378ADD',1],
  ['portugues','✏️ Português','#D4537E',1],
  ['matpt','🔢 Matemática PT','#BA7517',1],
  ['mat','🔢 Math EN','#633806',1],
  ['ciencias2','💧 Ciências','#378ADD',2],
  ['la','📖 Language Arts','#E24B4A',2],
  ['geohist','🏛️ Geo & Hist','#7F77DD',1],
  ['social','🌎 Social Studies','#2C2C2A',1],
  ['science2','🔬 Science','#1D9E75',2],
  ['portugues2','📚 Português','#D4537E',2],
  ['matematica2','🔢 Matemática','#BA7517',2],
  ['social3','🌎 Social Studies','#5F5E5A',3],
  ['science3','🔬 Science','#1D9E75',3],
  ['ciencias3','🧫 Ciências','#378ADD',3],
  ['portugues3','📚 Português','#D4537E',3],
  ['social2','🌎 Social Studies','#5F5E5A',2],
  ['geohist2','🏛️ Geo & História','#7F77DD',2]
];
function buildMindNav(){
  var nav=document.getElementById('mind-nav');
  if(!nav)return;
  var hint=document.querySelector('#mind .mind-hint');
  var maps=document.querySelectorAll('#mind .mind-map');
  var empty=document.getElementById('mind-empty');
  var list=MINDS.filter(function(m){return (m[3]||1)===currentTri;});
  if(nav.childElementCount && nav.dataset.tri==String(currentTri))return;
  nav.innerHTML=''; nav.dataset.tri=String(currentTri);
  // esconde todos os mapas; mostra só os do trimestre atual
  var keys=list.map(function(m){return 'mm-'+m[0];});
  maps.forEach(function(m){
    m.classList.remove('active');
    m.style.display = keys.indexOf(m.id)>=0 ? '' : 'none';
  });
  if(!list.length){
    nav.style.display='none'; if(hint)hint.style.display='none';
    if(!empty){empty=document.createElement('div');empty.id='mind-empty';document.getElementById('mind').appendChild(empty);}
    empty.style.display='';
    empty.innerHTML=triEmptyHTML('🌿','Mapas do '+currentTri+'º trimestre em breve','Os mapas deste trimestre entram com o conteúdo do caderno. Por enquanto, treina pelos Simulados.');
    return;
  }
  if(empty)empty.style.display='none';
  nav.style.display=''; if(hint)hint.style.display='';
  var firstMap=document.getElementById('mm-'+list[0][0]); if(firstMap)firstMap.classList.add('active');
  list.forEach((m,i)=>{
    var b=document.createElement('button');
    b.className='mind-btn'+(i===0?' active':'');

function startSimTopic(label){
  currentTopicLabel = label;
  var sub = SIMS.find(function(s){return s.key===currentSimKey;});

  if(!subtopic || !subtopic.questions) return;

  // exceto nos simulados com texto de leitura (as perguntas seguem o texto) ou fixedOrder:true.
  var qs = subtopic.questions.slice();
  if(!(subtopic.context || subtopic.ctxParas || subtopic.fixedOrder)) shuf(qs);
  simQuestions = qs.map(prepQ);
  renderSimQuestions(sub, subtopic);
}

// ===== TIPOS DE PERGUNTA =====
// mc | fill | vf | multi | order | match | classify | short
var VF_LABELS={pt:['Verdadeiro','Falso'],en:['True','False']};
function rowsSpec(q,lang){
  if(q.type==='vf'){
    var L=VF_LABELS[lang]||VF_LABELS.en;
    return {mode:'chip',choices:L,disp:[0,1],rows:q.items.map(function(it){return {t:it.t,ok:it.v?0:1};})};
  }
  if(q.type==='classify'){
    return {mode:'chip',choices:q.cats,disp:q.cats.map(function(_,i){return i;}),rows:q.items.map(function(it){return {t:it.t,ok:it.c};})};
  }
  // match: linha i da esquerda combina com right[i]
  var lo=q.lorder||q.left.map(function(_,i){return i;});
  return {mode:'select',choices:q.right,disp:q.rorder||q.right.map(function(_,i){return i;}),rows:lo.map(function(i){return {t:q.left[i],ok:i};})};
}
function renderQBody(q,i,lang,color,letters){
  var pt=lang==='pt', h='', t=q.type||'mc';
  if(t==='fill'){
    return '<div style="margin-top:10px"><input id="fin-'+i+'" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="'
      +(pt?'escreva a resposta...':'type your answer...')
      +'" style="width:100%;box-sizing:border-box;padding:12px 14px;border:2px solid #e0ddd8;border-radius:12px;font-size:16px;font-weight:700;font-family:Nunito,sans-serif;color:#1a1a1a;background:#fff;outline:none" onfocus="this.style.borderColor=\''+color+'\'" onblur="this.style.borderColor=\'#e0ddd8\'"></div>';
  }
  if(t==='short'){
    return '<textarea class="q-short" id="shn-'+i+'" placeholder="'+(pt?'escreva sua resposta...':'write your answer...')+'"></textarea><div id="shm-'+i+'"></div>';
  }
  if(t==='mc'||t==='multi'){
    if(t==='multi') h+='<div class="q-hint">'+(pt?'Marque todas as corretas':'Select all that apply')+'</div>';
    h+='<div class="mc-opts">';
    q.opts.forEach(function(opt,j){
      h+='<button class="mc-opt" onclick="'+(t==='multi'?'pickSimMulti':'pickSimMC')+'(this,'+i+','+j+')"><span class="mc-letter">'+letters[j]+'</span>'+escHtml(opt)+'</button>';
    });
    return h+'</div>';
  }
  if(t==='order'){
    h+='<div class="q-hint">'+(pt?'Toque na ordem certa (toque de novo para desfazer)':'Tap in the right order (tap again to undo)')+'</div>';
    q.disp.forEach(function(k){
      h+='<button class="ord-btn" data-k="'+k+'" onclick="pickOrder(this,'+i+','+k+')"><span class="ord-n"></span>'+escHtml(q.items[k])+'</button>';
    });
    return h;
  }
  // vf | classify | match
  var sp=rowsSpec(q,lang);
  sp.rows.forEach(function(r,ri){
    h+='<div class="chip-row"><div class="chip-t">'+escHtml(r.t)+'</div>';
    if(sp.mode==='chip'){
      h+='<div class="chip-g">';
      sp.disp.forEach(function(c){ h+='<button class="chip" data-c="'+c+'" onclick="pickRow(this,'+i+','+ri+','+c+')">'+escHtml(sp.choices[c])+'</button>'; });
      h+='</div>';
    } else {
      h+='<select class="q-sel" onchange="pickRowSel(this,'+i+','+ri+')"><option value="">'+(pt?'escolha...':'choose...')+'</option>';
      sp.disp.forEach(function(c){ h+='<option value="'+c+'">'+escHtml(sp.choices[c])+'</option>'; });
      h+='</select>';
    }
    h+='</div>';
  });
  return h;
}
function pickRow(el,qi,ri,c){
  var g=el.parentElement; g.querySelectorAll('.chip').forEach(function(x){x.classList.remove('selected');});
  el.classList.add('selected');
  var a=simAnswers[qi]||(simAnswers[qi]=[]); a[ri]=c;
}
function pickRowSel(el,qi,ri){
  var a=simAnswers[qi]||(simAnswers[qi]=[]); a[ri]=el.value===''?undefined:parseInt(el.value,10);
}
function pickSimMulti(el,qi,j){
  var btn=el.closest('.mc-opt')||el; btn.classList.toggle('selected');
  var a=simAnswers[qi]||(simAnswers[qi]=[]); var p=a.indexOf(j);
  if(p>=0)a.splice(p,1); else a.push(j);
}
function pickOrder(el,qi,k){
  var a=simAnswers[qi]||(simAnswers[qi]=[]); var p=a.indexOf(k);
  if(p>=0)a.splice(p,1); else a.push(k);
  el.parentElement.querySelectorAll('.ord-btn').forEach(function(b){
    var pos=a.indexOf(parseInt(b.dataset.k,10));
    b.classList.toggle('selected',pos>=0);
    b.querySelector('.ord-n').textContent=pos>=0?(pos+1):'';
  });
}
// Corrige uma pergunta de tipo novo. Devolve fração 0..1 (null = não pontua, ex.: short).
function gradeQ(q,i,lang,fb){
  var pt=lang==='pt', t=q.type, blk=document.getElementById('qblock-'+i), ans=simAnswers[i], f=0;
  function say(ok,txt){ if(fb){fb.className='q-fb show '+(ok?'ok':'bad');fb.textContent=(ok?'✅ ':'❌ ')+txt;} }
  if(t==='short'){
    var ta=document.getElementById('shn-'+i), m=document.getElementById('shm-'+i);
    if(ta)ta.disabled=true;
    if(m)m.innerHTML='<div class="q-model">'+(pt?'📝 Resposta modelo: ':'📝 Model answer: ')+escHtml(q.model||'')+'</div>';
    if(fb){fb.className='q-fb show ok';fb.textContent='💡 '+(pt?'Compare com a sua e corrija você mesma. ':'Compare with yours and check it yourself. ')+(q.exp||'');}
    return null;
  }
  if(t==='multi'){
    var opts=blk.querySelectorAll('.mc-opt'), pick=ans||[], good=0, bad=0;
    q.opts.forEach(function(_,j){
      var isR=q.answers.indexOf(j)>=0, isP=pick.indexOf(j)>=0;
      if(isR&&isP)good++; if(!isR&&isP)bad++;
      opts[j].classList.remove('selected');
      if(isR)opts[j].classList.add('correct'); else if(isP)opts[j].classList.add('wrong');
    });
    f=Math.max(0,(good-bad)/q.answers.length);
    say(f===1,(f===1?'':(pt?'Certas: ':'Correct: ')+q.answers.map(function(j){return ['A','B','C','D','E','F'][j];}).join(', ')+'. ')+q.exp);
    return f;
  }
  if(t==='order'){
    var pickd=ans||[], btns=blk.querySelectorAll('.ord-btn'), n=q.items.length, ok=0;
    for(var k=0;k<n;k++){ if(pickd[k]===k)ok++; }
    btns.forEach(function(b){
      var kk=parseInt(b.dataset.k,10), pos=pickd.indexOf(kk);
      b.classList.remove('selected');
      b.querySelector('.ord-n').textContent=kk+1;
      b.classList.add(pos===kk?'correct':'wrong');
    });
    f=ok/n;
    say(f===1,(f===1?'':(pt?'A ordem certa está nos números. ':'The right order is in the numbers. '))+q.exp);
    return f;
  }
  // vf | classify | match
  var sp=rowsSpec(q,lang), rows=blk.querySelectorAll('.chip-row'), ok2=0, pk=ans||[];
  sp.rows.forEach(function(r,ri){
    var row=rows[ri], good=pk[ri]===r.ok;
    if(good)ok2++;
    if(sp.mode==='chip'){
      row.querySelectorAll('.chip').forEach(function(c){
        var cv=parseInt(c.dataset.c,10); c.classList.remove('selected');
        if(cv===r.ok)c.classList.add('correct'); else if(cv===pk[ri])c.classList.add('wrong');
      });
    } else {
      var sel=row.querySelector('select'); sel.disabled=true; sel.classList.add(good?'correct':'wrong');
      if(!good){ var sp2=document.createElement('span'); sp2.className='chip-t'; sp2.style.flex='0 0 100%'; sp2.style.color='var(--green-d)'; sp2.textContent='→ '+sp.choices[r.ok]; row.appendChild(sp2); }
    }
  });
  f=ok2/sp.rows.length;
  say(f===1,(f===1?'':ok2+'/'+sp.rows.length+' '+(pt?'certas. ':'correct. '))+q.exp);
  return f;
}

function normAns(s){
  return (s||'').toString().toLowerCase().trim()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[.,;:!?"'’]/g,'')
    .replace(/\s+/g,' ');
}

function pickSimMC(el,qIdx,optIdx){
  var btn = el.closest('.mc-opt')||el;
  var opts = btn.parentElement.querySelectorAll('.mc-opt');
  opts.forEach(function(o){o.classList.remove('selected');});
  btn.classList.add('selected');
  simAnswers[qIdx]=optIdx;
}

function checkDynamicSim(){
  var score=0;
  var total=simQuestions.filter(function(q){return q.type!=='short';}).length;
  var sub=SIMS.find(function(s){return s.key===currentSimKey;});
  var lang=sub?sub.lang:'en';

  simQuestions.forEach(function(q,i){
    var fb=document.getElementById('qfb-'+i);
    var blkEl=document.getElementById('qblock-'+i); if(blkEl)blkEl.classList.add('done');
    if(q.type && q.type!=='mc' && q.type!=='fill'){
      var fr=gradeQ(q,i,lang,fb); if(fr!==null)score+=fr; return;
    }
    var opts=document.querySelectorAll('#qblock-'+i+' .mc-opt');
    var chosen=simAnswers[i];
    var correct=q.a;

    if(q.type==='fill'){
      var inp=document.getElementById('fin-'+i);
      var typed=inp?normAns(inp.value):'';
      var ok=false;
      (q.accept||[]).forEach(function(a){ if(normAns(a)===typed && typed!=='') ok=true; });
      if(inp){ inp.style.borderColor = ok?'#1D9E75':'#E24B4A'; inp.style.background = ok?'#E1F5EE':'#FCEBEB'; inp.disabled=true; }
      if(ok){ score++; if(fb){fb.className='q-fb show ok';fb.textContent='✅ '+q.exp;} }
      else { if(fb){fb.className='q-fb show bad';fb.textContent='❌ '+(lang==='pt'?'Resposta: ':'Answer: ')+(q.accept&&q.accept[0]?q.accept[0]:'')+'. '+q.exp;} }
      return;
    }

    if(chosen===undefined){
      if(fb){fb.className='q-fb show bad';fb.textContent='❌ '+(lang==='pt'?'Selecione uma opção!':'Select an option!');}
      if(opts[correct]) opts[correct].classList.add('correct');
      return;
    }

    opts.forEach(function(o){o.classList.remove('selected');});
    if(chosen===correct){
      score++;
      opts[correct].classList.add('correct');
      if(fb){fb.className='q-fb show ok';fb.textContent='✅ '+q.exp;}
    } else {
      opts[chosen].classList.add('wrong');
      opts[correct].classList.add('correct');
      if(fb){fb.className='q-fb show bad';fb.textContent='❌ '+q.exp;}
    }
  });

  score=Math.round(score*10)/10;
  var pct=total?Math.round(score/total*100):100;
  var rb=document.getElementById('rb-dynamic');
  var rh=document.getElementById('rb-dynamic-h');
  var rp=document.getElementById('rb-dynamic-p');
  var emoji=pct>=80?'🌟':pct>=60?'👍':'💪';
  var msg=pct>=80?(lang==='pt'?'Excelente! Pronta para a prova!':'Excellent! Ready for the exam!')
                 :pct>=60?(lang==='pt'?'Bom trabalho! Revise as vermelhas.':'Good job! Review the red answers.')
                 :(lang==='pt'?'Continue praticando!':'Keep practicing!');
  rh.textContent=emoji+' '+score+'/'+total+' ('+pct+'%)';
  rp.textContent=msg;
  rb.style.background=pct>=80?'var(--green-l)':'var(--amber-l)';
  rb.style.color=pct>=80?'var(--green-d)':'var(--amber-d)';
  rb.className='result-box show';
  document.getElementById('sc-dynamic').textContent=score+'/'+total;
  // scroll pro resultado
  rb.scrollIntoView({behavior:'smooth',block:'center'});
}

function retrySimTopic(){
  startSimTopic(currentTopicLabel);
}

function darken(hex){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return '#'+[Math.max(0,r-40),Math.max(0,g-40),Math.max(0,b-40)].map(function(x){return x.toString(16).padStart(2,'0');}).join('');
}
function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

showTab('dash','#2C2C2A');
setTri(2);
